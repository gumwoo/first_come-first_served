# Alertmanager가 쓸 Slack webhook URL을 SSM에서 동기화한다. 저장소가 public이라 URL을 values에 적지 않고
# `api_url_file`로 파일 마운트해 읽힌다.
# 값은 사람이 한 번 SSM에 넣는다(없으면 bootstrap.sh가 put-parameter 명령을 안내하고 멈춘다).
# ClusterSecretStore라 flowticket 네임스페이스와 같은 스토어를 재사용한다.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: flowticket-alert-slack
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-ssm
    kind: ClusterSecretStore
  target:
    # 이름이 kube-prometheus-stack.values.yaml의 alertmanagerSpec.secrets 와 일치해야 한다.
    # 어긋나면 Alertmanager 파드가 마운트를 못 찾아 기동에 실패한다.
    name: flowticket-alert-slack
    creationPolicy: Owner
  data:
    # 키 이름이 곧 마운트되는 파일 이름이 된다:
    #   /etc/alertmanager/secrets/flowticket-alert-slack/webhook-url
    - { secretKey: webhook-url, remoteRef: { key: /flowticket/SLACK_ALERT_WEBHOOK_URL } }
