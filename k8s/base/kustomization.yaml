apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: flowticket

resources:
  - namespace.yaml
  - configmap.yaml
  - api-deployment.yaml
  - api-hpa.yaml
  - api-pdb.yaml
  - web-deployment.yaml
  - web-hpa.yaml
  - ingress.yaml

# 이미지 레지스트리·태그는 **오버레이가 정한다**(k8s/overlays/).
# base에 images 변환을 두면 이름이 먼저 바뀌어 오버레이의 images가 매칭할 대상을 잃는다
# — 실제로 그렇게 작성했다가 오버레이 값이 무시되는 것을 렌더링에서 확인했다.
#
# 그래서 base는 Deployment의 `flowticket-api:REPLACE_TAG` 를 그대로 둔다.
# 이 상태로는 pull이 불가능하며(의도), 오버레이 없이 apply할 수 없다.
