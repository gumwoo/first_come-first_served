# Alertmanager가 쓸 Slack webhook URL을 AWS에서 동기화한다.
#
# ⚠️ **URL은 Git에 들어가지 않는다.** values.yaml에 적으면 그 순간 공개 저장소에 비밀이 박힌다
# (이 저장소는 public이다). Alertmanager는 `api_url_file`을 지원하므로 파일로 마운트해 읽힌다.
#
# 값은 사람이 한 번 넣는다:
#   aws ssm put-parameter --name /flowticket/SLACK_ALERT_WEBHOOK_URL --type SecureString --value '<URL>'
#
# ClusterSecretStore라 flowticket 네임스페이스의 것과 같은 스토어를 재사용한다
# (SecretStore였다면 monitoring에 하나 더 만들어야 했다).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: flowticket-alert-slack
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-ssm
    kind: ClusterSecretStore
  target:
    # 이름이 kube-prometheus-stack.values.yaml의 alertmanagerSpec.secrets 와 일치해야 한다.
    # 어긋나면 파드가 마운트를 못 찾아 기동에 실패한다 — 알림이 안 오는 게 아니라 안 뜬다.
    name: flowticket-alert-slack
    creationPolicy: Owner
  data:
    # 키 이름이 곧 마운트되는 파일 이름이 된다:
    #   /etc/alertmanager/secrets/flowticket-alert-slack/webhook-url
    - { secretKey: webhook-url, remoteRef: { key: /flowticket/SLACK_ALERT_WEBHOOK_URL } }
