# 위반: probe가 관리 포트(8081)의 actuator 경로를 본다.
# 관리 포트는 별도 톰캣이라 메인 포트(8080) 요청 스레드가 포화돼도 probe가 성공한다(TS-041).
apiVersion: v1
kind: ConfigMap
metadata:
  name: flowticket-api-config
  namespace: flowticket
data:
  MANAGEMENT_SERVER_PORT: "8081"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flowticket-api
  namespace: flowticket
spec:
  selector:
    matchLabels: { app: flowticket-api }
  template:
    metadata:
      labels: { app: flowticket-api }
    spec:
      containers:
        - name: api
          image: flowticket-api:REPLACE_TAG
          env:
            - name: TZ
              value: UTC
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8081 }
