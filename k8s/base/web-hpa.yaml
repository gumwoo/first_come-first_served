# web 수평 확장. 600 rps 실측에서 첫 실패 지점이 web 티어였다(ALB → web target 구간,
# ELB_5XX == TargetConnectionError, Target_5XX 0). api만 늘려도 앞단 web이 막히면 502가 난다.
#
# 노드 예산(ADR-025 이후): api는 requests 1100m로 노드당 하나라 노드 수를 정하고(CA), web은 그 노드들의 남는 자리에 들어간다.
# 노드별로 본다(합계가 아니라): flowticket 밖 요청이 노드별 410·600·750m(측정 세션 20261007-e2e)라 api를 놓고 남는 자리는 420·230·80m —
# web(300m)은 한 노드에만 들어가 web 2개 중 하나는 4번째 노드가 필요하다(계산). 노드 3대 안에 가두던 이전 예산식은 더 쓰지 않는다.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: flowticket-web
  namespace: flowticket
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: flowticket-web }
  minReplicas: 2
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        # api와 같은 기준을 쓴다. requests 300m 기준 180m을 넘으면 확장.
        # 실측상 600 rps에서 web은 파드당 약 0.59 core를 썼다. 4파드로도 타깃(180m)에
        # 도달하지 못하고 상한에 붙을 가능성이 높다. 그때 더 늘리려면 노드가 필요하다(ADR-025 이후 CA가 노드를 붙인다 — 노드 그룹 상한 안에서).
        target: { type: Utilization, averageUtilization: 60 }
  behavior:
    scaleUp:
      # api와 같은 이유: 선착순 트래픽은 계단식으로 들어온다.
      stabilizationWindowSeconds: 0
    scaleDown:
      stabilizationWindowSeconds: 300
