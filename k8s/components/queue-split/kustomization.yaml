# 대기열 분리(B, ADR-027 — 운영 기본값). overlay의 components:에 넣으면 켜지고, 빼면 A'(통합)다.
#   - 대기열 전용 Deployment·HPA·PDB를 더한다(같은 이미지)
#   - flowticket-api-queue Service가 api 파드 대신 대기열 전용 파드를 가리키게 하고, 메트릭 수집 라벨을 붙인다
#   - api HPA 상한을 3으로 묶어 파드 예산을 A'와 같은 9로 맞춘다(DB 커넥션 상한 — 하네스 backend 규칙 17)
#   - B의 api는 예매만 받아 requests를 평시 기준 200m로 낮추고, 노드마다 api 하나(hostname 분산, DoNotSchedule)로 둔다(ADR-031).
#     분산이 없으면 피크 중 Cluster Autoscaler가 사용률 낮은 api 노드를 비워 api 둘이 한 노드에 모였다(IMP-049 시뮬레이션 C).
#     A'(이 component를 뺀 상태)에서는 api가 대기열도 받아 base 값(1100m)을 그대로 쓴다.
# Ingress는 건드리지 않는다(하네스 k8s 규칙 2-b). 켠 동안 사전 확장(event-prescale.yaml)은 대기열 HPA(flowticket-api-queue)를
# 대상으로 한다 — api HPA 하한을 올리면 하한 > 상한 3이 된다(하네스 k8s 규칙 11이 막는다).
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

resources:
  - queue-deployment.yaml
  - queue-hpa.yaml
  - queue-pdb.yaml

patches:
  - target: { kind: Service, name: flowticket-api-queue }
    patch: |
      - op: replace
        path: /spec/selector
        value: { app: flowticket-api-queue }
      - op: add
        path: /metadata/labels/flowticket.io~1metrics
        value: "true"
  - target: { kind: HorizontalPodAutoscaler, name: flowticket-api }
    patch: |
      - op: replace
        path: /spec/maxReplicas
        value: 3
  # 평시 조회 Pod당 33 req/s에서 CPU 1초 p90 0.081~0.139코어(IMP-048 평시 기준, 로컬 실측) → 200m.
  - target: { kind: Deployment, name: flowticket-api }
    patch: |
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: 200m
      - op: add
        path: /spec/template/spec/topologySpreadConstraints/-
        value:
          maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels: { app: flowticket-api }
