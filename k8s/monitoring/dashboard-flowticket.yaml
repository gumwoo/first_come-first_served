# Grafana 대시보드 ConfigMap. Grafana 사이드카가 `grafana_dashboard: "1"` 라벨을 보고 모든 네임스페이스에서
# 자동 로드하므로, Grafana persistence를 꺼 두어도 관측 스택 재설치 후 되살아난다.
#
# 메트릭 이름은 /actuator/prometheus 출력에서 확인한 것만 쓴다. 없는 이름은 에러 없이 빈 패널이 된다.
# 아웃박스 지표(ADR-028) 이름은 OperationalMetricsTest·OutboxRelayMetricNameTest가 대조한다(클러스터 스크랩은 미확인).
# 백분위 패널은 application.yml의 percentiles-histogram 설정과 짝이다. 없으면 _bucket 지표가 없어 패널이 빈다.
apiVersion: v1
kind: ConfigMap
metadata:
  name: flowticket-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  flowticket.json: |
    {
      "title": "FlowTicket: API / 아웃박스 / 런타임",
      "uid": "flowticket-api",
      "timezone": "browser",
      "refresh": "30s",
      "time": { "from": "now-1h", "to": "now" },
      "templating": {
        "list": [
          {
            "name": "DS",
            "type": "datasource",
            "query": "prometheus",
            "current": { "text": "Prometheus", "value": "Prometheus" },
            "hide": 0
          }
        ]
      },
      "panels": [
        {
          "type": "row", "title": "서비스 (HTTP)",
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 0 }
        },
        {
          "type": "timeseries", "title": "요청률 (outcome별)",
          "description": "outcome이 SUCCESS가 아닌 선이 올라오면 장애 신호다.",
          "datasource": { "type": "prometheus", "uid": "${DS}" },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 1 },
          "fieldConfig": { "defaults": { "unit": "reqps" }, "overrides": [] },
          "targets": [
            {
              "expr": "sum by(outcome) (rate(http_server_requests_seconds_count{job=\"flowticket-api\"}[5m]))",
              "legendFormat": "{{outcome}}", "refId": "A"
            }
          ]
        },
        {
          "type": "timeseries", "title": "응답시간 백분위 (p50 / p95 / p99)",
          "description": "파드별 버킷을 sum by(le)로 먼저 합친 뒤 계산해 서비스 전체 값이 된다. 백분위는 파드끼리 평균낼 수 없다. 왼쪽 요청률과 **함께** 봐야 한다: 요청이 적으면 p99는 최악의 한두 건이 좌우해 크게 출렁인다. actuator는 Prometheus 스크레이프 트래픽이라 제외했다.",
          "datasource": { "type": "prometheus", "uid": "${DS}" },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 1 },
          "fieldConfig": { "defaults": { "unit": "s" }, "overrides": [] },
          "targets": [
            {
              "expr": "histogram_quantile(0.50, sum by(le) (rate(http_server_requests_seconds_bucket{job=\"flowticket-api\", uri!~\"/actuator.*|/livez|/readyz\"}[5m])))",
              "legendFormat": "p50", "refId": "A"
            },
            {
              "expr": "histogram_quantile(0.95, sum by(le) (rate(http_server_requests_seconds_bucket{job=\"flowticket-api\", uri!~\"/actuator.*|/livez|/readyz\"}[5m])))",
              "legendFormat": "p95", "refId": "B"
            },
            {
              "expr": "histogram_quantile(0.99, sum by(le) (rate(http_server_requests_seconds_bucket{job=\"flowticket-api\", uri!~\"/actuator.*|/livez|/readyz\"}[5m])))",
              "legendFormat": "p99", "refId": "C"
            }
          ]
        },
        {
          "type": "timeseries", "title": "상한(10s) 초과 요청률",
          "description": "maximum-expected-value를 넘은 요청은 +Inf 버킷에 뭉쳐 백분위를 복구할 수 없다. 그러면 p95가 상한값 그대로(예: \"정확히 2000ms\") 찍혀 측정값처럼 보인다. 이 선이 0에서 뜨면 상한을 올려야 한다는 신호다.",
          "datasource": { "type": "prometheus", "uid": "${DS}" },
          "gridPos": { "h": 7, "w": 12, "x": 0, "y": 9 },
          "fieldConfig": { "defaults": { "unit": "reqps" }, "overrides": [] },
          "targets": [
            {
              "expr": "sum(rate(http_server_requests_seconds_bucket{job=\"flowticket-api\", uri!~\"/actuator.*|/livez|/readyz\", le=\"+Inf\"}[5m])) - sum(rate(http_server_requests_seconds_bucket{job=\"flowticket-api\", uri!~\"/actuator.*|/livez|/readyz\", le=\"10.0\"}[5m]))",
              "legendFormat": "10s 초과", "refId": "A"
            }
          ]
        },
        {
          "type": "timeseries", "title": "엔드포인트별 p95 (상위 5)",
          "description": "전체 p95가 튀었을 때 어느 경로인지 좁히는 용도. 좌석 선점·대기열처럼 경합이 있는 경로를 먼저 본다.",
          "datasource": { "type": "prometheus", "uid": "${DS}" },
          "gridPos": { "h": 7, "w": 12, "x": 12, "y": 9 },
          "fieldConfig": { "defaults": { "unit": "s" }, "overrides": [] },
          "targets": [
            {
              "expr": "topk(5, histogram_quantile(0.95, sum by(uri, le) (rate(http_server_requests_seconds_bucket{job=\"flowticket-api\", uri!~\"/actuator.*|/livez|/readyz\"}[5m]))))",
              "legendFormat": "{{uri}}", "refId": "A"
            }
          ]
        },
        {
          "type": "row", "title": "아웃박스: 알림 이벤트(order.paid) 발행",
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 16 }
        },
        {
          "type": "timeseries", "title": "아웃박스 미발행·격리 (상태별)",
          "description": "PENDING이 줄지 않으면 발행 대상(Redis) 장애·시간 초과, DEAD가 생기면 재시도로 풀리지 않는 행이다(/admin/outbox). Kafka 제거(ADR-028) 뒤 실패는 소비자가 아니라 이 행에 남는다.",
          "datasource": { "type": "prometheus", "uid": "${DS}" },
          "gridPos": { "h": 9, "w": 12, "x": 0, "y": 17 },
          "fieldConfig": { "defaults": { "unit": "short" }, "overrides": [] },
          "targets": [
            {
              "expr": "max by(status) (flowticket_outbox_events{job=\"flowticket-api\", status=~\"PENDING|DEAD\"})",
              "legendFormat": "{{status}}", "refId": "A"
            }
          ]
        },
        {
          "type": "timeseries", "title": "미발행 최장 대기",
          "description": "개수와 달리 릴레이가 뒤처지는지를 본다(ADR-022). 100건이 1초 만에 빠지는 것과 3건이 10분째 남은 것은 개수로 구분되지 않는다.",
          "datasource": { "type": "prometheus", "uid": "${DS}" },
          "gridPos": { "h": 9, "w": 6, "x": 12, "y": 17 },
          "fieldConfig": { "defaults": { "unit": "s" }, "overrides": [] },
          "targets": [
            {
              "expr": "max(flowticket_outbox_oldest_pending_age_seconds{job=\"flowticket-api\"})",
              "legendFormat": "최장 대기", "refId": "A"
            }
          ]
        },
        {
          "type": "timeseries", "title": "구독자 0으로 나간 발행",
          "description": "발행 호출은 성공했지만 받은 구독자가 없었다(실패 아님 — ADR-028 §6). 서면 모든 파드의 Redis 구독이 끊긴 순간이다.",
          "datasource": { "type": "prometheus", "uid": "${DS}" },
          "gridPos": { "h": 9, "w": 6, "x": 18, "y": 17 },
          "fieldConfig": { "defaults": { "unit": "ops" }, "overrides": [] },
          "targets": [
            {
              "expr": "sum(rate(flowticket_outbox_publish_no_receivers_total{job=\"flowticket-api\"}[5m]))",
              "legendFormat": "구독자 0", "refId": "A"
            }
          ]
        },
        {
          "type": "row", "title": "런타임 / 용량",
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 26 }
        },
        {
          "type": "timeseries", "title": "힙 사용량 (파드별)",
          "datasource": { "type": "prometheus", "uid": "${DS}" },
          "gridPos": { "h": 8, "w": 8, "x": 0, "y": 27 },
          "fieldConfig": { "defaults": { "unit": "bytes" }, "overrides": [] },
          "targets": [
            {
              "expr": "sum by(pod) (jvm_memory_used_bytes{job=\"flowticket-api\", area=\"heap\"})",
              "legendFormat": "{{pod}}", "refId": "A"
            }
          ]
        },
        {
          "type": "timeseries", "title": "GC 정지 빈도",
          "datasource": { "type": "prometheus", "uid": "${DS}" },
          "gridPos": { "h": 8, "w": 8, "x": 8, "y": 27 },
          "fieldConfig": { "defaults": { "unit": "ops" }, "overrides": [] },
          "targets": [
            {
              "expr": "sum by(pod) (rate(jvm_gc_pause_seconds_count{job=\"flowticket-api\"}[5m]))",
              "legendFormat": "{{pod}}", "refId": "A"
            }
          ]
        },
        {
          "type": "timeseries", "title": "프로세스 CPU",
          "description": "TS-020 때 파드 하나가 711m까지 태웠다. HPA가 이걸 부하로 오해해 스케일업했다.",
          "datasource": { "type": "prometheus", "uid": "${DS}" },
          "gridPos": { "h": 8, "w": 8, "x": 16, "y": 27 },
          "fieldConfig": { "defaults": { "unit": "percentunit" }, "overrides": [] },
          "targets": [
            {
              "expr": "process_cpu_usage{job=\"flowticket-api\"}",
              "legendFormat": "{{pod}}", "refId": "A"
            }
          ]
        },
        {
          "type": "timeseries", "title": "DB 커넥션 (active / pending)",
          "description": "pending이 서면 풀이 말랐다는 뜻: 커넥션 대기가 곧 응답 지연이 된다.",
          "datasource": { "type": "prometheus", "uid": "${DS}" },
          "gridPos": { "h": 8, "w": 8, "x": 0, "y": 35 },
          "fieldConfig": { "defaults": { "unit": "short" }, "overrides": [] },
          "targets": [
            {
              "expr": "sum(hikaricp_connections_active{job=\"flowticket-api\"})",
              "legendFormat": "active", "refId": "A"
            },
            {
              "expr": "sum(hikaricp_connections_pending{job=\"flowticket-api\"})",
              "legendFormat": "pending", "refId": "B"
            }
          ]
        },
        {
          "type": "timeseries", "title": "JVM 스레드",
          "datasource": { "type": "prometheus", "uid": "${DS}" },
          "gridPos": { "h": 8, "w": 8, "x": 8, "y": 35 },
          "fieldConfig": { "defaults": { "unit": "short" }, "overrides": [] },
          "targets": [
            {
              "expr": "jvm_threads_live_threads{job=\"flowticket-api\"}",
              "legendFormat": "{{pod}}", "refId": "A"
            }
          ]
        },
        {
          "type": "timeseries", "title": "HPA 레플리카 (현재 / 희망)",
          "description": "kube-state-metrics 출처. 앱 메트릭이 아니라 클러스터 상태다.",
          "datasource": { "type": "prometheus", "uid": "${DS}" },
          "gridPos": { "h": 8, "w": 8, "x": 16, "y": 35 },
          "fieldConfig": { "defaults": { "unit": "short" }, "overrides": [] },
          "targets": [
            {
              "expr": "kube_horizontalpodautoscaler_status_current_replicas{namespace=\"flowticket\"}",
              "legendFormat": "현재", "refId": "A"
            },
            {
              "expr": "kube_horizontalpodautoscaler_status_desired_replicas{namespace=\"flowticket\"}",
              "legendFormat": "희망", "refId": "B"
            }
          ]
        },
        {
          "type": "row", "title": "외부 연동 (KOPIS)",
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 43 }
        },
        {
          "type": "timeseries", "title": "KOPIS 호출률 (결과별)",
          "description": "실패해도 예외가 밖으로 나가지 않고 축약 응답으로 degrade하므로, 이 지표가 없으면 실패가 보이지 않는다. cause는 실패 종류다. http_400(차단) / timeout(응답 없음) / io(연결 실패) / parse(200은 받았는데 XML이 깨짐). 대응이 각각 다르므로 뭉치면 안 된다.",
          "datasource": { "type": "prometheus", "uid": "${DS}" },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 44 },
          "fieldConfig": { "defaults": { "unit": "reqps" }, "overrides": [] },
          "targets": [
            {
              "expr": "sum by(operation, outcome, cause) (rate(kopis_api_requests_seconds_count{job=\"flowticket-api\"}[5m]))",
              "legendFormat": "{{operation}} {{outcome}}/{{cause}}", "refId": "A"
            }
          ]
        },
        {
          "type": "timeseries", "title": "KOPIS 평균 지연 (operation별)",
          "description": "동기화 배치가 느려지는 원인이 KOPIS 쪽인지 본다. 사용자 /events/{id}는 KOPIS를 호출하지 않으므로 이 선과 함께 오르면 안 된다(IMP-018).",
          "datasource": { "type": "prometheus", "uid": "${DS}" },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 44 },
          "fieldConfig": { "defaults": { "unit": "s" }, "overrides": [] },
          "targets": [
            {
              "expr": "sum by(operation) (rate(kopis_api_requests_seconds_sum{job=\"flowticket-api\"}[5m])) / sum by(operation) (rate(kopis_api_requests_seconds_count{job=\"flowticket-api\"}[5m]))",
              "legendFormat": "{{operation}}", "refId": "A"
            }
          ]
        }
      ]
    }
