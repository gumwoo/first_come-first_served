apiVersion: apps/v1
kind: Deployment
metadata:
  name: flowticket-web
  namespace: flowticket
spec:
  # replicas를 두지 않는다 — web-hpa.yaml이 소유한다(하네스 규칙 ⑧).
  # Git에 값을 두면 ArgoCD가 sync할 때마다 HPA가 정한 파드 수를 덮어쓴다(TS-022).
  selector:
    matchLabels: { app: flowticket-web }
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  template:
    metadata:
      labels: { app: flowticket-web }
    spec:
      # preStop(25s) + Next.js 종료 시간보다 커야 SIGKILL이 앞지르지 않는다. 30이면
      # preStop 도중에 강제 종료돼 오히려 더 나빠진다.
      terminationGracePeriodSeconds: 60
      containers:
        - name: web
          image: flowticket-web:REPLACE_TAG
          ports:
            - containerPort: 3000
          # ⚠️ API_ORIGIN을 여기 두지 않는다 — **런타임 env로는 바뀌지 않는다.**
          # next.config.mjs의 rewrites()가 standalone 번들로 구워지기 때문이고,
          # 이 프로젝트가 실제로 겪은 일이다(apps/web/Dockerfile: 런타임 주입을 시도했더니
          # 빌드 때 값인 localhost:8080으로 프록시해 ECONNREFUSED). 그래서 이미지 빌드의
          # build-arg로 정한다(.github/workflows/image.yml).
          #
          # 여기에 넣으면 "설정한 것처럼 보이지만 아무 효과가 없는" 죽은 값이 된다.
          # Next.js standalone 서버에는 전용 헬스 엔드포인트가 없다. 루트 응답으로 갈음한다 —
          # "프로세스가 HTTP를 받는가"까지만 보는 것이고, 그 이상은 확인하지 않는다(정직).
          readinessProbe:
            httpGet: { path: /, port: 3000 }
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /, port: 3000 }
            periodSeconds: 15
            failureThreshold: 3
          lifecycle:
            # ⚠️ 이 값이 롤링 중 5xx를 만든 원인이었다(2026-08-25 실측, IMP-015 §8).
            #
            # ALB는 target-type: ip라 **파드 IP를 직접 등록**한다. 파드가 종료되면
            #   파드 삭제 → 컨트롤러가 타깃 등록 해제 → deregistration_delay(10s) 드레이닝
            # 순서인데, preStop이 5초면 **파드가 먼저 응답을 멈춘다.** 그 사이 ALB는 아직
            # 그 IP로 보내고, 없는 대상에 TCP 연결을 시도하다 10초 만에 포기한다.
            # 그래서 502/504가 나면서도 Target_5XX는 0이었다 — 앱은 아무 잘못이 없다.
            #
            # 실측(25 rps, web 단독 rollout restart, 6,001건):
            #   preStop 5s  → 13건 실패 (504 6 / 502 7, TargetConnectionError 7)
            #   preStop 25s → **0건**
            # 실제 배포 경로(이미지 변경 + web·api 동시)에서도 6,001건 0건이었다.
            #
            # 25s는 deregistration_delay(10s)에 컨트롤러 반응·전파 여유를 더한 값이다.
            # **최소 필요값은 재지 않았다** — 10s나 15s로도 되는지는 확인하지 않았다.
            preStop:
              exec: { command: ["sh", "-c", "sleep 25"] }
          resources:
            # 100m은 현재 부하·오토스케일 기준에 비해 과소 예약이었다. 2026-08-11 실측에서
            # 파드당 0.16~0.59 core를 썼으므로 스케줄러가 배치를 실제보다 가볍게 보고 있었고,
            # HPA의 CPU utilization 기준선으로도 너무 낮아 워크로드 특성과 맞지 않았다.
            # (request를 peak보다 낮게 잡는 것 자체는 정상적인 선택이다 — 문제는 정도였다)
            #
            # 300m으로 올린다 — 실측 최대(0.59)보다는 낮지만, api max 7과 함께 노드
            # allocatable(5,790m) 안에 들어가는 값이다. requests는 상한이 아니라 예약이다.
            requests: { cpu: "300m", memory: "256Mi" }
            limits: { memory: "512Mi" }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
---
apiVersion: v1
kind: Service
metadata:
  name: flowticket-web
  namespace: flowticket
spec:
  selector: { app: flowticket-web }
  ports:
    - port: 80
      targetPort: 3000
