# 클러스터 **안에서** k6를 돌리는 Job.
#
# 왜 안에서 도는가: 로컬에서 https://flow-ticket.com으로 쏘면 인터넷 RTT와 TLS 핸드셰이크가
# 측정값에 섞이고, 집 회선이 먼저 포화되면 서버가 아니라 **내 네트워크를 측정**하게 된다.
# 클러스터 안에서 Service(http://flowticket-api)로 직접 쏘면 그 변수가 사라진다.
#
# 사용법:
#   kubectl create configmap k6-scripts -n flowticket \
#     --from-file=lib.js=infra/k6/lib.js --from-file=read-load.js=infra/k6/read-load.js \
#     --dry-run=client -o yaml | kubectl apply -f -
#   kubectl apply -f infra/k6/k6-job.yaml
#   kubectl logs -n flowticket job/k6-load -f
#   kubectl delete job k6-load -n flowticket
#
# VU/시간은 아래 env로 바꾼다. 개선 전후를 비교할 때는 **같은 값으로** 돌려야 한다.
#
# ⚠️ 측정 지점 선택: 300 VU는 이 클러스터에서 이미 포화 구간이라(HPA가 최대 9까지 올라가고
# 세 엔드포인트가 모두 상한에 걸린다) 개별 개선을 분간할 수 없다. 특정 변경의 효과를 보려면
# 50 VU처럼 **포화 전** 구간에서 재고, 300 VU는 한계 확인용으로 따로 본다.
apiVersion: batch/v1
kind: Job
metadata:
  name: k6-load
  namespace: flowticket
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: k6
          image: grafana/k6:0.54.0
          args: ["run", "/scripts/read-load.js"]
          env:
            # lib.js의 BASE. Service는 80만 열므로 포트를 붙이지 않는다.
            - { name: K6_BASE_URL, value: "http://flowticket-api" }
            - { name: K6_VUS, value: "50" }
            - { name: K6_DURATION, value: "60s" }
          volumeMounts:
            - { name: scripts, mountPath: /scripts }
      volumes:
        - name: scripts
          configMap: { name: k6-scripts }
