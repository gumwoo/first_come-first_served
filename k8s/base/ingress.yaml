# ALB는 기본적으로 web만 바라보고, API는 web Pod의 Next rewrite(/api/:path* → ${API_ORIGIN}/:path*, /api를 뗀다)로 간다.
# ALB에서 /api 전체를 API Service로 직접 보내면 안 된다. ALB 경로 라우팅은 접두어를 떼지 않아 Spring이 /api/... 를 받고
# (Spring 매핑에는 /api 접두어가 없다) 전부 404가 된다.
# 예외는 대기열 진입·상태 두 경로뿐이다 — Next 홉 비용 때문에 URL rewrite로 /api를 떼어 api로 직접 보낸다(ADR-023, ADR-024).
# 하네스 k8s 규칙 2가 허용 목록·rewrite·규칙 순서를 강제한다. 구조와 이점은 k8s/README.md.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: flowticket
  namespace: flowticket
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80},{"HTTPS":443}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    alb.ingress.kubernetes.io/certificate-arn: REPLACE_ACM_CERT_ARN
    # web 대상 그룹용 값이다(대기열 두 경로의 대상 그룹은 flowticket-api-queue Service 주석의 /readyz가 우선한다).
    # Next.js standalone에는 전용 헬스 엔드포인트가 없어 루트 응답으로 갈음한다 — "프로세스가 HTTP를 받는가"까지만 본다.
    alb.ingress.kubernetes.io/healthcheck-path: /
    # 등록 해제 시 기존 연결을 드레이닝할 시간. preStop과 함께 "빠지는 중"의 요청을 덮는다(IMP-015, TS-035).
    alb.ingress.kubernetes.io/target-group-attributes: deregistration_delay.timeout_seconds=10
    # 대기열 진입·상태 두 경로의 /api를 떼는 URL rewrite(ADR-024, 컨트롤러 v2.14.1+ transforms, 키 = 백엔드 Service 이름).
    # 쿼리 문자열이 정규식 입력에 포함되는지 문서에 명시가 없어 끝에 선택적 쿼리([?].*)를 둔다. 맞지 않으면 api가 /api/... 를 404로 낸다.
    alb.ingress.kubernetes.io/transforms.flowticket-api-queue: >-
      [{"type":"url-rewrite","urlRewriteConfig":{"rewrites":[{"regex":"^/api/(events/[0-9]+/queue/token|queue/status)([?].*)?$","replace":"/$1$2"}]}}]
spec:
  ingressClassName: alb
  rules:
    - host: flow-ticket.com
      http:
        paths:
          # /actuator는 공개하지 않는다. ALB 헬스체크는 Pod IP로 직접 검사해 규칙이 필요 없고, 두면 metrics·prometheus가 인터넷에 열린다.
          # web 경로의 Next rewrite로도 닿지 않는다 — api가 actuator를 관리 포트(8081)에만 둔다(TS-041).
          #
          # 순서가 곧 우선순위다(ADR-024). 컨트롤러는 Exact → Prefix → ImplementationSpecific(적은 순서) 순으로 규칙을 만든다.
          # 기본 경로를 `/` Prefix로 두면 진입 규칙(ImplementationSpecific)보다 앞서 진입이 오류 없이 web으로 간다.
          # 그래서 기본 경로도 ImplementationSpecific `/*`로 두고 맨 뒤에 적는다.
          - path: /api/queue/status
            pathType: Exact
            backend: { service: { name: flowticket-api-queue, port: { number: 80 } } }
          - path: /api/events/*/queue/token
            pathType: ImplementationSpecific
            backend: { service: { name: flowticket-api-queue, port: { number: 80 } } }
          - path: /*
            pathType: ImplementationSpecific
            backend: { service: { name: flowticket-web, port: { number: 80 } } }
