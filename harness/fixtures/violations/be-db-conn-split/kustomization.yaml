# 대기열 분리(B, ADR-027). overlay의 components:에 넣으면 켜지고, 빼면 A'(지금 구조)다.
#   - 대기열 전용 Deployment·HPA·PDB를 더한다(같은 이미지)
#   - flowticket-api-queue Service가 api 파드 대신 대기열 전용 파드를 가리키게 하고, 메트릭 수집 라벨을 붙인다
#   - api HPA 상한을 3으로 묶어 파드 예산을 A'와 같은 9로 맞춘다(DB 커넥션 상한 — 하네스 backend 규칙 17)
# Ingress는 건드리지 않는다(하네스 k8s 규칙 2-b). 켠 동안 사전 확장(event-prescale.yaml)은 끈 상태여야 한다 —
# api 하한 9 > 상한 3이 되기 때문이다(하네스 k8s 규칙 11). 대기열 쪽 사전 확장은 측정 뒤 정한다.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

resources:
  - queue-deployment.yaml
  - queue-hpa.yaml
  - queue-pdb.yaml

patches:
  - target: { kind: Service, name: flowticket-api-queue }
    patch: |
      - op: replace
        path: /spec/selector
        value: { app: flowticket-api-queue }
      - op: add
        path: /metadata/labels/flowticket.io~1metrics
        value: "true"
  - target: { kind: HorizontalPodAutoscaler, name: flowticket-api }
    patch: |
      - op: replace
        path: /spec/maxReplicas
        value: 3
