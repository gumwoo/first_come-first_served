# web 수평 확장. 부하 실측에서 첫 실패 지점이 web 티어였다 — api만 늘려도 앞단 web이 막히면 502가 난다.
# 노드 예산(ADR-025 이후): api가 노드당 하나라 노드 수를 정하고(CA), web은 그 노드들의 남는 자리에 들어간다.
# 남는 자리는 합계가 아니라 노드별로 본다(flowticket 밖 요청이 노드마다 다르다).
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: flowticket-web
  namespace: flowticket
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: flowticket-web }
  minReplicas: 2
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        # api와 같은 기준을 쓴다. requests 300m 기준 180m을 넘으면 확장.
        # 부하가 크면 4파드로도 타깃에 닿지 못하고 상한에 붙을 수 있다. 상한을 넘기려면 maxReplicas를 바꿔야 하고,
        # CA(ADR-025 이후)는 그 4개가 들어갈 노드 자리를 만들 뿐이다.
        target: { type: Utilization, averageUtilization: 60 }
  behavior:
    scaleUp:
      # api와 같은 이유: 선착순 트래픽은 계단식으로 들어온다.
      stabilizationWindowSeconds: 0
    scaleDown:
      stabilizationWindowSeconds: 300
