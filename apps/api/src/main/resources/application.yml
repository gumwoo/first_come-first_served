spring:
  application:
    name: flowticket-api
  lifecycle:
    # 롤링 배포·스케일인 시 진행 중 요청과 Kafka 소비를 마무리할 유예(graceful shutdown과 한 쌍).
    timeout-per-shutdown-phase: ${SHUTDOWN_TIMEOUT:30s}
  # 컨테이너/K8s에서 localhost는 '그 Pod 자신'이라 외부 주소는 전부 환경변수로 받는다.
  # DB_URL을 주면 통째로 대체, 아니면 호스트/포트만 바꿔 쓸 수 있게 이중으로 열어둔다.
  datasource:
    url: ${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:flowticket}}
    username: ${DB_USERNAME:flowticket}
    password: ${DB_PASSWORD:flowticket}
    hikari:
      # ⚠️ 이 값은 혼자 정할 수 없다 — HPA 최대 파드 수와 **곱해져** DB 한도와 겨룬다.
      #
      #   maxReplicas × maximum-pool-size + 앱 외 세션 + 여유 ≤ max_connections − reserved
      #
      # 기본값 10을 쓰던 때 9파드 × 10 = 90이 실질 한도 76을 넘어, 부하로 9까지 확장되자
      # 8번째부터 Flyway가 커넥션을 못 얻어 기동 실패했다(TS-021). 두 값이 각자 합리적이어도
      # 곱이 한도를 넘을 수 있는데, 그 곱을 계산하는 자리가 코드 어디에도 없었다.
      #
      # 5로 낮춰 9 × 5 = 45로 만든다. 실측상 부하 중 pending은 0, active도 파드당 0~1이라
      # 이 워크로드는 풀을 거의 쓰지 않는다. 하네스 backend 규칙 17이 이 곱을 검사한다.
      maximum-pool-size: ${DB_POOL_MAX:5}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # ElastiCache는 전송 중 암호화(TLS)를 켜고 만든다. TLS를 켠 캐시에 평문으로 붙으면
      # 연결이 전부 실패하고, readiness에 redis가 있어 Pod가 영원히 Ready가 되지 않는다.
      #
      # 기본값이 false인 것이 중요하다 — 로컬 개발과 CI(Testcontainers Redis)는 평문이라
      # true로 박으면 개발 흐름과 테스트가 통째로 깨진다. 운영(k8s)에서만 켠다.
      #
      # 이 한 줄이 대기열 Lua·SSE Pub/Sub·ShedLock을 함께 바꾼다(같은 커넥션 팩토리).
      # 자세한 체크리스트: docs/deployment/app-changes-for-k8s-kafka.md C-7
      ssl:
        enabled: ${REDIS_SSL_ENABLED:false}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: flowticket
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # ⚠️ JsonDeserializer를 **직접** 쓰면 안 된다. 역직렬화는 poll() 단계에서 일어나
      # 리스너에 도달하기 전에 터지므로, DefaultErrorHandler(+DLT)가 개입할 수 없다.
      # 결과는 같은 메시지 무한 재시도다 — 파드는 Running이고 readiness도 UP인데(Kafka 제외)
      # 처리가 멈춘 채 CPU만 태운다. 실제로 노드 CPU 100%까지 갔고 HPA가 부하로 오해해
      # 스케일업까지 했다(TS-020).
      #
      # ErrorHandlingDeserializer가 실패를 잡아 null + 예외 헤더로 바꿔 리스너 단계까지
      # 넘겨주고, 그때부터 DefaultErrorHandler가 DLT로 보낼 수 있다.
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: "com.flowticket.*"
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      # 아웃박스 릴레이가 발행 성공을 확인하고 마킹하므로(publish-then-mark), 확인의 기준을
      # 전체 ISR 반영으로 둔다. 프로듀서 재시도로 생기는 중복은 idempotence로 억제(ADR-010).
      acks: all
      properties:
        # 브로커 불가 시 send()가 60s(기본) 블록되지 않도록 바운드.
        # 실패해도 아웃박스 행이 PENDING으로 남아 다음 틱에 재시도된다(유실 0).
        max.block.ms: 3000
        enable.idempotence: true
    listener:
      # 브로커 미가용 환경(일부 통합테스트)에서 부팅 실패하지 않도록.
      missing-topics-fatal: false
  security:
    oauth2:
      client:
        registration:
          naver:
            client-name: naver
            # 키 미설정 환경(CI/키 없는 dev)에서도 부팅되도록 비어있지 않은 기본값.
            # 실제 값은 환경변수로 주입. 미설정 시 네이버 로그인만 런타임에 실패.
            client-id: ${NAVER_CLIENT_ID:not-configured}
            client-secret: ${NAVER_CLIENT_SECRET:not-configured}
            redirect-uri: "{baseUrl}/login/oauth2/code/naver"
            authorization-grant-type: authorization_code
            scope: name, email
          kakao:
            client-name: kakao
            client-id: ${KAKAO_CLIENT_ID:not-configured}
            client-secret: ${KAKAO_CLIENT_SECRET:not-configured}
            redirect-uri: "{baseUrl}/login/oauth2/code/kakao"
            authorization-grant-type: authorization_code
            client-authentication-method: client_secret_post
            scope: profile_nickname, account_email
        provider:
          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            user-name-attribute: response
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

# 토픽 생성 파라미터. 로컬·CI는 단일 브로커라 1/1(RF>브로커 수면 생성 실패),
# 운영 Strimzi(브로커 3)에서는 파티션 6·RF 3으로 올린다. 파티션이 1이면 Pod를 늘려도
# 같은 컨슈머 그룹에서 실제 소비는 하나뿐이라 병렬 확장이 의미가 없다.
kafka:
  topic:
    partitions: ${KAFKA_TOPIC_PARTITIONS:1}
    replicas: ${KAFKA_TOPIC_REPLICAS:1}

server:
  port: 8080
  # 종료 신호를 받으면 새 요청을 막고 진행 중 요청을 마친 뒤 내려간다(K8s 롤링 배포 무중단의 전제).
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus
  endpoint:
    health:
      # /actuator/health/liveness · /actuator/health/readiness 노출(K8s probe용).
      probes:
        enabled: true
      group:
        # readiness = "지금 트래픽을 받아도 되는가". DB·Redis는 없으면 요청을 못 처리하니 포함한다.
        # Kafka는 일부러 뺀다 — 브로커 장애는 알림 지연일 뿐이고(아웃박스가 유실을 막는다, ADR-008/010),
        # 이걸 readiness에 넣으면 브로커 하나 죽었다고 API 전체가 트래픽에서 빠지는 과잉 차단이 된다.
        readiness:
          include: readinessState, db, redis
        # liveness = "프로세스를 재시작해야 하는가". 외부 의존성을 넣으면 DB 장애에 Pod가 무한 재시작한다.
        liveness:
          include: livenessState
  metrics:
    distribution:
      # 응답시간 백분위(p50/p95/p99)를 서비스 전체 기준으로 보기 위한 설정.
      #
      # ⚠️ 클라이언트 백분위(`percentiles: [0.95]`)를 쓰면 안 된다. 백분위는 평균과 달리
      # **여러 인스턴스 값을 합칠 수 없다.** 파드 3개의 p95가 20ms/25ms/400ms일 때 서비스
      # 전체 p95는 그 셋으로 계산할 방법이 없다. 이 서비스는 HPA로 3→9개까지 오르내리므로
      # 집계 불가는 치명적이다. 히스토그램은 버킷 카운터라 `sum by(le)` 후
      # `histogram_quantile`로 파드 수와 무관하게 전체 백분위가 나온다.
      percentiles-histogram:
        http.server.requests: true
      # 버킷 범위를 좁혀 카디널리티를 억제한다(기본 범위는 훨씬 넓어 대부분이 빈 버킷이다).
      #
      # 하한을 1ms로 둔 이유: 평균이 6~14ms라고 개별 요청이 전부 그 위인 건 아니다.
      # 하한을 올리면 그 아래 요청이 첫 버킷에 뭉쳐 **p50 해상도를 잃는다**(집계에서 빠지는
      # 것은 아니다 — 잃는 것은 해상도다).
      minimum-expected-value:
        http.server.requests: 1ms
      # 상한을 넘는 요청은 +Inf 한 칸에 뭉쳐 그 구간의 백분위를 복구할 수 없다.
      #
      # 처음엔 2s로 뒀다가 부하 테스트에서 **실제로 걸렸다.** 300 VU에서 전체 요청의 8.1%
      # (10,181건 중 822건)가 2s를 넘어 p95가 +Inf 버킷에 들어갔고, histogram_quantile이
      # 상한값을 그대로 돌려줬다 — 세 엔드포인트가 나란히 "정확히 2000.0ms"로 찍혔다.
      # 그 숫자는 측정값이 아니라 **더 못 잰다는 표시**다.
      #
      # 10s로 올린다. 앞으로 개선 전후를 비교하려면 AS-IS가 검열되지 않아야 한다.
      # 초과 발생 여부는 계속 감시한다(대시보드 "상한 초과 요청률" 패널):
      #   sum(rate(..._bucket{le="+Inf"}[5m])) - sum(rate(..._bucket{le="10.0"}[5m]))
      maximum-expected-value:
        http.server.requests: 10s

# 외부 연동 / 시크릿은 환경변수로만 주입 (application-local.yml은 gitignore)
# ⚠️ KOPIS OPEN API 이용 제한 (공식)
#   - 목록 조회 날짜 범위: 요청당 최대 31일
#   - 페이지당 조회 건수: 최대 100건
#   - **IP 제한: 1초당 10회 초과 시 서비스가 중지된다**
#
# 마지막 항목이 특히 중요하다. 429가 아니라 **차단**이고, 막히면 시딩 자체를 못 한다.
# 실제로 부하 테스트 중 사용자 경로의 상세 조회가 초당 70회 수준으로 나가 400 Request Blocked를
# 2,014건 맞았다(같은 시각 유휴 상태에서는 31/31 성공). 부하가 곧 외부 호출량이 되는 구조였다.
#
# 대응은 두 단계이고 둘 다 끝났다.
#   1) 사용자 요청 경로에서 KOPIS 호출을 제거했다 — 제한이 아니라 제거다.
#      (요청 스레드를 재우는 방식은 외부 지연이 API 전체를 멎게 하는 실패를 다시 만든다)
#      상세는 동기화 배치가 미리 받아 events 테이블에 저장한다(V16).
#   2) 남은 호출자(동기화)는 rate-limit-per-second로 간격을 둔다(아래).
#
# 그래서 KOPIS로 나가는 호출이 **동기화 하나로 좁혀졌고**, 목록·상세가 같은 제한기를 통과한다.
# 이 두 가지가 함께여야 IP 총량이 통제된다 — 사용자 경로가 살아 있으면 제한기만으로는 안 된다.
kopis:
  base-url: http://www.kopis.or.kr/openApi/restful
  service-key: ${KOPIS_SERVICE_KEY:}
  # KOPIS로 나가는 모든 호출(목록 + 상세)의 초당 상한. 호출자가 동기화 하나뿐이고 그 경로는
  # ShedLock으로 한 프로세스만 실행하므로, 이 값이 곧 IP 기준 호출률이 된다.
  #
  # 10의 절반으로 잡은 이유: NAT 게이트웨이를 공유하므로 우리 호출만 그 IP를 쓴다고 확신할 수 없다.
  rate-limit-per-second: ${KOPIS_RATE_LIMIT_PER_SECOND:5}
  sync:
    days: ${KOPIS_SYNC_DAYS:90}            # 오늘부터 며칠치 수집(31일 청크로 분할)
    rows: ${KOPIS_SYNC_ROWS:100}          # 페이지당 행 수(KOPIS 최대 100)
    max-pages: ${KOPIS_SYNC_MAX_PAGES:10} # 청크당 페이지 상한(안전장치)
    # 한 회차에 처리할 상세 건수 상한. 레이트 리밋(5회/초) 때문에 300건이면 약 1분이다.
    # 전량(약 1,446건)을 한 번에 하면 5분이 걸려 ShedLock의 lockAtMostFor=PT10M을 크게 잡아먹는다.
    detail-batch-limit: ${KOPIS_SYNC_DETAIL_BATCH_LIMIT:300}
    # 상세를 다시 받아올 주기. 이보다 오래된 건은 갱신 대상이 된다.
    #
    # ⚠️ 이 값이 없던 초안은 detail_synced_at IS NULL만 대상으로 삼아, 한 번 채우면
    # **영원히 다시 보지 않았다** — KOPIS에서 가격·출연진이 바뀌어도 우리 값은 그대로였다.
    #
    # 대상은 "오래된 순, NULL 먼저"로 고르므로 미수집 채우기와 순환 갱신이 같은 규칙으로 처리된다.
    # 회차당 300건이면 전체가 한 바퀴 도는 데 약 5일이다 — 이 값을 그보다 짧게 잡으면
    # 대상이 쌓여 계속 밀리므로 batch-limit과 함께 봐야 한다.
    detail-refresh-after-days: ${KOPIS_SYNC_DETAIL_REFRESH_AFTER_DAYS:7}

jwt:
  secret: ${JWT_SECRET:}
  access-token-ttl: 1800
  refresh-token-ttl: 1209600

# 소셜 로그인 성공 후 프론트로 리다이렉트(토큰은 httpOnly 쿠키, URL 비노출)
app:
  oauth2:
    success-redirect: ${OAUTH_SUCCESS_REDIRECT:http://localhost:3000}
    failure-redirect: ${OAUTH_FAILURE_REDIRECT:http://localhost:3000/login?error=oauth}
  cookie:
    # 데모는 http라 false. 운영(HTTPS)에서는 COOKIE_SECURE=true로 주입.
    secure: ${COOKIE_SECURE:false}
  proxy:
    # 신뢰하는 프록시 IP(콤마 구분). 이 IP에서 온 요청의 X-Forwarded-For만 신뢰한다.
    # 비어 있으면(기본) XFF 무시 → remoteAddr 사용(위조 방지). 운영 LB IP를 주입.
    trusted: ${TRUSTED_PROXIES:}

# 대기열(S03) — Redis ZSet 기반 선착순 직렬화
queue:
  capacity: ${QUEUE_CAPACITY:100}            # 이벤트당 동시 입장 정원
  token-ttl: ${QUEUE_TOKEN_TTL:1800}         # 대기 토큰 수명(초)
  admit-ttl: ${QUEUE_ADMIT_TTL:300}          # 입장 후 좌석선택 제한(초)
  admit-interval-ms: ${QUEUE_ADMIT_INTERVAL:1500}  # 승격 워커 주기(ms)

# 좌석·재고(S04)
seat:
  hold-ttl: ${SEAT_HOLD_TTL:300}          # 선점 유지 시간(초, ~5분)
  max-per-user: ${SEAT_MAX_PER_USER:4}    # 이벤트당 1인 구매 한도
  sweep-interval-ms: ${SEAT_SWEEP_INTERVAL:60000}  # 만료 회수 워커 주기(ms)

# 주문·결제(S05)
order:
  sweep-interval-ms: ${ORDER_SWEEP_INTERVAL:60000}  # 미완료 주문 만료 회수 주기(ms)

# 트랜잭셔널 아웃박스(ADR-010). 릴레이가 PENDING을 Kafka로 발행하고 성공 후 PUBLISHED로 마킹한다.
outbox:
  relay-interval-ms: ${OUTBOX_RELAY_INTERVAL:1000}  # 폴링 주기(발행 지연 상한)
  batch-size: ${OUTBOX_BATCH_SIZE:100}              # 한 틱 최대 발행 건수
  send-timeout-ms: ${OUTBOX_SEND_TIMEOUT:3000}      # 발행 확인 대기 상한(브로커 장애 시 틱 바운드)
  retention-days: ${OUTBOX_RETENTION_DAYS:7}        # PUBLISHED 보존 기간(운영 가시성) — 이후 purge
  purge-cron: ${OUTBOX_PURGE_CRON:0 0 3 * * *}      # 매일 새벽 3시 정리(PENDING·실패는 제외)

# 결제 게이트웨이 선택(ADR-005). mock=결정론(테스트/E2E/CI 기본), toss=실 PG 테스트 연동(데모).
payment:
  gateway: ${PAYMENT_GATEWAY:mock}
  # 정산·보상(ADR-011): PG엔 승인인데 우리 주문은 미확정인 "미아 승인"을 주기적으로 취소.
  reconcile-interval-ms: ${PAYMENT_RECONCILE_INTERVAL:600000}   # 정산 주기(ms)
  reconcile-grace-minutes: ${PAYMENT_RECONCILE_GRACE:10}        # 결제 제한시각 이후 유예(진행 중 결제 보호)
  reconcile-lookback-hours: ${PAYMENT_RECONCILE_LOOKBACK:24}    # 소급 한계(이전 건은 수동 정산)
  reconcile-batch-size: ${PAYMENT_RECONCILE_BATCH:50}           # 틱당 PG 조회 상한

# 취소 수수료 정책(S06). 공연일까지 남은 일수 기준 기간별 수수료율(%). 당일·이후는 환불 불가.
refund:
  free-days: ${REFUND_FREE_DAYS:8}     # 이 일수 이상 남으면 0%
  tier1-days: ${REFUND_TIER1_DAYS:3}   # 이 일수 이상 남으면 tier1 수수료율
  tier1-rate: ${REFUND_TIER1_RATE:10}  # D-3~D-7 (%)
  tier2-rate: ${REFUND_TIER2_RATE:30}  # D-1~D-2 (%)

# 관리자 계정 부트스트랩(S07). 둘 다 설정 시 최초 1회 ROLE_ADMIN 생성. 자격증명은 환경변수로만.
admin:
  email: ${ADMIN_EMAIL:}
  password: ${ADMIN_PASSWORD:}

# 휴대폰 인증: 데모는 Mock(고정 코드). 운영은 mock=false + 실제 SMS 연동.
auth:
  phone:
    mock: true
    mock-code: "123456"
