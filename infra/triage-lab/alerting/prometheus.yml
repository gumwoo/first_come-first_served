# 실험실 알림 경로: Prometheus가 api·대기열·PostgreSQL·api cgroup을 1초마다 긁고, 알림 규칙이 울리면 Alertmanager가
# 분석 훅(scripts/triage/alert-hook.mjs)을 부른다. 훅은 이 Prometheus에서 알림 구간 지표를 읽어 run 요약과 같은 형식을 만든다.
# 예매 묶음이 10~30초라 운영(15초)보다 촘촘히 긁는다. api가 CPU를 못 받으면 긁기가 1초 안에 끝나지 않아 표본이 빠진다(그 구간은 누적값 차분으로 메운다).
global:
  scrape_interval: 1s
  scrape_timeout: 1s
  evaluation_interval: 1s

rule_files:
  - /etc/prometheus/lab-rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  # 운영과 같은 job 이름이라 운영 알림·대시보드 식을 그대로 쓸 수 있다. role로 예매 api와 대기열을 가른다.
  - job_name: flowticket-api
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["api:8080"]
        labels: { role: api }
      - targets: ["queue:8080"]
        labels: { role: queue }
  - job_name: postgres
    static_configs:
      - targets: ["pg-exporter:9187"]
  - job_name: cgroup
    static_configs:
      - targets: ["cgroup-exporter:9101"]
