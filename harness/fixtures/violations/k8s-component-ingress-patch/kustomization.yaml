# 위반: Component가 Ingress 백엔드를 바꾼다 — overlay와 같은 허용 목록(인증서 주석만)을 따라야 한다.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
patches:
  - target: { kind: Ingress, name: flowticket }
    patch: |
      - op: replace
        path: /spec/rules/0/http/paths/0/backend/service/name
        value: flowticket-api-queue
