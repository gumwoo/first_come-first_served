name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 같은 브랜치에 새 커밋이 오면 이전 CI는 의미가 없다 — 즉시 취소해 러너 시간을 아낀다.
# 리뷰 → 수정 → push 루프에서 낭비가 컸다.
#
# ⚠️ image.yml은 **일부러 다르게** 잡는다(cancel-in-progress: false). 배포는 중간에 죽이면
# 이미지는 올라갔는데 태그 커밋은 안 된 상태가 남는다. 상세: [[TS-029]]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: 변경 영역 판별
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      e2e: ${{ steps.filter.outputs.e2e }}
    steps:
      - uses: actions/checkout@v4
      # 문서만 고친 PR에 백엔드 9분·E2E 4분을 돌리는 건 낭비다. 무엇이 바뀌었는지 먼저 판별한다.
      # 계약(contracts)·하네스는 코드가 안 바뀌어도 검증을 깨뜨릴 수 있으므로 넓게 잡는다.
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'apps/api/**'
              - 'contracts/**'
              - 'harness/**'
              - 'k8s/**'
              - '.github/workflows/ci.yml'
            frontend:
              - 'apps/web/**'
              - 'contracts/**'
              - 'harness/**'
              - '.github/workflows/ci.yml'
            e2e:
              - 'apps/api/**'
              - 'apps/web/**'
              - 'e2e/**'
              - 'contracts/**'
              - '.github/workflows/ci.yml'

  harness-meta:
    name: 하네스 메타테스트 (위반 fixture 차단 확인)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # ⚠️ lockfile 실패에 fallback을 두지 않는다.
      # 예전에는 `npm ci || npm install`(pnpm은 `--frozen-lockfile || pnpm install`)이었다.
      # lockfile이 package.json과 어긋나면 `npm ci`는 실패해야 하는데, fallback이 그걸 받아
      # **다른 의존성 트리로 초록불**을 만든다. 그러면 로컬과 CI가 서로 다른 트리를 검증한 것이라
      # 하네스·테스트 결과의 근거가 통째로 흔들린다. 결정론을 내세우는 저장소에서 가장 아래
      # 토대가 비결정적이었던 셈이다([[TS-027]]).
      # 제거 시점 확인: harness·e2e `npm ci --dry-run`, apps/web `--frozen-lockfile` 모두 통과 —
      # 즉 이 fallback은 당시 아무것도 덮고 있지 않았고, 앞으로 깨질 때만 조용히 덮었을 자리다.
      - name: install harness deps
        working-directory: harness
        run: npm ci
      - name: contract schema check (계약 형식 검증)
        working-directory: harness
        run: node schema-check.mjs
      - name: meta test (false-negative guard)
        working-directory: harness
        run: node meta-test.mjs
      # 문서 드리프트 검사는 **이 잡에 둔다**(backend/frontend가 아니라).
      # 이 규칙이 필요한 순간이 바로 "문서만 고친 PR"인데, 그런 PR은 변경 영역 필터에 걸려
      # backend·frontend가 전부 skip된다. 거기 두면 정작 필요할 때 돌지 않는다.
      # harness-meta는 needs·if 없이 항상 실행되고, 이 검사는 1초 미만이라 비용도 없다.
      - name: docs harness check (문서 ↔ 현재 상태 드리프트)
        working-directory: harness
        run: node docs/check.mjs

  backend:
    name: 백엔드 (하네스 → 테스트)
    runs-on: ubuntu-latest
    needs: [changes, harness-meta]
    # 변경 영역에 해당할 때만 실행 — main push도 예외가 아니다.
    # 예전에는 `|| github.event_name == 'push'`로 push에서 필터를 무력화했다("회귀 안전망").
    # 실측(최근 main push 40건): 잡 785분 중 **356분(45%)이 필터에 걸렸을 실행**이었고
    # 그중 243분이 백엔드다. squash merge라 main의 diff는 PR의 diff와 같아 **같은 검증을 두 번**
    # 돌린 셈이다. 문서·infra만 바꾼 커밋 19건이 매번 14~28분을 태웠다.
    # 진짜 위험인 머지 스큐(각자 통과했는데 합치면 깨짐)는 사후 전체 실행으로는 못 막는다 —
    # 이미 깨진 main을 나중에 알려줄 뿐이다. 브랜치 보호의 "up to date 요구"가 그 자리다.
    if: needs.changes.outputs.backend == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: harness deps
        working-directory: harness
        run: npm ci
      - name: backend harness check
        run: node harness/backend/check.mjs
      # 매니페스트가 앱 코드와 어긋나는지 — apply 전에는 무증상이라 여기서만 잡을 수 있다.
      - name: k8s harness check
        run: node harness/k8s/check.mjs
      - name: gradle build (test 포함)
        working-directory: apps/api
        run: gradle build --no-daemon

      # 실패 리포트를 남긴다. 콘솔에 FULL 출력을 켰어도(build.gradle.kts) 긴 진단 메시지는
      # 로그에서 찾기 어렵고, 간헐적 실패는 러너가 사라지면 다시 볼 방법이 없다.
      # JUnit XML은 **성공해도** 남긴다. 클래스·메서드별 소요 시간이 여기에만 있고,
      # 그게 없으면 "CI가 왜 느린가"를 추측으로만 말하게 된다.
      # (실측: backend median 9m46s 중 `:test` 하나가 501s. 그 안의 구성은 아직 모른다.)
      #
      # ⚠️ XML의 testcase 시간 합은 `:test` wall-clock과 같지 않다. Spring 컨텍스트 초기화·
      # 컨테이너 기동·워커 오버헤드는 개별 testcase에 귀속되지 않아 **미귀속 시간**으로 남는다.
      # 두 숫자의 차이가 곧 "테스트 코드 밖에서 쓰는 시간"이라 그 자체가 판단 근거다.
      #
      # HTML 리포트는 용량이 커서 실패 시에만 올린다 — 진단용이고 시간 분석엔 XML이면 된다.
      - name: upload backend test results (timing)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: apps/api/build/test-results/
          retention-days: 14

      - name: upload backend test reports (html, 실패 시)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: apps/api/build/reports/tests/
          retention-days: 14

  frontend:
    name: 프론트 (하네스 → lint → build)
    runs-on: ubuntu-latest
    needs: [changes, harness-meta]
    # 변경 영역에 해당할 때만 실행(backend 잡의 주석 참고 — push도 동일하게 필터한다).
    if: needs.changes.outputs.frontend == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - name: harness deps
        working-directory: harness
        run: npm ci
      - name: frontend harness check
        run: node harness/frontend/check.mjs
      - name: install
        working-directory: apps/web
        run: pnpm install --frozen-lockfile
      - name: typecheck
        working-directory: apps/web
        run: pnpm typecheck
      - name: lint
        working-directory: apps/web
        run: pnpm lint
      - name: build
        working-directory: apps/web
        run: pnpm build

  e2e:
    name: E2E (Playwright, 풀스택)
    runs-on: ubuntu-latest
    needs: [changes, harness-meta]
    # 변경 영역에 해당할 때만 실행(backend 잡의 주석 참고 — push도 동일하게 필터한다).
    if: needs.changes.outputs.e2e == 'true'
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: flowticket
          POSTGRES_USER: flowticket
          POSTGRES_PASSWORD: flowticket
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U flowticket"
          --health-interval 5s --health-timeout 5s --health-retries 12
      redis:
        image: redis:7.4 # ZPOPMIN(5.0+) 필수 — 대기열 승격 Lua (TS-002)
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DB_PORT: "5432"
      DB_PASSWORD: flowticket
      JWT_SECRET: ci-e2e-secret-0123456789-0123456789-0123456789
      # 관리자 부트스트랩(S07 admin E2E). CI 전용 합성 픽스처 — 실 비밀 아님.
      ADMIN_EMAIL: admin-e2e@flowticket.local
      ADMIN_PASSWORD: e2e-admin-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - uses: pnpm/action-setup@v4
        with:
          version: 9

      # 1) 백엔드 빌드 → 백그라운드 기동 → health 대기(Flyway 마이그레이션 완료)
      - name: build backend jar
        working-directory: apps/api
        run: gradle bootJar --no-daemon -x test
      - name: run backend
        run: |
          JAR=$(ls apps/api/build/libs/*.jar | grep -v -- '-plain' | head -1)
          echo "starting $JAR"
          nohup java -jar "$JAR" > backend.log 2>&1 &
      - name: wait for backend
        run: |
          for i in $(seq 1 60); do
            curl -sf http://localhost:8080/actuator/health && { echo "backend up"; exit 0; }
            sleep 3
          done
          echo "::error::backend failed to start"; tail -120 backend.log; exit 1

      # 2) E2E 테스트 데이터 시드(판매중 이벤트 + 좌석)
      - name: seed e2e data
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client
          PGPASSWORD=flowticket psql -h localhost -U flowticket -d flowticket -f e2e/ci/seed.sql

      # 3) 프론트 빌드 → 백그라운드 기동 → 대기
      - name: build & run web
        working-directory: apps/web
        env:
          # 대기열 폴링을 테스트 시간 밖으로 밀어낸다(10분). **운영 후보값이 아니다** —
          # admit-ttl(300초)보다도 길어 운영에서는 성립하지 않는다. 폴링이 살아 있으면
          # SSE 재연결 복구(onopen)를 그것이 먼저 덮어버려 회귀 테스트가 성립하지 않는다.
          #
          # ⚠️ NEXT_PUBLIC_*은 **빌드 시점에 번들로 박힌다.** 아래 pnpm start에만 주면 늦다.
          # build와 start가 같은 스텝이라 이 env가 둘 다에 적용된다.
          NEXT_PUBLIC_QUEUE_POLL_INTERVAL_MS: "600000"
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          nohup pnpm start > ../../web.log 2>&1 &
      - name: wait for web
        run: |
          for i in $(seq 1 40); do
            curl -sf http://localhost:3000 > /dev/null && { echo "web up"; exit 0; }
            sleep 3
          done
          echo "::error::web failed to start"; tail -120 web.log; exit 1

      # 4) Playwright 실행(풀스택 대상)
      - name: install e2e deps
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: run e2e
        working-directory: e2e
        env:
          E2E_BASE_URL: http://localhost:3000
        run: npx playwright test

      # 5) 실패 시 trace(CCTV) 아티팩트 업로드 — 에이전트 디버깅용
      - name: upload playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            e2e/test-results/
            e2e/playwright-report/
            backend.log
            web.log
          retention-days: 7
