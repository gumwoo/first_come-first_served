# VIOLATION: bootstrap.sh가 적용하지 않는 ExternalSecret → 하네스가 실패해야 함
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: orphan-secret
  namespace: monitoring
spec:
  secretStoreRef: { name: aws-ssm, kind: ClusterSecretStore }
  target: { name: orphan-secret }
  data:
    - { secretKey: token, remoteRef: { key: /flowticket/ORPHAN } }
