# flowticket-api-secrets 를 AWS에서 동기화한다. 손으로 넣으면 클러스터를 재생성할 때마다 값 11개를
# 다시 넣어야 한다(개수는 bootstrap.sh 마지막의 "키 11개면 정상" 확인과 짝이다).
#
# Secret은 하나여야 해서(Deployment의 envFrom이 하나를 참조) 출처 둘을 data 항목별 sourceRef로 합친다.
#   9개 ← SSM Parameter Store(우리가 넣는 값), 2개 ← Secrets Manager(RDS가 관리하는 DB 자격증명)
#
# 값이 하나라도 틀리면 api 파드 전체가 기동에 실패한다. 이름을 바꿀 때는 새 이름으로 먼저
# 만들어 키·바이트 수를 비교한 뒤 전환한다.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: flowticket-api-secrets
  namespace: flowticket
spec:
  # 짧게 잡을 이유가 없다(AWS API 호출·한도).
  refreshInterval: 1h
  secretStoreRef:
    name: aws-ssm
    kind: ClusterSecretStore
  target:
    name: flowticket-api-secrets
    creationPolicy: Owner
  data:
    - { secretKey: ADMIN_EMAIL, remoteRef: { key: /flowticket/ADMIN_EMAIL } }
    - { secretKey: ADMIN_PASSWORD, remoteRef: { key: /flowticket/ADMIN_PASSWORD } }
    - { secretKey: JWT_SECRET, remoteRef: { key: /flowticket/JWT_SECRET } }
    - { secretKey: KAKAO_CLIENT_ID, remoteRef: { key: /flowticket/KAKAO_CLIENT_ID } }
    - { secretKey: KAKAO_CLIENT_SECRET, remoteRef: { key: /flowticket/KAKAO_CLIENT_SECRET } }
    - { secretKey: NAVER_CLIENT_ID, remoteRef: { key: /flowticket/NAVER_CLIENT_ID } }
    - { secretKey: NAVER_CLIENT_SECRET, remoteRef: { key: /flowticket/NAVER_CLIENT_SECRET } }
    - { secretKey: KOPIS_SERVICE_KEY, remoteRef: { key: /flowticket/KOPIS_SERVICE_KEY } }
    - { secretKey: TOSS_SECRET_KEY, remoteRef: { key: /flowticket/TOSS_SECRET_KEY } }
    # DB 2개만 스토어가 다르다. RDS 시크릿은 {"username":..,"password":..} JSON이라 property로 꺼낸다.
    # __RDS_SECRET_ARN__ 은 플레이스홀더다. RDS를 재생성하면 시크릿 이름(rds!db-<id>)이 바뀌므로
    # bootstrap.sh가 적용 시점에 `terraform output -raw db_secret_arn`으로 채운다.
    # dataFrom.find 자동 탐색은 기각했다: ListSecrets 권한이 더 필요하고 값이 username/password로 분해되지 않는다.
    - secretKey: DB_USERNAME
      sourceRef:
        storeRef: { name: aws-secretsmanager, kind: ClusterSecretStore }
      remoteRef:
        key: __RDS_SECRET_ARN__
        property: username
    - secretKey: DB_PASSWORD
      sourceRef:
        storeRef: { name: aws-secretsmanager, kind: ClusterSecretStore }
      remoteRef:
        key: __RDS_SECRET_ARN__
        property: password
