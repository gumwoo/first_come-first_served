# 위반 fixture: 피크 모양이 api 회피만 required로 바꾸고 requests를 1100m로 올리지 않는다.
# 평시 200m로 6개가 떠 오픈 순간 구성이 측정한 구성(대기열 1100m)과 달라진다(ADR-025, ADR-031).
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
patches:
  - target: { kind: Deployment, name: flowticket-api-queue }
    patch: |
      - op: replace
        path: /spec/template/spec/affinity
        value:
          podAntiAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              - labelSelector:
                  matchLabels: { app: flowticket-api }
                topologyKey: kubernetes.io/hostname
