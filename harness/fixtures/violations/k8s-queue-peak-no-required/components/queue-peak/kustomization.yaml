# 위반 fixture: 피크 모양이 requests만 올리고 api 회피를 required로 바꾸지 않는다.
# 평시 모양의 preferred가 남아 사전 확장 때 새 대기열 Pod가 api 노드에 놓일 수 있다(IMP-038, ADR-031).
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
patches:
  - target: { kind: Deployment, name: flowticket-api-queue }
    patch: |
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: 1100m
