apiVersion: apps/v1
kind: Deployment
metadata:
  name: flowticket-web
  namespace: flowticket
spec:
  replicas: 2
  selector:
    matchLabels: { app: flowticket-web }
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  template:
    metadata:
      labels: { app: flowticket-web }
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: web
          image: flowticket-web:REPLACE_TAG
          ports:
            - containerPort: 3000
          env:
            # next.config.mjs의 rewrites()가 읽는 값이다(NEXT_PUBLIC_* 아님 — 브라우저가 아니라
            # **Next 서버**가 쓰는 주소라 클러스터 내부 DNS면 충분하고, 그래야 API가 외부에
            # 노출되지 않는다). 같은 네임스페이스라 Service 이름만으로 해석된다.
            #   /api/:path*    → ${API_ORIGIN}/:path*      (접두어 제거)
            #   /oauth2/:path* → ${API_ORIGIN}/oauth2/...  (소셜 로그인 전체 이동)
            - name: API_ORIGIN
              value: "http://flowticket-api"
          # Next.js standalone 서버에는 전용 헬스 엔드포인트가 없다. 루트 응답으로 갈음한다 —
          # "프로세스가 HTTP를 받는가"까지만 보는 것이고, 그 이상은 확인하지 않는다(정직).
          readinessProbe:
            httpGet: { path: /, port: 3000 }
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /, port: 3000 }
            periodSeconds: 15
            failureThreshold: 3
          lifecycle:
            preStop:
              exec: { command: ["sh", "-c", "sleep 5"] }
          resources:
            requests: { cpu: "100m", memory: "256Mi" }
            limits: { memory: "512Mi" }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
---
apiVersion: v1
kind: Service
metadata:
  name: flowticket-web
  namespace: flowticket
spec:
  selector: { app: flowticket-web }
  ports:
    - port: 80
      targetPort: 3000
