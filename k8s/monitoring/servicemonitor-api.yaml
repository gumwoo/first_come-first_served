apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: flowticket-api
  namespace: flowticket
spec:
  # Service 라벨로 고르고 Pod마다 별도 타깃으로 스크레이프한다(Pod별 JVM·스레드 구분).
  # job 라벨은 Service 이름이 아니라 flowticket.io/job 값이다. 대기열 전용 Service(ADR-027, B)도 같은 라벨과
  # 값(flowticket-api)을 받으므로 알림 규칙·대시보드의 job="flowticket-api"가 두 종류 파드를 함께 본다.
  jobLabel: flowticket.io/job
  selector:
    matchLabels: { flowticket.io/metrics: "true" }
  namespaceSelector:
    matchNames: ["flowticket"]
  endpoints:
    # Service 포트 이름으로 지정한다(번호가 아니다): k8s/base/api-deployment.yaml의 `name: management`(8081).
    - port: management
      path: /actuator/prometheus
      interval: 15s
      # 스크레이프는 인증 없이 나간다(SecurityConfig가 이 경로만 permitAll). actuator가 관리 포트(8081)에만
      # 있고 인터넷 경로(ALB → web → Next rewrite)는 8080만 쓰기 때문에 내부 전용으로 유지된다(TS-041).
