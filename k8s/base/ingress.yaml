# AWS Load Balancer Controller가 이 Ingress를 보고 ALB를 만든다.
# 컨트롤러 설치는 부트스트랩 Helm의 몫이고, IRSA 역할은 platform 스택이 만든다
# (terraform output irsa_role_arns.load_balancer_controller).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: flowticket
  namespace: flowticket
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    # target-type: ip는 Pod IP를 직접 타깃으로 등록한다. instance 모드보다 홉이 하나 적고,
    # Pod 교체 시 등록/해제가 Pod 단위라 롤링 배포와 궁합이 낫다.
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80},{"HTTPS":443}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    alb.ingress.kubernetes.io/certificate-arn: REPLACE_ACM_CERT_ARN
    alb.ingress.kubernetes.io/healthcheck-path: /actuator/health/readiness
    # 등록 해제 유예. Pod의 preStop(5s)과 짝이다 — ALB가 타깃을 빼는 동안 진행 중 요청을 마친다.
    alb.ingress.kubernetes.io/target-group-attributes: deregistration_delay.timeout_seconds=10
spec:
  ingressClassName: alb
  rules:
    - host: flow-ticket.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend: { service: { name: flowticket-api, port: { number: 80 } } }
          - path: /actuator
            pathType: Prefix
            backend: { service: { name: flowticket-api, port: { number: 80 } } }
          - path: /
            pathType: Prefix
            backend: { service: { name: flowticket-web, port: { number: 80 } } }
