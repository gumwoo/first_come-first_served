apiVersion: apps/v1
kind: Deployment
metadata:
  name: flowticket-api
  namespace: flowticket
spec:
  # 파드 사양을 바꾸면 대기열 전용 사본(k8s/components/queue-split/queue-deployment.yaml)도 같이 바꾼다 — 하네스 k8s 규칙 ⑩-b(ADR-027).
  # replicas를 두지 않는다. HPA(api-hpa.yaml)가 소유하며, 값을 두면 ArgoCD sync가 HPA가 정한 파드 수를 덮어쓴다(TS-022).
  selector:
    matchLabels: { app: flowticket-api }
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # 무중단의 핵심 두 줄. maxUnavailable=0이라 새 Pod가 Ready가 된 뒤에만 옛 Pod가 빠진다.
      # 1로 두면 롤링 도중 용량이 먼저 줄어 부하 중 배포에서 에러가 난다.
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      # flowticket.io/app: api — api와 대기열 전용 파드 공통. 로그 수집·정합성 검사가 이 라벨로 둘 다 고른다(ADR-027).
      labels: { app: flowticket-api, flowticket.io/app: api }
    spec:
      # 앱의 SHUTDOWN_TIMEOUT(30s, configmap.yaml) + preStop(5s)보다 커야 한다. 작으면 진행 중 요청을 마치기 전에 SIGKILL이 온다.
      terminationGracePeriodSeconds: 45

      # 같은 AZ에 replica가 몰리면 AZ 하나를 잃을 때 용량이 통째로 빠진다.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app: flowticket-api }

      containers:
        - name: api
          image: flowticket-api:REPLACE_TAG # kustomization.yaml의 images:가 덮어쓴다
          ports:
            - containerPort: 8080
              name: http
            # actuator 전용(아래 env MANAGEMENT_SERVER_PORT). Prometheus만 긁는다 — 인터넷에서 닿는 8080과 분리(TS-041).
            - containerPort: 8081
              name: management
          # TZ는 UTC로 고정한다. 엔티티 시각과 응답 직렬화가 컨테이너 존을 따르고 DB에는 UTC 벽시계가 쌓여 있어,
          # 존을 바꾸면 기존 행 전부의 시각이 어긋난다(TS-039). 바꾸려면 Instant/timestamptz 전환을 Expand-Contract로 한다.
          # 하네스 k8s 규칙 7)이 이 줄의 존재와 값을 강제한다.
          env:
            - name: TZ
              value: UTC
            # actuator 전용 관리 포트(TS-041). ConfigMap이 아니라 probe와 같은 파드 템플릿에 둬 둘이 한 번에 바뀌게 한다 —
            # 공용 ConfigMap에 두면 롤아웃 중 옛·새 템플릿 파드가 맞지 않는 값을 읽는다(404 재시작 반복, 또는 8080에 actuator 잔존).
            # 하네스 k8s 규칙 ⑩이 이 값(8080이 아닌 숫자)과 probe 위치를 강제한다.
            - name: MANAGEMENT_SERVER_PORT
              value: "8081"
          envFrom:
            - configMapRef: { name: flowticket-api-config }
            - secretRef: { name: flowticket-api-secrets } # 클러스터 밖에서 생성(k8s/README.md)

          # probe 경로는 application.yml의 health group과 한 쌍이다.
          #   readiness = readinessState, db   (Redis는 넣지 않는다, ADR-030)
          #   liveness  = livenessState        (외부 의존성을 넣으면 DB 장애에 무한 재시작)
          # /readyz·/livez는 메인 포트(8080)에 둔다. 관리 포트(8081)는 별도 톰캣이라 8080 요청 스레드가 포화돼도 성공해 버린다(TS-041).
          readinessProbe:
            httpGet: { path: /readyz, port: 8080 }
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /livez, port: 8080 }
            periodSeconds: 10
            # 12회(첫 실패 후 약 110초): health 요청도 진입 요청과 같은 톰캣 스레드 풀에서 처리돼, 부하 중 바쁜 파드가
            # liveness 시간 초과로 재시작되지 않게 한 완화다(근거: IMP-024). 진짜로 멈춘 프로세스의 재시작은 그만큼 늦어진다.
            failureThreshold: 12
          # 기동이 느린 JVM을 liveness가 죽이지 않게 startupProbe로 분리한다(liveness initialDelay를 늘리면 기동 후에도 느슨해진다).
          startupProbe:
            httpGet: { path: /livez, port: 8080 }
            periodSeconds: 5
            failureThreshold: 30 # 최대 150초

          lifecycle:
            preStop:
              exec:
                # Pod 종료와 ALB 타깃 등록 해제가 비동기라, 바로 내려가면 아직 오는 요청이 502가 된다.
                # 5초는 드레이닝이 시작될 시간을 버는 값이고 그 창을 덮는다고 보장하지는 않는다(근거: IMP-015).
                command: ["sh", "-c", "sleep 5"]

          resources:
            # limits.cpu는 두지 않는다 — 스로틀링으로 p99가 튀고, 부하 실증에서 재려는 것이 바로 그 지연이다.
            # memory: 1Gi에서는 SSE 연결이 많을 때 컨테이너 한도 초과로 OOMKilled됐다(힙 소진이 아님, 근거: IMP-023).
            # 2Gi는 그 재시작을 없애려는 값이고 용량 산정값은 아니다.
            # cpu 1100m: 진입 burst 실측 비용에서 계산한 값(ADR-025, IMP-027). m6i.large에 api가 하나만 들어가 api 확장이 곧
            # 노드 확장(CA)이 되고, HPA 60% 기준선이 진입 처리 용량 근처에서 반응한다. 바꾸면 HPA·노드 예산을 함께 다시 본다.
            requests: { cpu: "1100m", memory: "1536Mi" }
            limits: { memory: "2Gi" }

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false # JVM 임시 파일 필요
            capabilities: { drop: ["ALL"] }
---
apiVersion: v1
kind: Service
metadata:
  name: flowticket-api
  namespace: flowticket
  annotations:
    # Ingress 전역 healthcheck-path `/`는 web용이라 api에서는 401 → unhealthy가 된다. Service 주석이 Ingress 주석보다
    # 우선하므로 여기서 probe와 같은 메인 포트 readiness 경로를 지정한다(ADR-024, TS-041).
    alb.ingress.kubernetes.io/healthcheck-path: /readyz
  # flowticket.io/metrics: ServiceMonitor 선택 기준(Service의 metadata.labels를 본다 — 없으면 에러 없이 타깃이 0개다).
  # flowticket.io/job: 대기열 전용 Service도 같은 값을 써서 알림 규칙(job="flowticket-api")이 두 종류 파드를 함께 본다(ADR-027).
  labels: { app: flowticket-api, flowticket.io/metrics: "true", flowticket.io/job: flowticket-api }
spec:
  selector: { app: flowticket-api }
  ports:
    # ServiceMonitor는 포트를 이름으로 지정한다 — 이름을 바꾸거나 지우면 에러 없이 타깃이 0개가 된다.
    - name: http
      port: 80
      targetPort: 8080
    # Prometheus 스크레이프 전용(ServiceMonitor endpoints[].port: management). web의 rewrite는 80(→8080)만 쓴다.
    - name: management
      port: 8081
      targetPort: 8081
