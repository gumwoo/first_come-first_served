name: Image

# 이미지는 "테스트를 통과한 커밋"에서만 나가야 한다(ADR-009). 그래서 push가 아니라
# CI 워크플로가 성공으로 끝났을 때 이어서 돈다 — push 트리거면 CI와 병렬로 돌아
# 테스트가 깨진 커밋의 이미지도 ECR에 올라간다.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  # 최초 검증·재시도용(파이프라인만 확인하고 싶을 때).
  workflow_dispatch:

# OIDC로 AWS 역할을 맡으려면 id-token 발급 권한이 필요하다(장기 액세스 키를 쓰지 않는 이유).
permissions:
  id-token: write
  # 기본은 읽기만. write가 실제로 필요한 건 bump-tag 하나뿐이라 그 잡에만 준다
  # (잡 레벨 permissions는 이 블록을 대체하므로 bump-tag는 id-token을 받지 않는다 — 필요 없다).
  contents: read

env:
  AWS_REGION: ap-northeast-2

jobs:
  # 시크릿은 job-level if에서 참조할 수 없어(컨텍스트 미제공), 별도 잡에서 존재 여부를 출력한다.
  # 포크·시크릿 미설정 환경에서 AWS 단계가 실패하지 않고 조용히 건너뛰게 하는 가드.
  guard:
    name: 전제 확인 (시크릿·변경 영역)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    outputs:
      ready: ${{ steps.check.outputs.ready }}
      sha: ${{ steps.check.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          # workflow_run 이벤트의 기본 checkout은 트리거 워크플로의 커밋이 아니다 — head_sha를 명시.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 2
      - id: check
        env:
          ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
        run: |
          SHA="${{ github.event.workflow_run.head_sha || github.sha }}"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

          if [ -z "$ROLE_ARN" ]; then
            echo "::notice::AWS_ROLE_ARN 시크릿이 없어 이미지 빌드를 건너뜁니다."
            echo "ready=false" >> "$GITHUB_OUTPUT"; exit 0
          fi

          # workflow_run에는 paths 필터를 걸 수 없어, 이미지에 영향 있는 변경인지 직접 판별한다.
          # (문서만 고친 머지에 이미지 빌드를 돌리지 않기 위함 — CI의 paths 필터와 같은 취지)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if git diff --name-only HEAD^ HEAD | grep -qE '^(apps/(api|web)/|infra/|\.dockerignore|\.github/workflows/image\.yml)'; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::이미지에 영향 있는 변경이 없어 건너뜁니다."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

  api:
    name: API 이미지 → ECR
    runs-on: ubuntu-latest
    needs: guard
    if: needs.guard.outputs.ready == 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.guard.outputs.sha }}
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      # GitHub 러너는 매 실행 빈 Docker 캐시로 시작한다. Dockerfile이 의존성 해석을 별도
      # 레이어로 분리해 뒀어도(apps/api/Dockerfile), 캐시가 없으면 매번 처음부터 받는다.
      # buildx + GHA 캐시로 그 레이어를 실행 간에 재사용한다.
      - uses: docker/setup-buildx-action@v3
      - name: build & push (태그 = git SHA)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          # 태그를 git SHA로 고정하면 "지금 도는 이미지가 어떤 코드인지"가 1:1로 연결되고,
          # 롤백도 이전 SHA 이미지로 되돌리면 된다(latest 같은 이동 태그는 쓰지 않는다).
          tags: ${{ steps.ecr.outputs.registry }}/flowticket-api:${{ needs.guard.outputs.sha }}
          # mode=max: 멀티스테이지의 builder 단계까지 캐시한다. 비용이 큰 곳이 거기라
          # 기본값(mode=min, 최종 레이어만)으로는 효과가 없다.
          # scope 분리: api/web이 같은 캐시 공간을 두고 서로를 밀어내지 않게 한다.
          cache-from: type=gha,scope=image-api
          cache-to: type=gha,mode=max,scope=image-api
      - name: 요약
        run: |
          echo "### API 이미지 push 완료" >> "$GITHUB_STEP_SUMMARY"
          echo "\`${{ steps.ecr.outputs.registry }}/flowticket-api:${{ needs.guard.outputs.sha }}\`" >> "$GITHUB_STEP_SUMMARY"

  web:
    name: Web 이미지 → ECR
    runs-on: ubuntu-latest
    needs: guard
    if: needs.guard.outputs.ready == 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.guard.outputs.sha }}
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - uses: docker/setup-buildx-action@v3

      # 빌드 전에 값을 확인한다. ARG가 선언돼 있어도 **값이 비면 빌드는 그냥 성공**하고,
      # 결제창이 뜨지 않는 이미지가 조용히 ECR로 나간다 — 에러가 아니라 다른 흐름으로 빠지기
      # 때문에 배포 후에도 눈치채기 어렵다. 하네스 규칙 ⑥은 ARG의 **존재**만 보므로
      # 이 구멍은 여기서만 막을 수 있다.
      - name: 빌드 인자 확인 (빈 값이면 조용히 기능이 빠진다)
        env:
          TOSS_CLIENT_KEY: ${{ vars.NEXT_PUBLIC_TOSS_CLIENT_KEY }}
        run: |
          if [ -z "$TOSS_CLIENT_KEY" ]; then
            echo "::error::NEXT_PUBLIC_TOSS_CLIENT_KEY repository variable이 비어 있습니다."
            echo "::error::이대로 빌드하면 토스 결제창이 뜨지 않고 결제창 없는 경로로 빠집니다(ADR-005)."
            echo "::error::설정: Settings → Secrets and variables → Actions → Variables"
            exit 1
          fi

      - name: build & push (태그 = git SHA)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/flowticket-web:${{ needs.guard.outputs.sha }}
          # API_ORIGIN은 **빌드 시점에 굳는다**(S09-1 실측 — apps/web/Dockerfile 참고).
          # Next standalone이 rewrites 목적지를 번들로 구워 런타임 env로는 바뀌지 않으므로
          # 여기서 정한다.
          #
          # 이 값은 폴백이 아니라 **실제 요청 경로에 낀다**: ALB는 web만 보고, 브라우저의
          # /api/* 는 Next rewrite가 이 주소로 프록시한다(Ingress가 API로 직결하면 ALB가
          # 접두어를 떼지 않아 Spring이 404를 낸다).
          #
          # NEXT_PUBLIC_TOSS_CLIENT_KEY도 같은 이유로 빌드 시점 값이다(브라우저 번들에 구워짐).
          # **공개 키라 시크릿이 아니다** — repository variable로 둔다.
          # ⚠️ 이 변수가 비어 있으면 빌드는 성공하지만 **토스 결제창이 뜨지 않고** 결제창 없는
          # 경로로 빠진다. 에러가 아니라 다른 흐름이라 배포 후에도 눈치채기 어렵다.
          #   설정: 저장소 Settings → Secrets and variables → Actions → Variables
          #
          # 값은 k8s Service DNS다. **포트를 붙이지 않는다** — Service는 80을 열고 targetPort
          # 8080으로 넘긴다. :8080을 붙이면 Service가 안 여는 포트라 연결이 거부된다.
          # (주석은 build-args 블록 밖에 둔다 — 안에 넣으면 인자로 전달된다.)
          build-args: |
            API_ORIGIN=${{ vars.API_ORIGIN || 'http://flowticket-api' }}
            NEXT_PUBLIC_TOSS_CLIENT_KEY=${{ vars.NEXT_PUBLIC_TOSS_CLIENT_KEY }}
          cache-from: type=gha,scope=image-web
          cache-to: type=gha,mode=max,scope=image-web
      - name: 요약
        run: |
          echo "### Web 이미지 push 완료" >> "$GITHUB_STEP_SUMMARY"
          echo "\`${{ steps.ecr.outputs.registry }}/flowticket-web:${{ needs.guard.outputs.sha }}\`" >> "$GITHUB_STEP_SUMMARY"

  # ─────────────────────────────────────────────────────────────────────────────
  # GitOps: 새 이미지 태그를 **Git에 커밋**한다. ArgoCD는 Git만 보므로 이 단계가 없으면
  # 이미지를 아무리 push해도 클러스터에 반영되지 않는다("설치는 했는데 하는 일이 없는" GitOps).
  #
  # ⚠️ 무한 루프 주의: CI가 `push: [main]`에 반응하고, 이미지 워크플로는 그 CI의 완료에
  # 반응한다. 태그 커밋을 그냥 밀면 CI → image → 커밋 → CI → … 가 끝없이 돈다.
  # 커밋 메시지에 **[skip ci]** 를 넣어 GitHub이 워크플로를 건너뛰게 해서 고리를 끊는다.
  # ─────────────────────────────────────────────────────────────────────────────
  bump-tag:
    name: 매니페스트 태그 갱신(GitOps)
    runs-on: ubuntu-latest
    needs: [guard, api, web]
    if: needs.guard.outputs.ready == 'true'
    permissions:
      # 이 잡만 main에 태그 커밋을 push한다. 다른 잡은 읽기 권한만 갖는다.
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # 태그는 항상 main 최신에 얹는다. 빌드한 코드의 SHA는 아래에서 값으로만 쓴다.
          ref: main
          # 기본 GITHUB_TOKEN으로 푸시한다. 이 토큰의 푸시는 워크플로를 다시 트리거하지 않지만,
          # 그 동작에 기대지 않고 [skip ci]로도 막는다(이중 방어).
          persist-credentials: true

      - name: kustomization 태그 갱신
        id: bump
        run: |
          SHA="${{ needs.guard.outputs.sha }}"
          F=k8s/overlays/demo-local/kustomization.yaml
          if [ ! -f "$F" ]; then echo "::error::$F 가 없다 — 오버레이가 커밋돼 있어야 한다"; exit 1; fi
          # newTag 값만 교체(40자 hex). 역참조를 쓰지 않는다 — 치환문에 그대로 다시 쓰면 되고,
          # 역참조는 여러 겹의 이스케이프를 거치며 깨지기 쉽다(실제로 제어문자가 들어갔다).
          sed -i -E "s|newTag: [0-9a-f]{40}|newTag: ${SHA}|g" "$F"
          if git diff --quiet -- "$F"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "태그가 이미 $SHA — 커밋 생략"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            grep -n "newTag:" "$F"
          fi

      - name: 커밋 & 푸시
        if: steps.bump.outputs.changed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add k8s/overlays/demo-local/kustomization.yaml
          git commit -m "chore(deploy): 이미지 태그 ${{ needs.guard.outputs.sha }} [skip ci]"
          # 빌드가 도는 동안 main이 움직였을 수 있다. 리베이스 후 재시도한다(최대 3회).
          for i in 1 2 3; do
            if git push origin main; then exit 0; fi
            echo "푸시 실패 — main을 리베이스하고 재시도($i/3)"
            git pull --rebase origin main
          done
          echo "::error::태그 커밋 푸시 실패 — main 경합이 3회 이상 발생했다"
          exit 1

      - name: 요약
        run: |
          echo "### 매니페스트 태그" >> "$GITHUB_STEP_SUMMARY"
          echo "- SHA: \`${{ needs.guard.outputs.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- 커밋: ${{ steps.bump.outputs.changed }}" >> "$GITHUB_STEP_SUMMARY"
