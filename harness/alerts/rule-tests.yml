# promtool 규칙 테스트 — **알림이 실제로 발화하는가/안 하는가**를 시계열을 직접 만들어 판정한다.
# Prometheus 서버도 클러스터도 부하도 필요 없다.
#
# ⚠️ 이 테스트가 잡지 못하는 것: **지표 이름 오타.** 규칙과 테스트에 같은 이름을 쓰면 둘 다
# 통과한다. 그쪽은 렌더링된 스크랩 출력과 대조하는 백엔드 테스트가 맡는다
# (apps/api/src/test/java/com/flowticket/global/metrics/OperationalMetricsTest.java).
rule_files:
  - rules.yml

evaluation_interval: 1m

tests:
  # ── 저트래픽 오탐 방지 ──────────────────────────────────────────
  # 새벽에 요청 3건 중 3건이 실패하면 비율은 100%다. 비율만 보면 그때마다 깨운다.
  # 그래서 절대 건수 조건(`and ... > 0.1`)을 함께 걸었고, **그게 실제로 막는지**를 본다.
  - interval: 1m
    name: "요청이 거의 없을 때는 5xx 비율이 100%여도 울리지 않는다"
    input_series:
      - series: 'http_server_requests_seconds_count{job="flowticket-api",outcome="SERVER_ERROR"}'
        values: "0+1x15" # 분당 1건 → rate ≈ 0.0167/s (임계 0.1 미만)
    alert_rule_test:
      - eval_time: 12m
        alertname: FlowticketHighServerErrorRate
        exp_alerts: []

  # ── 격리 행이 없으면 조용해야 한다 ──────────────────────────────
  - interval: 1m
    name: "DEAD 행이 0이면 울리지 않는다"
    input_series:
      - series: 'flowticket_outbox_events{job="flowticket-api",status="DEAD"}'
        values: "0x15"
    alert_rule_test:
      - eval_time: 12m
        alertname: FlowticketOutboxDeadRows
        exp_alerts: []

  # ── 짧은 스파이크로는 울리지 않는다(for 검증) ────────────────────
  # 적체가 잠깐 튀는 것은 정상이다. `for: 10m`이 그걸 걸러내는지 본다.
  - interval: 1m
    name: "아웃박스 적체가 잠깐 튀는 것으로는 울리지 않는다"
    input_series:
      - series: 'flowticket_outbox_events{job="flowticket-api",status="PENDING"}'
        values: "0 0 900 900 0 0 0 0 0 0 0 0" # 2분만 임계 초과
    alert_rule_test:
      - eval_time: 11m
        alertname: FlowticketOutboxBacklog
        exp_alerts: []

  # ── 지속되면 울린다 ────────────────────────────────────────────
  - interval: 1m
    name: "DEAD 행이 5분 넘게 남아 있으면 울린다"
    input_series:
      - series: 'flowticket_outbox_events{job="flowticket-api",status="DEAD"}'
        values: "0 0 2 2 2 2 2 2 2 2 2 2"
    alert_rule_test:
      - eval_time: 10m
        alertname: FlowticketOutboxDeadRows
        exp_alerts:
          # max()가 by 없이 집계하므로 시계열 라벨은 모두 떨어진다 — 규칙이 붙인 것만 남는다.
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: "아웃박스에 격리된 이벤트가 있다 (2건)"
              description: >-
                재시도로 성공할 수 없어 DEAD로 격리된 행이다. 같은 aggregate의 후속 이벤트가 보류된다.
                /admin/outbox 에서 payload와 lastError를 보고 재발행 또는 폐기를 판단한다.
              runbook_url: "https://github.com/gumwoo/first_come-first_served/blob/main/docs/troubleshooting/TS-032-outbox-poison-row-head-of-line.md"
