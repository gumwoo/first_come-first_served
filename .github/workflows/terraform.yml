name: Terraform

# 로컬에 terraform이 없어(백엔드 gradle과 같은 상황) 문법·구성 검증을 CI에서 한다.
# fmt/validate는 AWS 자격증명이 필요 없다 — plan/apply는 여기서 하지 않는다.
# 인프라 생성은 사람이 사전 조건(쿼터·비용 안전망·destroy 절차)을 확인한 뒤 수동으로 한다.

on:
  push:
    branches: [main]
    paths: ["infra/terraform/**", ".github/workflows/terraform.yml"]
  pull_request:
    paths: ["infra/terraform/**", ".github/workflows/terraform.yml"]

permissions:
  contents: read

jobs:
  validate:
    name: fmt + validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
          # validate 출력을 그대로 보려면 래퍼를 꺼야 한다.
          terraform_wrapper: false

      - name: fmt (전체 트리)
        # -diff: 어긋난 부분을 로그에 그대로 찍어 로컬에 terraform이 없어도 고칠 수 있게 한다.
        run: terraform fmt -check -recursive -diff infra/terraform

      - name: validate (스택별)
        run: |
          set -e
          # 루트 스택 = versions.tf 가 있는 디렉터리(modules/ 제외).
          # 환경 디렉터리를 하드코딩하지 않아 스택이 늘어도 워크플로를 고칠 필요가 없다.
          # -backend=false: 실제 S3 backend에 붙지 않고 구성만 검증한다(자격증명 불필요).
          for dir in $(find infra/terraform -name versions.tf -not -path '*/modules/*' \
                        -exec dirname {} \; | sort); do
            echo "::group::$dir"
            terraform -chdir="$dir" init -backend=false -input=false
            terraform -chdir="$dir" validate
            echo "::endgroup::"
          done

      # 잠금 파일은 커밋 대상인데 로컬에 terraform이 없어 여기서 만든다.
      # OS별 체크섬이 다르므로 개발·CI·러너에서 쓰는 플랫폼을 모두 넣는다 —
      # 하나만 넣으면 다른 OS에서 init할 때 잠금 검증이 실패한다.
      - name: 잠금 파일 생성 (아티팩트)
        run: |
          set -e
          for dir in $(find infra/terraform -name versions.tf -not -path '*/modules/*' \
                        -exec dirname {} \; | sort); do
            terraform -chdir="$dir" providers lock \
              -platform=linux_amd64 \
              -platform=darwin_arm64 \
              -platform=windows_amd64
          done

      - uses: actions/upload-artifact@v4
        with:
          name: terraform-lockfiles
          path: infra/terraform/**/.terraform.lock.hcl
          if-no-files-found: error
          # 점으로 시작하는 파일은 기본적으로 제외된다.
          include-hidden-files: true
