# ArgoCD Application — 이 저장소의 k8s/overlays/demo-local 을 클러스터에 지속 동기화한다.
#
# 왜 GitOps인가: 이 프로젝트의 철학이 "Git이 단일 진실원, 계약/가드로 스스로 증명"이다(ADR-009).
# 코드 계약은 harness가 검사하고, 클러스터의 실제 상태는 ArgoCD가 Git과 diff한다.
#
# 측정·장애 대응 중 손으로 넣은 kubectl 변경은 드리프트로 남기 쉽다(TS-021 §6-1).
# 사람이 기억으로 되돌리는 방식은 실패한다.
#
# 부트스트랩은 한 번 수동이다: kubectl apply -f k8s/argocd/application.yaml
#    (이 파일 자체를 ArgoCD가 관리하게 하려면 App-of-Apps가 필요한데, 계획서상 지양한다 —
#     스코프가 커지고 이 규모에서 얻는 게 없다.)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: flowticket
  namespace: argocd
  finalizers:
    # Application을 지울 때 배포된 리소스도 함께 정리되도록 한다(고아 리소스 방지).
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/gumwoo/first_come-first_served.git
    targetRevision: main
    # kustomize 오버레이를 가리킨다. base가 아니라 오버레이여야 이미지 태그·엔드포인트가 채워진다.
    path: k8s/overlays/demo-local
  destination:
    server: https://kubernetes.default.svc
    namespace: flowticket
  syncPolicy:
    # 자동 동기화를 켠다. 두 전제가 모두 성립해야 한다.
    #  1) CI가 이미지 태그를 Git에 커밋한다(image.yml의 bump-tag). 이게 없으면 자동화는
    #     "새 이미지를 배포할 방법이 없는" 상태가 된다.
    #  2) sync가 HPA의 파드 수를 덮어쓰지 않는다(argocd-controller가 spec.replicas를 소유하지
    #     않음). 이게 깨진 채로 selfHeal을 켜면 부하 중 스케일아웃이 자동으로 취소된다.
    automated:
      # 클러스터에서 손으로 바꾼 것을 Git 상태로 되돌린다. 이 프로젝트가 도입한 이유 그 자체다
      # (TS-021 §6-1: HPA 수동 패치가 며칠간 드리프트로 남았다).
      selfHeal: true
      # Git에서 지운 리소스를 클러스터에서도 지운다. 없으면 "삭제"만 GitOps 밖으로 새어나가
      # 고아 리소스가 쌓인다. 적용 전 확인함 — 추적 대상은 Git 매니페스트와 1:1이고,
      # 손으로 만든 k6-load Job·k6-scripts ConfigMap·pgcheck Pod는 추적 밖이라 지워지지 않는다.
      prune: true
    syncOptions:
      # 네임스페이스가 없으면 만든다(base에 namespace.yaml이 있지만 순서 의존을 없앤다).
      - CreateNamespace=true
      # 대량 리소스가 아니므로 서버사이드 적용으로 필드 소유권 충돌을 줄인다.
      - ServerSideApply=true
      # RespectIgnoreDifferences=true 는 쓰지 않는다 — 이 클러스터에서 sync를 막지 못했다(TS-022).
      # 실제 방어는 api-deployment.yaml에서 replicas 필드를 없앤 것이다.
  # diff 노이즈 제거용이다(HPA가 정한 replicas를 OutOfSync로 띄우지 않음). sync를 막지는 못한다.
  # name으로 하나씩 명시한다 — kind 전체로 넓히면 새 Deployment의 replicas 드리프트까지 조용히 무시된다.
  ignoreDifferences:
    - group: apps
      kind: Deployment
      name: flowticket-api
      jsonPointers:
        - /spec/replicas
    - group: apps
      kind: Deployment
      name: flowticket-web
      jsonPointers:
        - /spec/replicas
