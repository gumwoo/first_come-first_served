# HPA는 **API 티어만** 건다. Kafka 컨슈머 랙으로 오토스케일하는 것은 이 프로젝트에서 억지다 —
# 컨슈머 작업이 가벼워 랙이 CPU를 따라가지 않는다(aws-eks-deploy-plan.md §0).
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: flowticket-api
  namespace: flowticket
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: flowticket-api }
  minReplicas: 3
  # 9 → 7로 줄였다. 2026-08-11 AS-IS 실측에서 **api는 병목이 아니었다** — 600 rps에서
  # 서버 p95 15ms, Hikari pending 0이었고 실패는 전부 ALB→web 연결에서 났다.
  # api를 9까지 늘릴 여유를 web에 넘긴다(노드 allocatable 5,790m 안에서 둘 다 최대로 갈 수 없다).
  #
  # 부수 효과로 TS-021의 커넥션 상한이 더 안전해진다: 9×5=45 → 7×5=35.
  maxReplicas: 7
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 60 }
  behavior:
    scaleUp:
      # 선착순 트래픽은 계단식으로 들어온다 — 천천히 늘리면 스파이크를 못 받는다.
      stabilizationWindowSeconds: 0
    scaleDown:
      # 반대로 축소는 느리게. 빨리 줄이면 다음 파도에 다시 확장하느라 진동한다(flapping).
      stabilizationWindowSeconds: 300
