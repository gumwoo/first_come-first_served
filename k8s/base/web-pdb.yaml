# web 파드가 한꺼번에 비지 않게(ADR-025 보충 — web을 낮은 우선순위로 둬 api 선점 대상이 됐다).
# 드레인·CA 축소(Eviction API)는 최소 1개를 남긴다. 스케줄러 선점은 PDB를 최대한 지키지만 다른 후보가 없으면 어기므로 보장하지 않는다.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: flowticket-web
  namespace: flowticket
spec:
  minAvailable: 1
  selector:
    matchLabels: { app: flowticket-web }
