# 시크릿 출처 두 곳.
#
#  1) SSM Parameter Store: 우리가 넣는 값 9개(JWT·OAuth·KOPIS·TOSS·관리자 계정).
#     Standard 티어 + SecureString은 저장 비용이 없고, 로테이션이 필요 없는 값이다.
#
#  2) Secrets Manager: DB 자격증명 2개. RDS가 마스터 암호를 관리한다(manage_master_user_password).
#
# 둘 다 IRSA(jwt)로 인증한다. 노드 역할이 아니라 이 ServiceAccount로 한정된다.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: aws-ssm
spec:
  provider:
    aws:
      service: ParameterStore
      region: ap-northeast-2
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: aws-secretsmanager
spec:
  provider:
    aws:
      service: SecretsManager
      region: ap-northeast-2
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
