# 허용 의존성 화이트리스트 — 이 목록 밖 의존성이 추가되면 하네스 실패.
# 새 의존성이 필요하면 이 파일을 같은 PR에서 수정(명시적 승인).

backend:
  # Spring Boot BOM이 관리하는 것은 group 단위 허용
  allowed_groups:
    - org.springframework.boot
    - org.springframework
    - org.springframework.security
    - org.springframework.kafka
    - org.springframework.data
  allowed_artifacts:
    - com.querydsl:querydsl-jpa
    - com.querydsl:querydsl-apt
    - io.jsonwebtoken:jjwt-api
    - io.jsonwebtoken:jjwt-impl
    - io.jsonwebtoken:jjwt-jackson
    - org.postgresql:postgresql
    - org.flywaydb:flyway-core
    - org.flywaydb:flyway-database-postgresql
    - io.lettuce:lettuce-core
    - io.micrometer:micrometer-registry-prometheus              # /actuator/prometheus 노출(S09 관측)
    - net.javacrumbs.shedlock:shedlock-spring                   # 멀티 Pod @Scheduled 중복 방지
    - net.javacrumbs.shedlock:shedlock-provider-redis-spring    # ShedLock Redis lock provider
    - org.projectlombok:lombok
    - com.fasterxml.jackson.dataformat:jackson-dataformat-xml   # KOPIS XML
    - org.mapstruct:mapstruct
    - jakarta.annotation:jakarta.annotation-api                 # querydsl APT
    - jakarta.persistence:jakarta.persistence-api               # querydsl APT
  test_allowed_artifacts:
    - org.springframework.boot:spring-boot-starter-test
    - org.testcontainers:junit-jupiter
    - org.testcontainers:postgresql
    - org.testcontainers:kafka
    - com.redis:testcontainers-redis

frontend:
  allowed:
    - next
    - react
    - react-dom
    - typescript
    - tailwindcss
    - "@tanstack/react-query"
    - zustand
    - react-hook-form
    - zod
    - clsx
    - tailwind-merge
    - lucide-react            # shadcn 아이콘
    - "class-variance-authority"
    - embla-carousel-react    # 메인 히어로 슬라이더
    - "qrcode.react"          # 예매 완료 QR 모바일 티켓
    - "@tosspayments/payment-sdk"  # 실 PG(Toss) 결제창 연동(BE-5 데모)
    - eslint-config-next
  # shadcn/ui는 컴포넌트 복사 방식이라 의존성으로 안 셈
  dev_allowed:
    - eslint
    - prettier
    - "@types/*"
    - postcss
    - autoprefixer
    # 단위 테스트(2026-08-20 추가). E2E는 브라우저 전체 흐름을 보고, 이쪽은 **타이밍 로직**을 본다 —
    # 폴링 백오프 재예약·SSE readyState 분기처럼 E2E로는 관측조차 못 한 것들이 있었다.
    - vitest
    - jsdom                        # renderHook에 DOM 환경이 필요하다
    - "@testing-library/react"     # 훅을 실제 React 수명주기에서 돌린다(래핑이 아니라 실물)
