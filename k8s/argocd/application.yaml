# ArgoCD Application — 이 저장소의 k8s/overlays/demo-local 을 클러스터에 지속 동기화한다.
#
# 왜 GitOps인가: 이 프로젝트의 철학이 "Git이 단일 진실원, 계약/가드로 스스로 증명"이다(ADR-009).
# 코드 계약은 harness가 검사하고, **클러스터의 실제 상태는 ArgoCD가 Git과 diff**한다.
#
# 실제로 필요했다 — 성능 측정을 하느라 `kubectl set image`(구버전 롤백), `kubectl patch hpa`
# (min=max=3 고정), `kubectl set env`(Flyway 우회)를 손으로 넣었고, 그중 HPA는 **며칠간
# 드리프트로 남아** git과 클러스터가 어긋난 상태였다(TS-021 §6-1). 사람이 기억으로 되돌리는
# 방식은 실패한다.
#
# ⚠️ 부트스트랩은 한 번 수동이다: kubectl apply -f k8s/argocd/application.yaml
#    (이 파일 자체를 ArgoCD가 관리하게 하려면 App-of-Apps가 필요한데, 계획서상 지양한다 —
#     스코프가 커지고 이 규모에서 얻는 게 없다.)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: flowticket
  namespace: argocd
  finalizers:
    # Application을 지울 때 배포된 리소스도 함께 정리되도록 한다(고아 리소스 방지).
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/gumwoo/first_come-first_served.git
    targetRevision: main
    # kustomize 오버레이를 가리킨다. base가 아니라 오버레이여야 이미지 태그·엔드포인트가 채워진다.
    path: k8s/overlays/demo-local
  destination:
    server: https://kubernetes.default.svc
    namespace: flowticket
  syncPolicy:
    # 자동 동기화를 켠다. 두 전제가 모두 충족된 뒤에 켰다.
    #  1) CI가 이미지 태그를 Git에 커밋한다(image.yml의 bump-tag). 이게 없으면 자동화는
    #     "새 이미지를 배포할 방법이 없는" 상태가 된다. #204 머지 후 실제 성공을 확인했다.
    #  2) sync가 HPA의 파드 수를 덮어쓰지 않는다. 실측: replicas 6으로 스케일한 상태에서
    #     sync(12:39:20Z) → 36초간 6 유지, managedFields에서 argocd-controller가
    #     spec.replicas를 소유하지 않음. 이게 깨진 채로 selfHeal을 켜면 부하 중 스케일아웃이
    #     자동으로 취소된다.
    automated:
      # 클러스터에서 손으로 바꾼 것을 Git 상태로 되돌린다. 이 프로젝트가 도입한 이유 그 자체다
      # (TS-021 §6-1: HPA 수동 패치가 며칠간 드리프트로 남았다).
      selfHeal: true
      # Git에서 지운 리소스를 클러스터에서도 지운다. 없으면 "삭제"만 GitOps 밖으로 새어나가
      # 고아 리소스가 쌓인다. 적용 전 확인함 — 추적 대상은 Git 매니페스트와 1:1이고,
      # 손으로 만든 k6-load Job·k6-scripts ConfigMap·pgcheck Pod는 추적 밖이라 지워지지 않는다.
      prune: true
    syncOptions:
      # 네임스페이스가 없으면 만든다(base에 namespace.yaml이 있지만 순서 의존을 없앤다).
      - CreateNamespace=true
      # 대량 리소스가 아니므로 서버사이드 적용으로 필드 소유권 충돌을 줄인다.
      - ServerSideApply=true
      # RespectIgnoreDifferences=true 를 넣었다가 **뺐다.** 문서상으로는 sync 단계에서도
      # ignoreDifferences를 존중해야 하지만, 이 클러스터(ArgoCD v3.5.0)에서는 막지 못했다.
      # 통제 실험(HPA가 없는 flowticket-web, Git=2): replicas를 4로 올리고 sync → 2로 복귀.
      # ServerSideApply를 빼고 다시 해도 결과 동일. 즉 SSA와의 상호작용이 아니다.
      # 동작하지 않는 옵션을 "이걸로 막힌다"고 남겨두면 다음 사람이 속는다.
      # 실제 방어는 api-deployment.yaml 에서 replicas 필드를 **없앤 것**이다.
  # diff 노이즈 제거용으로만 남긴다. api는 Git에 replicas가 없으므로 클러스터의 실제 값
  # (HPA가 정한 수)이 항상 "추가된 필드"로 잡히는데, 그걸 OutOfSync로 띄우지 않기 위해서다.
  # **이것만으로 sync를 막지는 못한다**(위 참조) — 방어는 매니페스트에서 필드를 뺀 것이다.
  # 2026-08-11: web에도 HPA가 붙었다(첫 실패 지점이 web 티어였다 — AS-IS 실측).
  # 이제 두 Deployment 모두 replicas의 소유자가 HPA이므로 name으로 좁히지 않는다.
  # 새 Deployment를 추가하면서 HPA를 안 붙이면 이 규칙이 그것까지 덮어버리는 점은 유의해야 하나,
  # 하네스 규칙 ⑧이 "HPA 대상 Deployment에 replicas 금지"를 강제하므로 반대 방향은 막혀 있다.
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas
