# web은 api보다 낮은 우선순위(ADR-025 보충). 클러스터 범위 리소스다(kustomize가 namespace를 붙이지 않는다).
#
# 왜: api 요청이 1100m라 api 하나가 노드 하나를 차지한다. 평상시 web만 올라 있는 노드(기타 요청 + web 300m)에는 api가 들어가지 못하고,
# 노드 그룹이 상한(측정 프로파일 9)에 닿으면 CA도 노드를 더 붙이지 못해 사전 확장(HPA 하한 9)이 api 8개에서 멈췄다
# (측정 세션 20261007-platform pf-warm — 관찰: api 9번째 Pending, CA "max size reached").
# web을 낮은 우선순위로 두면 Pending인 api(기본 우선순위 0)가 web 파드를 밀어내고, 밀려난 web은 새 api 노드의 남는 자리(약 650m — 계산)로 옮긴다.
# api를 높이지 않고 web을 낮춘 이유: api를 높이면 같은 기본 우선순위(0)인 Kafka·Prometheus·ArgoCD 파드까지 밀어낼 수 있다.
# 대가: 다른 기본 우선순위 파드가 Pending이어도 web이 밀려날 수 있다 — web PDB(minAvailable 1)로 한꺼번에 비는 것을 줄인다(선점은 PDB를 최대한 지킨다).
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: flowticket-web-low
value: -10
globalDefault: false
preemptionPolicy: Never # web 자신은 다른 파드를 밀어내지 않는다
description: "flowticket web — api(기본 0)가 노드 자리가 없을 때 밀어낼 수 있게 낮춘다(ADR-025 보충)"
