# kube-prometheus-stack 88.2.0 — 포트폴리오 데모용 최소 구성.
#
#   helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
#   helm upgrade --install kube-prometheus-stack prometheus-community/kube-prometheus-stack \
#     -n monitoring --create-namespace -f k8s/monitoring/kube-prometheus-stack.values.yaml

# 알림 수신처(Slack)를 붙이면서 켰다. 이전에는 "수신처가 없어 뜨기만 하고 하는 일이 없다"는
# 이유로 꺼 두었고, 그 결과 **DEAD 행·DLQ 적체·블랙리스트 fail-open이 모두 "누가 대시보드를
# 봐야 안다"로 끝났다**(TS-032 §7, ADR-008, ADR-016 §관측). 그 공백을 닫는다.
alertmanager:
  enabled: true
  alertmanagerSpec:
    # webhook URL을 파일로 마운트한다. values.yaml에 적으면 공개 저장소에 비밀이 박힌다.
    # Secret은 ExternalSecret이 SSM에서 만든다(k8s/external-secrets/externalsecret-alertmanager.yaml).
    #   마운트 경로: /etc/alertmanager/secrets/<시크릿 이름>/<키 이름>
    secrets: [flowticket-alert-slack]
    resources:
      requests: { cpu: 10m, memory: 64Mi }
      limits: { memory: 128Mi }
  config:
    global:
      # 해소 알림을 보내기까지 기다리는 시간. 스크랩 15초 기준 넉넉하다.
      resolve_timeout: 5m
    route:
      # 같은 알림·네임스페이스는 한 묶음으로 보낸다 — 장애 하나에 메시지 10개가 오지 않게.
      group_by: [alertname, namespace]
      group_wait: 30s      # 첫 알림 대기(연쇄를 한 번에 묶는다)
      group_interval: 5m   # 그룹에 새 알림이 붙었을 때 재발송 간격
      # ⚠️ 기본값 4h는 이 프로젝트에 맞지 않는다 — 데모 클러스터는 몇 시간만 떠 있어
      # 사실상 "한 번만 알림"이 되어 재알림 개념이 죽는다.
      repeat_interval: 1h
      receiver: slack
      routes:
        # Watchdog은 **항상 발화하는** 알림이다. 용도는 하나 — 알림이 안 오는 것이
        # "평화로워서"인지 "파이프라인이 죽어서"인지 구분하는 것(Dead Man's Switch).
        # 그래서 Slack으로 보내면 안 된다(계속 울린다).
        # ⚠️ 운영이라면 healthchecks.io / Dead Man's Snitch 같은 **외부** 감시로 보내야
        # 의미가 있다. 여기서 버리는 것은 그 감시를 붙이지 않았다는 뜻이고, 그만큼
        # "알림 파이프라인 자체의 죽음"은 여전히 감지되지 않는다.
        - matchers: ['alertname="Watchdog"']
          receiver: "null"
    inhibit_rules:
      # 같은 대상에 critical이 울리는 동안 warning을 겹쳐 보내지 않는다.
      - source_matchers: ['severity="critical"']
        target_matchers: ['severity="warning"']
        equal: [alertname, namespace]
    receivers:
      - name: "null"
      - name: slack
        slack_configs:
          - api_url_file: /etc/alertmanager/secrets/flowticket-alert-slack/webhook-url
            # webhook URL 하나 = 채널 하나다. 채널을 나누려면 webhook(=비밀)이 하나 더 필요하다.
            # 규칙이 6개뿐이라 지금은 한 채널로 받고, severity는 제목으로 구분한다.
            send_resolved: true
            title: '[{{ .Status | toUpper }}{{ if eq .Status "firing" }}:{{ .Alerts.Firing | len }}{{ end }}] {{ .CommonLabels.severity }} — {{ .CommonLabels.alertname }}'
            text: >-
              {{ range .Alerts }}*{{ .Annotations.summary }}*
              {{ .Annotations.description }}
              {{ if .Annotations.runbook_url }}<{{ .Annotations.runbook_url }}|runbook>{{ end }}
              {{ end }}

# EKS는 컨트롤플레인이 **관리형**이라 scheduler·controller-manager를 스크랩할 수 없다.
# 차트 기본값은 그것들이 자체 관리된다고 보고 규칙을 켜므로, 지표가 영영 없는 상태에서
# KubeSchedulerDown·KubeControllerManagerDown이 **상시 발화**한다.
#
# 2026-08-21 기동에서 실제로 우리 Slack 채널로 샜다. 오탐이 섞이면 알림 전체가 무시되므로
# ("또 그거네") 규칙 6개를 신중히 고른 의미가 사라진다.
#
# 스크랩(enabled)과 규칙(defaultRules)을 **둘 다** 꺼야 한다 — 앞의 것만 끄면 타깃은 사라져도
# 규칙은 남아 계속 울린다.
#
# ⚠️ kubeProxy·kubeEtcd는 건드리지 않는다. kube-proxy는 노드 DaemonSet이라 스크랩되고,
# etcd 규칙은 지표가 없어 inactive로 남는다(실측 확인). 지금 새는 것만 막는다.
kubeScheduler:
  enabled: false
kubeControllerManager:
  enabled: false
defaultRules:
  rules:
    kubeSchedulerAlerting: false
    kubeSchedulerRecording: false
    kubeControllerManager: false

grafana:
  # 데모 클러스터는 수시로 내렸다 올린다. 대시보드는 차트가 기본 제공하는 것을 쓰고,
  # PVC를 잡지 않아 재설치 비용을 0으로 둔다(직접 만든 대시보드는 여기 남지 않는다).
  persistence: { enabled: false }
  # 인터넷에 노출하지 않는다 — 접속은 kubectl port-forward로 한다.
  service: { type: ClusterIP }

prometheus:
  prometheusSpec:
    # 데모라 장기 보존이 필요 없다. 실측 창(부하 → 스케일업 → 회복)은 분 단위다.
    retention: 6h
    storageSpec:
      volumeClaimTemplate:
        spec:
          # ⚠️ EKS에는 **기본 StorageClass가 없다**(gp2는 존재하지만 is-default-class가 아니다).
          # 생략하면 PVC가 Pending으로 멈추고 Prometheus Pod가 영영 안 뜬다(TS-019에서 겪음).
          storageClassName: gp2
          accessModes: ["ReadWriteOnce"]
          resources: { requests: { storage: 20Gi } }
    # 차트가 심은 release 라벨이 없는 ServiceMonitor도 잡게 한다.
    # 기본값이면 selector가 `release: kube-prometheus-stack`으로 좁혀져
    # k8s/monitoring/servicemonitor-api.yaml이 **조용히 무시된다**.
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    # PrometheusRule도 같은 이유로 넓힌다. 규칙 파일에 release 라벨을 달아 두었지만,
    # helm release 이름을 다르게 설치하면 셀렉터가 어긋나 **규칙이 조용히 로드되지 않는다**
    # — 실패가 오류가 아니라 "알림이 안 옴"으로 나타나 알아채기 어렵다.
    ruleSelectorNilUsesHelmValues: false
    # k6가 부하 결과를 직접 밀어 넣을 수 있게 remote write 수신을 연다.
    #   k6 run -o experimental-prometheus-rw ...
    #
    # 왜 필요한가: 부하 시험에서 **클라이언트 지표와 서버 지표를 같은 시간축에서** 봐야 한다.
    # 2026-08-11 측정에서 k6가 본 p95는 2,769ms인데 앱 히스토그램은 27ms였다(100배 차이).
    # 둘을 따로 뽑아 손으로 대조하느라 원인 규명이 늦었다 — 실제 병목은 앱이 아니라
    # web 티어였고 ALB 지표를 역추적해서야 갈렸다.
    #
    # 이걸 켜면 k6의 RPS·p95·실패율이 파드 CPU·HPA 파드 수·DB 커넥션과 한 대시보드에 뜬다.
    enableRemoteWriteReceiver: true
    resources:
      requests: { cpu: 200m, memory: 1Gi }
      limits: { memory: 2Gi }
