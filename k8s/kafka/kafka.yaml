# Strimzi Kafka: 멀티브로커(ADR-008). KRaft 모드라 ZooKeeper가 없다.
#
# 앱의 KAFKA_BOOTSTRAP_SERVERS가 `flowticket-kafka-bootstrap.kafka.svc:9092`를 가리키므로
# 클러스터 이름은 flowticket, 네임스페이스는 kafka여야 한다. 이름이 어긋나면 DNS가 안 풀리고
# api Pod가 기동 자체에 실패한다(TS-016: readiness 제외와는 다른 문제였다).
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaNodePool
metadata:
  name: dual-role
  namespace: kafka
  labels:
    strimzi.io/cluster: flowticket
spec:
  # 데모 규모라 controller/broker를 겸한다. 운영에서는 분리하는 편이 낫지만
  # 노드가 3대뿐이라 역할을 나누면 브로커가 부족해진다.
  roles:
    - controller
    - broker
  replicas: 3
  storage:
    type: persistent-claim
    size: 10Gi
    # 이름을 반드시 명시한다. 이 클러스터에는 기본 StorageClass가 없어서
    # (`kubectl get storageclass` → gp2, DEFAULT=none) 생략하면 PVC가 Pending에 머물고
    # 브로커가 뜨지 않는다. gp2는 저장소가 만드는 것이 아니라 EKS가 기본 제공하는 것이므로,
    # 클러스터를 새로 만들 때마다 실제 이름을 확인해야 한다(gp3인 환경도 흔하다).
    class: gp2
    deleteClaim: true # 데모는 매번 새로 만든다. false면 destroy 후 EBS가 남아 요금이 붙는다.
  # 브로커 Pod를 AZ마다 하나씩 둔다(ADR-012 §6). 아래 Kafka의 rack(broker.rack)은 파티션 복제본을 AZ에 걸쳐 놓게 할 뿐
  # 브로커 Pod 배치는 정하지 않는다 — Strimzi 1.2.0은 rack 설정 시 zone 라벨이 있는 노드로 제한하는 node affinity만 붙이고
  # AZ 분산 규칙은 붙이지 않는다. 둘 다 있어야 "AZ 하나가 죽어도 브로커 2대·복제본 2개가 남는다"가 성립한다.
  #
  # DoNotSchedule: 분산을 못 지키면 그 브로커를 띄우지 않는다(Pending). 노드그룹이 AZ별이라 CA가 그 AZ에 노드를 붙인다(ADR-012 §3 — 이 제약에서의 CA 동작은 미검증).
  # ScheduleAnyway면 한 AZ에 두 대가 몰려도 뜨고, 그 AZ가 죽으면 ISR이 1로 떨어져 acks=all 발행이 멈춘다.
  # ⚠️ 이미 돌고 있는 클러스터에 처음 넣을 때: 브로커 PVC(EBS)는 AZ에 묶여 있어, 지금 배치가 고르지 않으면 롤링으로
  # 다시 뜨는 브로커가 제약과 자기 볼륨의 AZ를 동시에 만족하지 못해 Pending에 걸린다. 그때는 해당 브로커 PVC를 지우고
  # 복제로 다시 채우는 절차가 필요하다. 이 데모는 기동마다 새로 만든다(deleteClaim: true).
  # 볼륨이 Pod가 놓인 AZ에 생기려면 StorageClass가 WaitForFirstConsumer여야 한다. EKS 기본 gp2의 실제 바인딩 모드는
  # 확인하지 않았다 — Immediate라면 PVC가 먼저 임의 AZ에 생겨 이 제약과 충돌할 수 있다(기동 때 `kubectl get sc gp2` 확인).
  template:
    pod:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              strimzi.io/cluster: flowticket
              strimzi.io/pool-name: dual-role
---
apiVersion: kafka.strimzi.io/v1
kind: Kafka
metadata:
  name: flowticket
  namespace: kafka
  annotations:
    strimzi.io/node-pools: enabled
    strimzi.io/kraft: enabled
spec:
  kafka:
    version: 4.3.0
    # 노드의 zone 라벨을 broker.rack으로 넣는다 → 토픽 생성 시 파티션 복제본을 서로 다른 AZ에 둔다(RF 3 = AZ 3).
    # 초기화 컨테이너가 노드 라벨을 읽으며, 필요한 권한(strimzi-kafka-broker ClusterRole 위임)은 Strimzi helm 차트가 설치한다.
    # Pod 배치는 위 KafkaNodePool의 topologySpreadConstraints가 맡는다(역할이 다르다 — ADR-012 §6).
    rack:
      type: topology-label
      topologyKey: topology.kubernetes.io/zone
    listeners:
      - name: plain
        port: 9092
        type: internal
        tls: false
    config:
      # 브로커 3대이므로 RF 3 / min.insync 2. 아웃박스 릴레이는 acks=all로 발행한다(ADR-010).
      #
      # 내결함성은 정확히 1대다:
      #   3대 정상 → ISR 3 → 쓰기 가능
      #   1대 장애 → ISR 2 → min.insync=2 충족 → 쓰기 가능
      #   2대 장애 → ISR 1 → min.insync 미충족 → acks=all 발행 실패
      # 2대가 죽어도 데이터 복제본은 남아 읽기는 되지만 새 쓰기가 막힌다.
      # (그래도 아웃박스가 있어 유실은 아니다. PENDING으로 쌓였다가 복구 시 재시도된다.)
      default.replication.factor: 3
      min.insync.replicas: 2
      offsets.topic.replication.factor: 3
      transaction.state.log.replication.factor: 3
      transaction.state.log.min.isr: 2
      # 앱이 토픽을 자동 생성한다(KAFKA_TOPIC_PARTITIONS/REPLICAS로 파티션·RF 지정).
      auto.create.topics.enable: "true"
    # 브로커 JMX를 Prometheus 형식으로 노출한다(포트 9404, 이름 tcp-prometheus).
    # 규칙은 kafka-metrics-configmap.yaml: 노출 범위를 좁힌 이유를 거기에 적었다.
    #
    # 브로커 페일오버 시 쓰기가 계속되는지(IMP-016) 보려면 UnderMinIsr·ISR 변동이 필요하다.
    metricsConfig:
      type: jmxPrometheusExporter
      valueFrom:
        configMapKeyRef:
          name: kafka-metrics
          key: kafka-metrics-config.yml
  entityOperator:
    topicOperator: {}
    userOperator: {}
  # Consumer Lag은 브로커 JMX에 없다. 컨슈머 그룹의 커밋 오프셋과 로그 끝 오프셋의 차이라
  # 별도 수집기가 필요하다. Kafka Exporter가 그걸 `kafka_consumergroup_lag`으로 노출한다.
  #
  # 이게 없으면 "아웃박스 릴레이가 밀렸는지"를 볼 수 없다. 처리량(BytesIn)은
  # 발행 쪽만 말해주고, 소비가 따라오는지는 lag으로만 판단된다.
  kafkaExporter:
    # 관심 대상만 본다. 정규식이 넓으면 __consumer_offsets 같은 내부 토픽까지 시리즈가 붙는다.
    topicRegex: "order-events.*"
    groupRegex: ".*"
    resources:
      requests: { cpu: 20m, memory: 64Mi }
      limits: { memory: 128Mi }
