# 실제 값을 채워 k8s/overlays/demo-local/ 로 복사해 쓴다(그 디렉터리는 .gitignore 대상).
#
# 값 출처:
#   terraform -chdir=infra/terraform/platform/environments/demo output -raw db_endpoint
#   terraform ... output -raw redis_endpoint
#   terraform ... output -raw certificate_arn
#   aws sts get-caller-identity --query Account --output text   → ECR 레지스트리 앞부분
#   이미지 태그 = ECR에 실제로 올라간 커밋 SHA(전체 40자)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: flowticket

resources:
  - ../../base

# ── 이미지: base의 placeholder를 실제 레지스트리·태그로 ──────────────
images:
  - name: flowticket-api
    newName: 891612580915.dkr.ecr.ap-northeast-2.amazonaws.com/flowticket-api
    newTag: 2cf8a6da69f150ec8d4154f857c9cf1318da40b7
  - name: flowticket-web
    newName: 891612580915.dkr.ecr.ap-northeast-2.amazonaws.com/flowticket-web
    newTag: 2cf8a6da69f150ec8d4154f857c9cf1318da40b7

# ── ConfigMap: 데이터 엔드포인트 ──────────────────────────────────
# DB_HOST에는 **포트를 붙이지 않는다** — 모듈이 aws_db_instance.address(호스트만)를 반환하고
# DB_PORT는 따로 있다. host:5432를 넣으면 주소가 host:5432:5432가 된다.
patches:
  - target: { kind: ConfigMap, name: flowticket-api-config }
    patch: |
      - op: replace
        path: /data/DB_HOST
        value: flowticket.chom4k282bmy.ap-northeast-2.rds.amazonaws.com
      - op: replace
        path: /data/REDIS_HOST
        value: master.flowticket-redis.nazwah.apn2.cache.amazonaws.com
  - target: { kind: Ingress, name: flowticket }
    patch: |
      - op: replace
        path: /metadata/annotations/alb.ingress.kubernetes.io~1certificate-arn
        value: arn:aws:acm:ap-northeast-2:891612580915:certificate/5b774cb4-6765-4f35-8b13-c6500ff0ddb9
