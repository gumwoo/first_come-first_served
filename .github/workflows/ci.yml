name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 같은 브랜치에 새 커밋이 오면 이전 CI는 의미가 없다. 즉시 취소해 러너 시간을 아낀다.
# 리뷰 → 수정 → push 루프에서 낭비가 컸다.
#
# image.yml은 일부러 다르게 잡는다(cancel-in-progress: false). 배포는 중간에 죽이면
# 이미지는 올라갔는데 태그 커밋은 안 된 상태가 남는다. 상세: TS-029
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: 변경 영역 판별
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      e2e: ${{ steps.filter.outputs.e2e }}
    steps:
      - uses: actions/checkout@v4
      # 문서만 고친 PR에 백엔드 9분·E2E 4분을 돌리는 건 낭비다. 무엇이 바뀌었는지 먼저 판별한다.
      # 계약(contracts)·하네스는 코드가 안 바뀌어도 검증을 깨뜨릴 수 있으므로 넓게 잡는다.
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'apps/api/**'
              - 'contracts/**'
              - 'harness/**'
              - 'k8s/**'
              - '.github/workflows/ci.yml'
            frontend:
              - 'apps/web/**'
              - 'contracts/**'
              - 'harness/**'
              - '.github/workflows/ci.yml'
            e2e:
              - 'apps/api/**'
              - 'apps/web/**'
              - 'e2e/**'
              - 'contracts/**'
              - '.github/workflows/ci.yml'

  harness-meta:
    name: 하네스 메타테스트 (위반 fixture 차단 확인)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # lockfile 실패에 fallback(`|| npm install`)을 두지 않는다.
      # lockfile이 package.json과 어긋나면 fallback이 다른 의존성 트리로 초록불을 만들어,
      # 로컬과 CI가 서로 다른 트리를 검증하게 된다(TS-027).
      - name: install harness deps
        working-directory: harness
        run: npm ci
      - name: contract schema check (계약 형식 검증)
        working-directory: harness
        run: node schema-check.mjs
      - name: meta test (false-negative guard)
        working-directory: harness
        run: node meta-test.mjs
      # 문서 드리프트 검사는 이 잡에 둔다(backend/frontend가 아니라).
      # 이 규칙이 필요한 순간이 바로 "문서만 고친 PR"인데, 그런 PR은 변경 영역 필터에 걸려
      # backend·frontend가 전부 skip된다. 거기 두면 정작 필요할 때 돌지 않는다.
      # harness-meta는 needs·if 없이 항상 실행되고, 이 검사는 1초 미만이라 비용도 없다.
      - name: docs harness check (문서 ↔ 현재 상태 드리프트)
        working-directory: harness
        run: node docs/check.mjs
      # 부하 발생기 쪽 계약 테스트. 앱 쪽(LoadgenTokenContractTest)은 백엔드 잡이 돌린다.
      # 둘 중 한쪽만 돌면 발급기가 바뀌어도 계약 깨짐을 놓친다. 의존성이 없는 node 내장 테스트라 이 잡에 둔다.
      - name: loadgen contract test (부하 시험 토큰 발급기)
        run: node --test infra/loadgen/mint-tokens.test.mjs
      # 분산 발생기: run-entry.sh 몫 계산(--gens)·entry-arrivals 고정 창(--t0)·시작 어긋남.
      - name: loadgen distributed start test (몫 계산·고정 창)
        run: node --test infra/loadgen/distributed-start.test.mjs
      # 대기자 폴링 발생기(프론트와 같은 간격 규칙·토큰 참조·mock 상대 동작)와 입장 인지 지연 집계.
      - name: loadgen poll-hold test (대기자 폴링 발생기·입장 인지 지연)
        run: node --test infra/loadgen/poll-hold.test.mjs scripts/loadtest/admit-latency.test.mjs
      # Downstream E2E(입장자) 시험 판정 — 역할별 클라이언트 기대값과 DB 기대값 SQL 생성(fixture는 mock 서버 상대 실행 결과).
      - name: loadtest booking e2e test (E2E 입장자 시험 판정)
        run: node --test scripts/loadtest/booking-expect.test.mjs
      # 실효 입장 초과 판정식(loadtest-100k-plan §3.3)의 단위 테스트. 의존성 없는 node 내장 테스트.
      - name: loadtest correctness test (실효 입장 초과 재구성)
        run: node --test scripts/loadtest/admission-overlap.test.mjs
      # RDS·ElastiCache CloudWatch 내보내기(loadtest-100k-plan §5.3)의 질의 구성·결과 요약 테스트.
      - name: loadtest cloudwatch export test (질의 구성)
        run: node --test scripts/loadtest/export-cloudwatch.test.mjs
      # 사후 검사의 로그 범위 확인(pod-coverage) — run 구간과 겹친 파드만 대상, run 구간의 재시작만.
      - name: loadtest pod-coverage test (run 구간 대상 판정)
        run: node --test scripts/loadtest/pod-coverage.test.mjs
      # run 동안 api 파드 로그를 받아 두는 수집기(HPA 축소로 지워질 파드의 감사 줄 보존 — Platform 축 run). 가짜 kubectl로 생성·삭제·끊김을 흉내 낸다.
      - name: loadtest api log collector test (축소 파드 감사 로그 보존)
        run: node --test scripts/loadtest/collect-api-logs.test.mjs

  backend:
    name: 백엔드 (하네스 → 테스트)
    runs-on: ubuntu-latest
    needs: [changes, harness-meta]
    # 변경 영역에 해당할 때만 실행: main push도 예외가 아니다.
    # squash merge라 main의 diff는 PR의 diff와 같아, push에서 전체를 다시 돌리면 같은 검증을
    # 두 번 하게 된다. 머지 스큐는 사후 전체 실행이 아니라 브랜치 보호의 "up to date 요구"로 막는다.
    if: needs.changes.outputs.backend == 'true'
    steps:
      - uses: actions/checkout@v4
      # gradle-wrapper.jar는 저장소에 커밋되는 바이너리다. 리뷰어가 내용을 읽고 검증할 수
      # 없으므로, Gradle이 공식 배포한 jar의 체크섬과 대조해 CI가 대신 판정한다.
      # (바꿔치기된 wrapper jar는 알려진 공급망 공격 경로다.)
      - uses: gradle/actions/wrapper-validation@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: harness deps
        working-directory: harness
        run: npm ci
      - name: backend harness check
        run: node harness/backend/check.mjs
      # 알림 규칙 검증. 규칙이 실제로 발화하는지 확인한다.
      # promtool은 PrometheusRule(CR)을 모르므로 규칙 본문만 떼어 평문 규칙 파일로 변환한 뒤 넣는다.
      # 러너에 Docker가 있으므로 promtool을 따로 설치하지 않는다(버전 고정).
      # 이미지 ENTRYPOINT는 prometheus라 --entrypoint로 promtool을 직접 지목해야 한다.
      #
      # 라우팅도 함께 검증한다. 라우트를 잘못 쓰면 알림이 엉뚱한 리시버로 가거나 아무 데도
      # 안 간다. amtool은 webhook 없이 라우팅을 판정하므로 비밀 없이 CI에서 돌릴 수 있다.
      - name: alert rules + routing (promtool / amtool)
        run: |
          node harness/alerts/extract-rules.mjs             k8s/monitoring/prometheusrule-flowticket.yaml build/alerts/rules.yml
          cp harness/alerts/rule-tests.yml build/alerts/
          docker run --rm --entrypoint /bin/promtool -v "$PWD/build/alerts:/w" -w /w prom/prometheus:v2.53.0 check rules rules.yml
          docker run --rm --entrypoint /bin/promtool -v "$PWD/build/alerts:/w" -w /w prom/prometheus:v2.53.0 test rules rule-tests.yml
          node harness/alerts/extract-alertmanager.mjs k8s/monitoring/kube-prometheus-stack.values.yaml build/alerts/alertmanager.yml
          bash harness/alerts/check-alertmanager.sh build/alerts
      # 매니페스트가 앱 코드와 어긋나는지: apply 전에는 무증상이라 여기서만 잡을 수 있다.
      - name: k8s harness check
        run: node harness/k8s/check.mjs
      - name: gradle build (test 포함)
        working-directory: apps/api
        run: gradle build --no-daemon

      # 실패 리포트를 남긴다. 콘솔에 FULL 출력을 켰어도(build.gradle.kts) 긴 진단 메시지는
      # 로그에서 찾기 어렵고, 간헐적 실패는 러너가 사라지면 다시 볼 방법이 없다.
      # JUnit XML은 성공해도 남긴다. 클래스·메서드별 소요 시간이 여기에만 있고,
      # 그게 없으면 "CI가 왜 느린가"를 추측으로만 말하게 된다.
      #
      # XML의 testcase 시간 합은 `:test` wall-clock과 같지 않다. Spring 컨텍스트 초기화·
      # 컨테이너 기동·워커 오버헤드는 개별 testcase에 귀속되지 않아 미귀속 시간으로 남는다.
      # 두 숫자의 차이가 곧 "테스트 코드 밖에서 쓰는 시간"이라 그 자체가 판단 근거다.
      #
      # HTML 리포트는 용량이 커서 실패 시에만 올린다. 진단용이고 시간 분석엔 XML이면 된다.
      - name: upload backend test results (timing)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: apps/api/build/test-results/
          retention-days: 14

      - name: upload backend test reports (html, 실패 시)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: apps/api/build/reports/tests/
          retention-days: 14

  frontend:
    name: 프론트 (하네스 → lint → build)
    runs-on: ubuntu-latest
    needs: [changes, harness-meta]
    # 변경 영역에 해당할 때만 실행(backend 잡의 주석 참고: push도 동일하게 필터한다).
    if: needs.changes.outputs.frontend == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - name: harness deps
        working-directory: harness
        run: npm ci
      - name: frontend harness check
        run: node harness/frontend/check.mjs
      - name: install
        working-directory: apps/web
        run: pnpm install --frozen-lockfile
      - name: typecheck
        working-directory: apps/web
        run: pnpm typecheck
      - name: lint
        working-directory: apps/web
        run: pnpm lint
      # 단위 테스트는 build 앞에 둔다. 실패 시 더 빨리 알고, 느린 build를 낭비하지 않는다.
      # E2E와 역할이 다르다: E2E는 브라우저 전체 흐름을, 이쪽은 타이밍 로직(폴링 재예약 등)을 본다.
      - name: unit test
        working-directory: apps/web
        run: pnpm test
      - name: build
        working-directory: apps/web
        run: pnpm build

  e2e:
    name: E2E (Playwright, 풀스택)
    runs-on: ubuntu-latest
    needs: [changes, harness-meta]
    # 변경 영역에 해당할 때만 실행(backend 잡의 주석 참고: push도 동일하게 필터한다).
    if: needs.changes.outputs.e2e == 'true'
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: flowticket
          POSTGRES_USER: flowticket
          POSTGRES_PASSWORD: flowticket
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U flowticket"
          --health-interval 5s --health-timeout 5s --health-retries 12
      redis:
        image: redis:7.4 # ZPOPMIN(5.0+) 필수: 대기열 승격 Lua (TS-002)
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DB_PORT: "5432"
      DB_PASSWORD: flowticket
      JWT_SECRET: ci-e2e-secret-0123456789-0123456789-0123456789
      # 관리자 부트스트랩(admin E2E). CI 전용 합성 픽스처: 실 비밀 아님.
      ADMIN_EMAIL: admin-e2e@flowticket.local
      ADMIN_PASSWORD: e2e-admin-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - uses: pnpm/action-setup@v4
        with:
          version: 9

      # 1) 백엔드 빌드 → 백그라운드 기동 → health 대기(Flyway 마이그레이션 완료)
      - name: build backend jar
        working-directory: apps/api
        run: gradle bootJar --no-daemon -x test
      - name: run backend
        run: |
          JAR=$(ls apps/api/build/libs/*.jar | grep -v -- '-plain' | head -1)
          echo "starting $JAR"
          nohup java -jar "$JAR" > backend.log 2>&1 &
      - name: wait for backend
        run: |
          for i in $(seq 1 60); do
            # /readyz: 관리 포트를 따로 주지 않은(같은 포트) 구성에서도 probe 추가 경로가 메인 포트에 있는지 함께 확인한다(TS-041).
            curl -sf http://localhost:8080/actuator/health && curl -sf http://localhost:8080/readyz && { echo "backend up"; exit 0; }
            sleep 3
          done
          echo "::error::backend failed to start"; tail -120 backend.log; exit 1

      # 2) E2E 테스트 데이터 시드(판매중 이벤트 + 좌석)
      - name: seed e2e data
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client
          PGPASSWORD=flowticket psql -h localhost -U flowticket -d flowticket -f e2e/ci/seed.sql

      # 3) 프론트 빌드 → 백그라운드 기동 → 대기
      - name: build & run web
        working-directory: apps/web
        # 대기열은 폴링이 주 경로라(ADR-023 §2) E2E도 운영과 같은 폴링 간격으로 빌드한다.
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          nohup pnpm start > ../../web.log 2>&1 &
      - name: wait for web
        run: |
          for i in $(seq 1 40); do
            curl -sf http://localhost:3000 > /dev/null && { echo "web up"; exit 0; }
            sleep 3
          done
          echo "::error::web failed to start"; tail -120 web.log; exit 1

      # 4) Playwright 실행(풀스택 대상)
      - name: install e2e deps
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: run e2e
        working-directory: e2e
        env:
          E2E_BASE_URL: http://localhost:3000
        run: npx playwright test

      # 5) 실패 시 trace(CCTV) 아티팩트 업로드: 에이전트 디버깅용
      - name: upload playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            e2e/test-results/
            e2e/playwright-report/
            backend.log
            web.log
          retention-days: 7
