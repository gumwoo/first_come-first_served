# kube-prometheus-stack 88.2.0 — 포트폴리오 데모용 최소 구성.
#
#   helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
#   helm upgrade --install kube-prometheus-stack prometheus-community/kube-prometheus-stack \
#     -n monitoring --create-namespace -f k8s/monitoring/kube-prometheus-stack.values.yaml

# 알림 수신처가 없어 Alertmanager는 뜨기만 하고 하는 일이 없다 — 노드 자원만 먹어서 끈다.
alertmanager:
  enabled: false

grafana:
  # 데모 클러스터는 수시로 내렸다 올린다. 대시보드는 차트가 기본 제공하는 것을 쓰고,
  # PVC를 잡지 않아 재설치 비용을 0으로 둔다(직접 만든 대시보드는 여기 남지 않는다).
  persistence: { enabled: false }
  # 인터넷에 노출하지 않는다 — 접속은 kubectl port-forward로 한다.
  service: { type: ClusterIP }

prometheus:
  prometheusSpec:
    # 데모라 장기 보존이 필요 없다. 실측 창(부하 → 스케일업 → 회복)은 분 단위다.
    retention: 6h
    storageSpec:
      volumeClaimTemplate:
        spec:
          # ⚠️ EKS에는 **기본 StorageClass가 없다**(gp2는 존재하지만 is-default-class가 아니다).
          # 생략하면 PVC가 Pending으로 멈추고 Prometheus Pod가 영영 안 뜬다(TS-019에서 겪음).
          storageClassName: gp2
          accessModes: ["ReadWriteOnce"]
          resources: { requests: { storage: 20Gi } }
    # 차트가 심은 release 라벨이 없는 ServiceMonitor도 잡게 한다.
    # 기본값이면 selector가 `release: kube-prometheus-stack`으로 좁혀져
    # k8s/monitoring/servicemonitor-api.yaml이 **조용히 무시된다**.
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    resources:
      requests: { cpu: 200m, memory: 1Gi }
      limits: { memory: 2Gi }
