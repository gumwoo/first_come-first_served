# 비밀이 아닌 설정만 둔다. 시크릿(JWT_SECRET·DB_PASSWORD·OAuth 키 등)은 여기 절대 넣지 않는다
# — Secret 참조로만 주입한다(secret.md 참고).
apiVersion: v1
kind: ConfigMap
metadata:
  name: flowticket-api-config
  namespace: flowticket
data:
  # ── 데이터 연결 ────────────────────────────────────────────────
  # 호스트는 terraform output(db_endpoint·redis_endpoint)에서 채운다.
  DB_HOST: "REPLACE_DB_HOST"
  DB_PORT: "5432"
  DB_NAME: "flowticket"
  REDIS_HOST: "REPLACE_REDIS_HOST"
  REDIS_PORT: "6379"

  # ⚠️ ElastiCache를 transit_encryption_enabled = true로 만들었다(PR #174).
  # 이 값이 없거나 false면 Redis 연결이 전부 실패하고, readiness에 redis가 있어
  # Pod가 영원히 Ready가 되지 않는다. C-7 체크리스트 2번이 바로 이 줄이다.
  REDIS_SSL_ENABLED: "true"

  # ── Kafka(Strimzi, in-cluster) ────────────────────────────────
  KAFKA_BOOTSTRAP_SERVERS: "flowticket-kafka-bootstrap.kafka.svc:9092"
  KAFKA_TOPIC_PARTITIONS: "6"
  KAFKA_TOPIC_REPLICAS: "3"

  # ── 종료 유예 ─────────────────────────────────────────────────
  # 애플리케이션이 진행 중 요청을 마칠 시간. terminationGracePeriodSeconds보다 작아야
  # 한다 — 크면 앱이 끝나기 전에 SIGKILL이 온다(무중단 배포가 깨지는 흔한 지점).
  SHUTDOWN_TIMEOUT: "30s"

  # ── 좌석맵 캐시 (⚠️ 실험 스위치) ───────────────────────────────
  # 0단계 실측에서 /events/{id}/seats가 API CPU 비용의 약 57%를 차지해 캐시 후보 1순위였다
  # (benchmarks/cache-experiment/). 개선 상한을 실제로 재기 위해 켠다.
  #
  # ⚠️ 성능 실험용이지 운영 최종 설계가 아니다. 좌석은 재고성 상태라 TTL 동안 이미 선점된
  # 좌석이 AVAILABLE로 보인다 — 최종 선점은 조건부 UPDATE가 막지만(ADR-003) 사용자가 고른 뒤
  # 거절당하는 충돌은 늘어난다. 운영으로 가려면 seat.held/released/expired 기반 무효화가 필요하고,
  # 그 판단은 이 실험의 개선폭을 보고 한다.
  #
  # 측정이 끝나면 **0으로 되돌리거나 이 줄을 지운다.**
  SEAT_MAP_CACHE_TTL_MS: "2000"

  # ── 운영 값 ───────────────────────────────────────────────────
  COOKIE_SECURE: "true"
  PAYMENT_GATEWAY: "toss"

  # 소셜 로그인 성공/실패 후 브라우저가 돌아갈 곳. 기본값이 http://localhost:3000이라
  # 주입하지 않으면 **인증에 성공하고도 localhost로 보내진다**(배포에서만 드러난다).
  OAUTH_SUCCESS_REDIRECT: "https://flow-ticket.com"
  OAUTH_FAILURE_REDIRECT: "https://flow-ticket.com/login?error=oauth"
