# web은 api보다 낮은 우선순위(ADR-025 보충). 클러스터 범위 리소스다(kustomize가 namespace를 붙이지 않는다).
# api 하나가 노드 하나를 차지해(requests 1100m) web이 올라 있는 노드에는 api가 못 들어가고, 노드 그룹이 상한이면 사전 확장이
# 멈춘다. web을 낮추면 Pending인 api(기본 우선순위 0)가 web을 밀어내고, 밀려난 web은 다른 노드의 남는 자리로 옮긴다.
# api를 높이지 않고 web을 낮춘 이유: api를 높이면 같은 기본 우선순위(0)인 Prometheus·ArgoCD 파드까지 밀어낼 수 있다.
# 대가: 다른 기본 우선순위 파드(예: k6 Job)가 Pending이어도 web이 밀려날 수 있다 — web PDB(minAvailable 1)로 줄인다(보장은 아님).
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: flowticket-web-low
  annotations:
    # ArgoCD는 PriorityClass를 Deployment보다 뒤에 적용한다 — 먼저 만들어 web 파드 생성이 잠깐 실패하지 않게.
    argocd.argoproj.io/sync-wave: "-1"
# -1: 0(기본)보다 낮으면 충분하다. CA의 expendable 기준(--expendable-pods-priority-cutoff 기본 -10)보다 높게 둔다.
value: -1
globalDefault: false
preemptionPolicy: Never # web 자신은 다른 파드를 밀어내지 않는다
description: "flowticket web — api(기본 0)가 들어갈 자리가 없을 때 밀어낼 수 있게 낮춘다(ADR-025 보충)"
