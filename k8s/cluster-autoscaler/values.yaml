# Cluster Autoscaler helm values(ADR-012 §4, 측정은 IMP-021).
#
# Terraform 쪽 전제: IRSA 역할·autoscaling 정책, ASG 태그(k8s.io/cluster-autoscaler/{enabled,owned}),
# 노드그룹의 `ignore_changes = [scaling_config[0].desired_size]`.

# ASG 태그로 노드그룹을 스스로 찾는다. 노드그룹 이름을 여기 박으면 AZ가 늘 때마다 고쳐야 한다.
autoDiscovery:
  # clusterName은 bring-up.sh가 --set으로 넘긴다(Terraform의 cluster_name과 일치해야 한다).
  clusterName: ""

awsRegion: ap-northeast-2

rbac:
  serviceAccount:
    create: true
    # 이 이름은 IRSA 신뢰 정책과 정확히 일치해야 한다
    # (modules/eks/irsa.tf: system:serviceaccount:kube-system:cluster-autoscaler).
    # 어긋나면 권한 오류가 아니라 "CA가 아무 노드도 못 붙이는" 형태로 나타난다.
    name: cluster-autoscaler
    # 역할 ARN은 bring-up.sh가 terraform output에서 읽어 --set으로 넣는다.

extraArgs:
  # AZ별로 노드그룹이 나뉘어 있으므로(EBS의 AZ 종속 때문), 비슷한 그룹 간 균형을 맞춘다.
  # 없으면 한 AZ에만 노드가 몰려 3AZ 분산이라는 전제가 깨진다.
  balance-similar-node-groups: true
  # kube-system 파드가 있는 노드도 축소 대상으로 본다. 데모 클러스터라 노드 수가 적어
  # 이걸 끄면 사실상 축소가 일어나지 않는다.
  skip-nodes-with-system-pods: false
  # true면 emptyDir을 쓰는 파드(Prometheus·Alertmanager 등으로 추론, 확인 안 함)가 있는 노드의 축소가 막힌다.
  # 측정에서 축소가 안 일어나면 이 값을 먼저 의심한다.
  skip-nodes-with-local-storage: false
  # 기본값(10분)을 명시한다. 줄이면 "기본 동작"이 아닌 것을 재게 되므로 유지하고 기다린다.
  scale-down-unneeded-time: 10m

# CA 자신이 축출되면 스케일 판단이 끊긴다. 축소 대상에서 제외한다.
podAnnotations:
  cluster-autoscaler.kubernetes.io/safe-to-evict: "false"

resources:
  requests: { cpu: 100m, memory: 300Mi }
  limits: { memory: 500Mi }

# 이미지 태그는 고정하지 않고 차트 버전(bring-up.sh의 $CA_CHART_VERSION)이 고른 것을 쓴다.
# 클러스터 버전을 올리면 차트 버전을 사람이 올려야 한다. 어긋나면 bring-up.sh가 설치 전에
# CA 앱 버전과 k8s 마이너를 대조해 중단한다.
