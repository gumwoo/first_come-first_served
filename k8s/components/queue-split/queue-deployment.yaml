# 대기열 전용 Deployment(ADR-027) — 대기열 두 경로만 받는다(flowticket-api-queue Service).
# k8s/base/api-deployment.yaml과 같은 파드 사양이다(하네스 k8s 규칙 ⑩-b). 바꿀 때는 둘을 같이 바꾸고, 값의 이유는 그쪽 주석을 본다.
# 예외(⑩-b 허용 목록 — docs/deployment/resource-sizing-plan.md §3 P1·P3): 대기열만 DB_POOL_MAX·HEALTH_READINESS_INCLUDE env,
# requests.cpu, hostname topologySpread, api Pod 회피 anti-affinity term 하나(⑩-d)를 다르게 둘 수 있다. requests.cpu를 다르게 두면 대기열 파드만 고르는 hostname 분산
# (maxSkew 1·DoNotSchedule, selector에 app: flowticket-api-queue)이 함께 있어야 한다.
#
# 이 파일은 평시 모양이다(ADR-031): requests 200m, api 회피는 preferred. 공연 오픈 전에는 components/queue-peak가
# requests 1100m·api 회피 required로 바꾼다(사전 확장 PR, overlay event-prescale.yaml 머리말).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flowticket-api-queue
  namespace: flowticket
spec:
  # replicas를 두지 않는다. HPA(queue-hpa.yaml)가 소유한다(TS-022). 이 밖의 사양은 api-deployment.yaml과 같다(⑩-b).
  selector:
    matchLabels: { app: flowticket-api-queue }
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels: { app: flowticket-api-queue, flowticket.io/app: api }
    spec:
      terminationGracePeriodSeconds: 60

      # 평시에는 api Pod 노드를 가능하면 피한다(preferred). 평시 노드 3대에서는 api와 한 노드를 쓴다. 평시 부하(열린 대기열 없음)에서
      # 동거의 예매·조회 지연 차이는 30% 기준 안이었다(IMP-049 로컬).
      # 오픈 부하에서는 동거가 예매 p95를 41~87% 늘리고 대기열 Tomcat 스레드를 200으로 포화시켰다(IMP-038). 그래서 오픈 전에는
      # components/queue-peak가 이 term을 required로 바꾼다(IMP-047, ADR-031). 대기열에만 둔다(⑩-b 허용 목록, ⑩-d가 모양을 본다).
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels: { app: flowticket-api }
                topologyKey: kubernetes.io/hostname

      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app: flowticket-api-queue }
        # 대기열 Pod는 노드마다 하나. 평시 대기열 2개가 한 노드에 놓이면 그 노드를 비울 때 PDB(minAvailable 1)에 막혀
        # 오픈 뒤 평시 3대로 돌아오지 않았다(IMP-049 시뮬레이션 C-s). requests.cpu가 api와 다를 때의 짝 조건(⑩-b)이기도 하다.
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels: { app: flowticket-api-queue }

      containers:
        - name: api
          image: flowticket-api:REPLACE_TAG # kustomization.yaml의 images:가 덮어쓴다
          ports:
            - containerPort: 8080
              name: http
            - containerPort: 8081
              name: management
          env:
            - name: TZ
              value: UTC
            - name: MANAGEMENT_SERVER_PORT
              value: "8081"
            # 대기열만: 풀 축소(B′ P1 — resource-sizing-plan.md §2.1·§3, 근거: IMP-034). 대기열 경로는 DB를 거의 쓰지 않는다.
            # 이 값이 DB 커넥션 예산 (3+1)×5 + (6+1)×3 = 41 ≤ 56에 들어간다(하네스 backend 규칙 17이 이 파일에서 읽는다).
            # api Deployment에는 두지 않는다 — 규칙 17이 api 풀은 application.yml에서만 읽는다(⑩-b가 막는다).
            - name: DB_POOL_MAX
              value: "3"
            # 대기열만: 대기열 경로(진입·상태)는 Redis 없이 처리할 수 없어, readiness에 redis를 더해 Redis를 못 쓰는 Pod는
            # Service에서 빠지게 한다. 예매 api Pod는 넣지 않는다(application.yml 기본값, ADR-030). 하네스 k8s 규칙 ⑩-c가 이 값을 본다.
            - name: HEALTH_READINESS_INCLUDE
              value: "readinessState,db,redis"
          envFrom:
            - configMapRef: { name: flowticket-api-config }
            - secretRef: { name: flowticket-api-secrets } # 클러스터 밖에서 생성(k8s/README.md)

          # probe 경로는 application.yml의 health group과 한 쌍이다. readiness = readinessState, db, redis(위 HEALTH_READINESS_INCLUDE).
          # 나머지 probe 값의 이유는 api-deployment.yaml 주석.
          readinessProbe:
            httpGet: { path: /readyz, port: 8080 }
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /livez, port: 8080 }
            periodSeconds: 10
            failureThreshold: 12
          startupProbe:
            httpGet: { path: /livez, port: 8080 }
            periodSeconds: 5
            failureThreshold: 30 # 최대 150초

          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 25"]

          resources:
            # 평시 값. 평시에는 열린 대기열이 없어 대기열 CPU가 0.01코어였다(IMP-049 로컬). 오픈 전에는 components/queue-peak가
            # 1100m(ADR-025 진입 burst 산정)로 바꾼다. requests.cpu는 ⑩-b 허용 목록이다(위 hostname 분산이 짝).
            requests: { cpu: "200m", memory: "1536Mi" }
            limits: { memory: "2Gi" }

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false # JVM 임시 파일 필요
            capabilities: { drop: ["ALL"] }
