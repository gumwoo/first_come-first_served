apiVersion: apps/v1
kind: Deployment
metadata:
  name: flowticket-api
  namespace: flowticket
spec:
  # replicas를 두지 않는다. 이 Deployment는 HPA가 소유한다(api-hpa.yaml, min 3 / max 7).
  # 값을 두면 ArgoCD sync가 HPA가 정한 파드 수를 Git 값으로 덮어쓰고, RespectIgnoreDifferences로는
  # 막히지 않았다(TS-022). 하한은 HPA의 minReplicas가 담당한다.
  selector:
    matchLabels: { app: flowticket-api }
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # 무중단의 핵심 두 줄. maxUnavailable=0이라 새 Pod가 Ready가 된 뒤에만 옛 Pod가 빠진다.
      # 1로 두면 롤링 도중 용량이 먼저 줄어 부하 중 배포에서 에러가 난다.
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels: { app: flowticket-api }
    spec:
      # 앱의 SHUTDOWN_TIMEOUT(30s) + preStop(5s)보다 커야 한다. 작으면 진행 중 요청을
      # 마치기 전에 SIGKILL이 온다. graceful shutdown 설정이 무의미해지는 지점.
      terminationGracePeriodSeconds: 45

      # 같은 노드/AZ에 replica가 몰리면 노드 하나가 죽을 때 용량이 통째로 빠진다.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app: flowticket-api }

      containers:
        - name: api
          image: flowticket-api:REPLACE_TAG # kustomization.yaml의 images:가 덮어쓴다
          ports:
            - containerPort: 8080
              name: http
            # actuator 전용(아래 env MANAGEMENT_SERVER_PORT). Prometheus만 긁는다 — 인터넷에서 닿는 8080과 분리(TS-041).
            - containerPort: 8081
              name: management
          # 이 값을 바꾸면 이미 저장된 시각 데이터의 의미가 통째로 이동한다.
          # 엔티티는 LocalDateTime.now()(= 시스템 존의 벽시계)로 시각을 만들고, 응답 직렬화도
          # 같은 존으로 오프셋을 붙인다(JacksonConfig). 즉 "DB의 벽시계 = 컨테이너 존"이 전제다.
          # 지금 DB에는 UTC 벽시계가 쌓여 있으므로, Asia/Seoul로 바꾸면 기존 행 전부가 9시간
          # 어긋난다. 존을 정말 바꾸려면 Instant/timestamptz 전환을 Expand-Contract로 해야 한다.
          # 하네스 k8s 규칙 7)이 이 줄의 존재와 값을 강제한다.
          env:
            - name: TZ
              value: UTC
            # actuator 전용 관리 포트(TS-041). 인터넷에서 닿는 8080(Next rewrite /api/:path*)에서 actuator를 없앤다.
            # ConfigMap이 아니라 여기(파드 템플릿)에 둔다 — 아래 probe와 같은 템플릿이라 둘이 한 번에 바뀐다.
            # 공용 ConfigMap에 두면 옛 템플릿 파드(옛 probe /actuator/health/*:8080)가 새 값을 읽어 404 → 재시작 반복,
            # 새 템플릿이 옛 값을 읽으면 8080에 actuator가 조용히 남는 조합이 롤아웃·재시작·스케일 중에 생긴다.
            # 하네스 k8s 규칙 ⑩이 이 값(8080이 아닌 숫자)과 probe 위치를 강제한다.
            - name: MANAGEMENT_SERVER_PORT
              value: "8081"
          envFrom:
            - configMapRef: { name: flowticket-api-config }
            - secretRef: { name: flowticket-api-secrets } # 클러스터 밖에서 생성(k8s/README.md)

          # probe 경로는 application.yml의 health group과 한 쌍이다.
          #   readiness = readinessState, db, redis   (없으면 요청을 처리할 수 없는 의존성만)
          #   liveness  = livenessState               (외부 의존성 넣으면 DB 장애에 무한 재시작)
          # /readyz·/livez는 그 그룹의 메인 포트(8080) 추가 경로다. 관리 포트(8081)로 옮기지 않는다 —
          # 8081은 별도 톰캣이라 8080 요청 스레드가 포화돼도 성공해 버린다(아래 liveness 주석의 상황을 못 본다).
          readinessProbe:
            httpGet: { path: /readyz, port: 8080 }
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /livez, port: 8080 }
            periodSeconds: 10
            # 12회(첫 실패 후 약 110초): health 요청도 진입 요청과 같은 톰캣 스레드 풀(200)에서 처리된다. 측정 세션
            # 20261005-1440의 S-10K 재시험에서 liveness가 시간 초과돼(기본 timeoutSeconds 1초) 첫 실패 후 약 20초 만에
            # kubelet이 api 3개를 모두 재시작했고(이벤트, 실측), 그 재시작이 단계 6 판정을 막았다(IMP-024). 요청 스레드 포화(200)가
            # 지표로 잡힌 것은 그중 1개뿐이고 나머지 2개는 실패 무렵 표본이 없어, 같은 원인이라는 것은 진단 run에서 미루어 본 추론이다.
            # 스레드를 묶은 원인도 하나로 확정되지 않았다(Redis 응답 대기·DB 커넥션 대기·톰캣 등록 락 경합이 덤프에 함께 보임).
            # 이 값은 바쁜 파드를 죽이지 않게 하는 완화이고, 원인 제거는 따로 한다. 진짜로 멈춘 프로세스의 재시작은 그만큼 늦어진다.
            failureThreshold: 12
          # 기동이 느린 JVM을 liveness가 죽이지 않게 startupProbe로 분리한다.
          # liveness의 initialDelay를 늘리는 방식은 기동 후에도 계속 느슨해진다.
          startupProbe:
            httpGet: { path: /livez, port: 8080 }
            periodSeconds: 5
            failureThreshold: 30 # 최대 150초

          lifecycle:
            preStop:
              exec:
                # SIGTERM 직전에 잠깐 멈춘다. Pod 종료와 ALB 타깃 등록 해제는 비동기라,
                # 바로 내려가면 아직 우리를 향해 오는 요청이 502가 된다.
                # 5초가 그 창을 "덮는다"고 보장할 수는 없다. 등록 해제가 ALB에 반영되는
                # 시간은 우리가 정하는 값이 아니다. 이 유예는 드레이닝이 시작될 시간을 버는 것이고,
                # 실제로 충분한지는 롤링 중 무중단 실측(k6)으로 확인해야 한다.
                command: ["sh", "-c", "sleep 5"]

          resources:
            # requests = 스케줄러가 보는 예약분(HPA의 CPU 기준선이기도 하다).
            # limits.cpu는 두지 않는다. CPU는 압축 가능한 자원이라 limit을 걸면 스로틀링으로
            # p99가 튀고, 부하 실증에서 측정하려는 것이 바로 그 지연이다.
            # memory(IMP-023): 측정 세션 20261005-1440(실측)에서 단일 Pod(limit 1Gi)·SSE 50초 유지 3,000 연결에
            # working set 1,009MiB(한도 1,024MiB), 4,000 목표 run에서 동시 연결 약 3,300~3,500 시점에 OOMKilled,
            # S-10K(api 3, SSE 1만 연결 시도·열림 9,111)에서 api 2개가 OOMKilled돼 재시작으로 감사 로그가 사라져 단계 6을
            # 판정할 수 없었다. 어느 run에서도 힙은 한도에 닿지 않았다 — JVM 힙 소진이 아니라 컨테이너 한도 초과다.
            # 2Gi는 그 OOM 재시작을 없애 단계 6을 판정 가능한 조건으로 만들려는 다음 후보다 — 용량 산정값이 아니고,
            # 메모리를 S-10K의 최초 병목으로 확정한 것도 아니다(원인 귀속은 추론). 힙(MaxRAMPercentage=75)은 약 1.5GiB.
            # requests도 함께 올려 스케줄러가 노드 메모리를 실제 사용에 가깝게 예약하게 한다.
            requests: { cpu: "300m", memory: "1536Mi" }
            limits: { memory: "2Gi" }

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false # JVM 임시 파일 필요
            capabilities: { drop: ["ALL"] }
---
apiVersion: v1
kind: Service
metadata:
  name: flowticket-api
  namespace: flowticket
  annotations:
    # 공개 ALB가 대기열 두 경로를 이 Service로 보낸다(ADR-024). Ingress 전역 healthcheck-path `/`는 web용이라 api에서는 401 →
    # unhealthy가 된다. Service 주석이 Ingress 주석보다 우선한다. probe와 같은 메인 포트 readiness 경로를 본다(TS-041).
    alb.ingress.kubernetes.io/healthcheck-path: /readyz
  # ServiceMonitor의 selector가 보는 건 Service의 metadata.labels다(아래 spec.selector가 아니다.
  # 그건 Pod를 고르는 것). 없으면 매칭이 0건인데 에러가 아니라 그냥 타깃이 안 생긴다.
  labels: { app: flowticket-api }
spec:
  selector: { app: flowticket-api }
  ports:
    # ServiceMonitor는 포트를 이름으로 지정한다(spec.endpoints[].port = Service 포트 이름).
    # 이름이 없으면 매칭할 방법이 없어 타깃이 0개가 된다(에러는 나지 않는다).
    - name: http
      port: 80
      targetPort: 8080
    # Prometheus 스크레이프 전용(ServiceMonitor endpoints[].port: management). web의 rewrite는 80(→8080)만 쓴다.
    - name: management
      port: 8081
      targetPort: 8081
