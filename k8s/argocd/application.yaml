# ArgoCD Application: k8s/overlays/demo-local 을 클러스터에 지속 동기화한다(ADR-009).
# 측정·장애 대응 중 손으로 넣은 kubectl 변경이 드리프트로 남는 것을 막는다(TS-021 §6-1).
# 이 파일 자체는 ArgoCD가 관리하지 않고 한 번 적용한다(scripts/bring-up.sh, App-of-Apps는 두지 않는다).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: flowticket
  namespace: argocd
  finalizers:
    # Application을 지우면 배포된 리소스도 함께 정리한다.
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/gumwoo/first_come-first_served.git
    targetRevision: main
    # kustomize 오버레이를 가리킨다. base가 아니라 오버레이여야 이미지 태그·엔드포인트가 채워진다.
    path: k8s/overlays/demo-local
  destination:
    server: https://kubernetes.default.svc
    namespace: flowticket
  syncPolicy:
    # 자동 동기화는 두 전제가 모두 성립해야 한다.
    #  1) CI가 이미지 태그를 Git에 커밋한다(image.yml의 bump-tag). 없으면 새 이미지를 배포할 방법이 없다.
    #  2) sync가 HPA의 파드 수를 덮어쓰지 않는다(argocd-controller가 spec.replicas를 소유하지 않음).
    #     깨진 채로 selfHeal을 켜면 부하 중 스케일아웃이 자동으로 취소된다.
    automated:
      # 클러스터에서 손으로 바꾼 것을 Git 상태로 되돌린다. ArgoCD를 도입한 이유다(TS-021 §6-1).
      selfHeal: true
      # Git에서 지운 리소스를 클러스터에서도 지운다. 추적 대상은 Git 매니페스트와 1:1이라
      # 손으로 만든 k6-load Job·k6-scripts ConfigMap·pgcheck Pod는 지워지지 않는다.
      prune: true
    syncOptions:
      # base에 namespace.yaml이 있지만 순서 의존을 없앤다.
      - CreateNamespace=true
      # 필드 소유권 충돌을 줄인다.
      - ServerSideApply=true
      # RespectIgnoreDifferences=true 는 쓰지 않는다. 이 클러스터에서 sync를 막지 못했다(TS-022).
      # 실제 방어는 api-deployment.yaml에서 replicas 필드를 없앤 것이다.
  # diff 노이즈 제거용이다(HPA가 정한 replicas를 OutOfSync로 띄우지 않음). sync를 막지는 못한다.
  # name으로 하나씩 명시한다. kind 전체로 넓히면 새 Deployment의 replicas 드리프트까지 무시된다.
  ignoreDifferences:
    - group: apps
      kind: Deployment
      name: flowticket-api
      jsonPointers:
        - /spec/replicas
    - group: apps
      kind: Deployment
      name: flowticket-web
      jsonPointers:
        - /spec/replicas
    - group: apps
      kind: Deployment
      name: flowticket-api-queue  # 대기열 분리(B, k8s/components/queue-split)를 켰을 때만 있다 — ADR-027
      jsonPointers:
        - /spec/replicas
