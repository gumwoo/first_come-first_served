apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# 관측 리소스는 kube-prometheus-stack이 설치한 CRD에 의존한다. base에 넣으면 관측 스택보다 앱을 먼저
# 배포할 때 "no matches for kind ServiceMonitor"로 전체 apply가 실패하므로 분리한다.
# 적용은 helm 설치 뒤에 한다(scripts/bring-up.sh 순서).
resources:
  - servicemonitor-api.yaml
  - dashboard-flowticket.yaml
  - prometheusrule-flowticket.yaml
