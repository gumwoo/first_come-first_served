apiVersion: apps/v1
kind: Deployment
metadata:
  name: flowticket-web
  namespace: flowticket
spec:
  replicas: 2
  selector:
    matchLabels: { app: flowticket-web }
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  template:
    metadata:
      labels: { app: flowticket-web }
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: web
          image: flowticket-web:REPLACE_TAG
          ports:
            - containerPort: 3000
          # ⚠️ API_ORIGIN을 여기 두지 않는다 — **런타임 env로는 바뀌지 않는다.**
          # next.config.mjs의 rewrites()가 standalone 번들로 구워지기 때문이고,
          # 이 프로젝트가 실제로 겪은 일이다(apps/web/Dockerfile: 런타임 주입을 시도했더니
          # 빌드 때 값인 localhost:8080으로 프록시해 ECONNREFUSED). 그래서 이미지 빌드의
          # build-arg로 정한다(.github/workflows/image.yml).
          #
          # 여기에 넣으면 "설정한 것처럼 보이지만 아무 효과가 없는" 죽은 값이 된다.
          # Next.js standalone 서버에는 전용 헬스 엔드포인트가 없다. 루트 응답으로 갈음한다 —
          # "프로세스가 HTTP를 받는가"까지만 보는 것이고, 그 이상은 확인하지 않는다(정직).
          readinessProbe:
            httpGet: { path: /, port: 3000 }
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /, port: 3000 }
            periodSeconds: 15
            failureThreshold: 3
          lifecycle:
            preStop:
              exec: { command: ["sh", "-c", "sleep 5"] }
          resources:
            requests: { cpu: "100m", memory: "256Mi" }
            limits: { memory: "512Mi" }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
---
apiVersion: v1
kind: Service
metadata:
  name: flowticket-web
  namespace: flowticket
spec:
  selector: { app: flowticket-web }
  ports:
    - port: 80
      targetPort: 3000
