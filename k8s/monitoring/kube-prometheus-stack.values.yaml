# kube-prometheus-stack: 포트폴리오 데모용 최소 구성.
# 설치와 차트 버전($KPS_CHART_VERSION)은 scripts/bring-up.sh가 맡는다.

# 알림 수신처(Slack)와 함께 켠다. 없으면 DEAD 행·아웃박스 적체·블랙리스트 fail-open이 모두
# "누가 대시보드를 봐야 안다"로 끝난다(TS-032 §7, ADR-008, ADR-016 §관측).
alertmanager:
  enabled: true
  alertmanagerSpec:
    # webhook URL은 공개 저장소에 적지 않고 Secret을 파일로 마운트한다. Secret은 ExternalSecret이
    # SSM에서 만든다(k8s/external-secrets/externalsecret-alertmanager.yaml, 이름이 같아야 한다).
    # 마운트 경로 /etc/alertmanager/secrets/<시크릿 이름>/<키 이름>이 아래 api_url_file과 맞아야 한다.
    secrets: [flowticket-alert-slack]
    resources:
      requests: { cpu: 10m, memory: 64Mi }
      limits: { memory: 128Mi }
  config:
    global:
      resolve_timeout: 5m
    route:
      # 장애 하나에 메시지가 여러 개 오지 않게 같은 알림·네임스페이스를 한 묶음으로 보낸다.
      group_by: [alertname, namespace]
      group_wait: 30s      # 첫 알림 대기(연쇄를 한 번에 묶는다)
      group_interval: 5m   # 그룹에 새 알림이 붙었을 때 재발송 간격
      # 기본값 4h는 맞지 않는다. 데모 클러스터는 몇 시간만 떠 있어 재알림이 사실상 사라진다.
      repeat_interval: 1h
      receiver: slack
      routes:
        # Watchdog은 항상 발화하는 Dead Man's Switch라 Slack으로 보내면 계속 울린다. 외부 감시를
        # 붙이지 않았으므로 버리며, 그만큼 알림 파이프라인 자체의 죽음은 감지되지 않는다.
        # 이 라우트는 harness/alerts/check-alertmanager.sh가 CI에서 검사한다.
        - matchers: ['alertname="Watchdog"']
          receiver: "null"
    inhibit_rules:
      # 같은 대상에 critical이 울리는 동안 warning을 겹쳐 보내지 않는다.
      - source_matchers: ['severity="critical"']
        target_matchers: ['severity="warning"']
        equal: [alertname, namespace]
    receivers:
      - name: "null"
      - name: slack
        slack_configs:
          - api_url_file: /etc/alertmanager/secrets/flowticket-alert-slack/webhook-url
            # webhook URL 하나 = 채널 하나다. 규칙이 적어 한 채널로 받고 severity는 제목으로 구분한다.
            send_resolved: true
            title: '[{{ .Status | toUpper }}{{ if eq .Status "firing" }}:{{ .Alerts.Firing | len }}{{ end }}] {{ .CommonLabels.severity }}: {{ .CommonLabels.alertname }}'
            text: >-
              {{ range .Alerts }}*{{ .Annotations.summary }}*
              {{ .Annotations.description }}
              {{ if .Annotations.runbook_url }}<{{ .Annotations.runbook_url }}|runbook>{{ end }}
              {{ end }}

# EKS 컨트롤플레인은 관리형이라 scheduler·controller-manager를 스크랩할 수 없다. 차트 기본값대로 두면
# KubeSchedulerDown·KubeControllerManagerDown이 상시 오탐으로 울려 알림 전체가 무시된다.
# 스크랩(enabled)과 규칙(defaultRules)을 둘 다 꺼야 한다. 앞의 것만 끄면 규칙이 남아 계속 울린다.
# kubeProxy·kubeEtcd는 그대로 둔다(kube-proxy는 스크랩되고, etcd 규칙은 inactive로 남는다).
kubeScheduler:
  enabled: false
kubeControllerManager:
  enabled: false
defaultRules:
  rules:
    kubeSchedulerAlerting: false
    kubeSchedulerRecording: false
    kubeControllerManager: false

grafana:
  # 데모 클러스터는 수시로 재설치하므로 PVC를 잡지 않는다. UI에서 만든 대시보드는 남지 않으니
  # 직접 만든 대시보드는 dashboard-flowticket.yaml(ConfigMap)로 둔다.
  persistence: { enabled: false }
  # 인터넷에 노출하지 않는다. 접속은 kubectl port-forward로 한다.
  service: { type: ClusterIP }

prometheus:
  prometheusSpec:
    # 데모라 장기 보존이 필요 없다. 측정 창(부하 → 스케일업 → 회복)은 분 단위다.
    retention: 6h
    storageSpec:
      volumeClaimTemplate:
        spec:
          # 이 클러스터에는 기본 StorageClass가 없다(gp2는 있지만 default가 아니다, TS-016).
          # 생략하면 PVC가 Pending으로 멈추고 Prometheus Pod가 뜨지 않는다.
          storageClassName: gp2
          accessModes: ["ReadWriteOnce"]
          resources: { requests: { storage: 20Gi } }
    # release 라벨이 없는 ServiceMonitor도 잡게 한다. 기본값이면 selector가
    # `release: kube-prometheus-stack`으로 좁혀져 servicemonitor-api.yaml이 무시된다.
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    # PrometheusRule도 넓힌다. helm release 이름이 다르면 셀렉터가 어긋나 규칙이 로드되지 않고,
    # 오류 없이 "알림이 안 옴"으로만 나타난다.
    ruleSelectorNilUsesHelmValues: false
    # k6가 결과를 remote write로 밀어 넣게 한다(k6 run -o experimental-prometheus-rw).
    # 클라이언트·서버 지표를 같은 시간축에서 보고, k6 p95와 앱 히스토그램의 차이로 병목이
    # 앱 앞단(web·ALB)인지 가른다.
    enableRemoteWriteReceiver: true
    resources:
      requests: { cpu: 200m, memory: 1Gi }
      limits: { memory: 2Gi }
