# HPA는 CPU만 기준으로 삼는다. api·web 두 티어 모두 HPA 대상이다(→ web-hpa.yaml).
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: flowticket-api
  namespace: flowticket
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: flowticket-api }
  minReplicas: 3
  # 9(ADR-025): 10,000/s 진입 burst의 계산 용량(IMP-027)과 같다. requests 1100m라 api 하나가 노드 하나를 차지하므로
  # 3 → 9는 노드 3 → 9이고 CA가 붙인다. 오픈 전 사전 확장은 overlay event-prescale.yaml이 맡는다.
  # B(queue-split, ADR-027)에서는 component가 상한을 3으로 묶는다.
  # DB 커넥션 상한과 짝이다(TS-021, 하네스 backend 규칙 17): (9 + maxSurge 1) × 풀 5 = 50 ≤ 가용 56.
  maxReplicas: 9
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 60 }
  behavior:
    scaleUp:
      # 선착순 트래픽은 계단식으로 들어온다. 천천히 늘리면 스파이크를 못 받는다.
      stabilizationWindowSeconds: 0
    scaleDown:
      # 반대로 축소는 느리게. 빨리 줄이면 다음 파도에 다시 확장하느라 진동한다(flapping).
      stabilizationWindowSeconds: 300
