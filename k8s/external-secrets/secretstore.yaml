# 시크릿 출처 두 곳. 왜 나뉘는지가 중요하다.
#
#  ① SSM Parameter Store — 우리가 넣는 값 9개(JWT·OAuth·KOPIS·TOSS·관리자 계정).
#     Standard 티어 + SecureString은 **저장 비용이 없다**. 로테이션이 필요 없는 값이라
#     Secrets Manager를 쓸 이유가 없다.
#
#  ② Secrets Manager — DB 자격증명 2개. 우리가 넣는 게 아니라 **RDS가 마스터 암호를 관리**한다
#     (manage_master_user_password). 사람이 아는 값이 아니므로 옮길 수도, 옮길 이유도 없다.
#
# 둘 다 IRSA(jwt)로 인증한다 — 노드 역할이 아니라 이 ServiceAccount로 한정된다.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: aws-ssm
spec:
  provider:
    aws:
      service: ParameterStore
      region: ap-northeast-2
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: aws-secretsmanager
spec:
  provider:
    aws:
      service: SecretsManager
      region: ap-northeast-2
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
