# Grafana 대시보드를 ConfigMap으로 넣는다.
#
# kube-prometheus-stack의 grafana-sc-dashboard 사이드카가 `grafana_dashboard: "1"` 라벨이 붙은
# ConfigMap을 **모든 네임스페이스에서** 감시해 자동 로드한다(실측: LABEL=grafana_dashboard,
# LABEL_VALUE=1, NAMESPACE=ALL). 그래서 UI에서 손으로 임포트할 필요가 없고, 저장소에 커밋되므로
# 관측 스택을 재설치해도 되살아난다(Grafana는 persistence를 끈 상태다).
#
# ⚠️ 여기 쓰인 메트릭 이름은 전부 실제 /actuator/prometheus 출력에서 확인한 것만 넣었다.
# 없는 이름을 쓰면 에러가 아니라 **조용히 빈 패널**이 되기 때문이다. 실제로 처음 작성할 때
# http_server_requests_seconds_bucket이 없어(히스토그램 미설정) 지연을 sum/count 평균으로
# 냈었다. 같은 PR에서 application.yml에 percentiles-histogram을 켜고 p50/p95/p99로 바꿨다 —
# 이 대시보드는 그 설정과 한 쌍이라 따로 떼어 적용하면 백분위 패널이 비어 있게 된다.
apiVersion: v1
kind: ConfigMap
metadata:
  name: flowticket-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  flowticket.json: |
    {
      "title": "FlowTicket — API / Kafka / 런타임",
      "uid": "flowticket-api",
      "timezone": "browser",
      "refresh": "30s",
      "time": { "from": "now-1h", "to": "now" },
      "templating": {
        "list": [
          {
            "name": "DS",
            "type": "datasource",
            "query": "prometheus",
            "current": { "text": "Prometheus", "value": "Prometheus" },
            "hide": 0
          }
        ]
      },
      "panels": [
        {
          "type": "row", "title": "서비스 (HTTP)",
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 0 }
        },
        {
          "type": "timeseries", "title": "요청률 (outcome별)",
          "description": "outcome이 SUCCESS가 아닌 선이 올라오면 장애 신호다.",
          "datasource": { "type": "prometheus", "uid": "${DS}" },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 1 },
          "fieldConfig": { "defaults": { "unit": "reqps" }, "overrides": [] },
          "targets": [
            {
              "expr": "sum by(outcome) (rate(http_server_requests_seconds_count{job=\"flowticket-api\"}[5m]))",
              "legendFormat": "{{outcome}}", "refId": "A"
            }
          ]
        },
        {
          "type": "timeseries", "title": "응답시간 백분위 (p50 / p95 / p99)",
          "description": "파드별 버킷을 sum by(le)로 먼저 합친 뒤 계산해 서비스 전체 값이 된다 — 백분위는 파드끼리 평균낼 수 없다. 왼쪽 요청률과 **함께** 봐야 한다: 요청이 적으면 p99는 최악의 한두 건이 좌우해 크게 출렁인다. actuator는 Prometheus 스크레이프 트래픽이라 제외했다.",
          "datasource": { "type": "prometheus", "uid": "${DS}" },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 1 },
          "fieldConfig": { "defaults": { "unit": "s" }, "overrides": [] },
          "targets": [
            {
              "expr": "histogram_quantile(0.50, sum by(le) (rate(http_server_requests_seconds_bucket{job=\"flowticket-api\", uri!~\"/actuator.*\"}[5m])))",
              "legendFormat": "p50", "refId": "A"
            },
            {
              "expr": "histogram_quantile(0.95, sum by(le) (rate(http_server_requests_seconds_bucket{job=\"flowticket-api\", uri!~\"/actuator.*\"}[5m])))",
              "legendFormat": "p95", "refId": "B"
            },
            {
              "expr": "histogram_quantile(0.99, sum by(le) (rate(http_server_requests_seconds_bucket{job=\"flowticket-api\", uri!~\"/actuator.*\"}[5m])))",
              "legendFormat": "p99", "refId": "C"
            }
          ]
        },
        {
          "type": "timeseries", "title": "상한(2s) 초과 요청률",
          "description": "maximum-expected-value를 넘은 요청은 +Inf 버킷에 뭉쳐 백분위를 복구할 수 없다. 이 선이 0에서 뜨면 상한을 올려야 한다는 신호다 — 상한은 한 번 정하고 끝내는 값이 아니다.",
          "datasource": { "type": "prometheus", "uid": "${DS}" },
          "gridPos": { "h": 7, "w": 12, "x": 0, "y": 9 },
          "fieldConfig": { "defaults": { "unit": "reqps" }, "overrides": [] },
          "targets": [
            {
              "expr": "sum(rate(http_server_requests_seconds_bucket{job=\"flowticket-api\", uri!~\"/actuator.*\", le=\"+Inf\"}[5m])) - sum(rate(http_server_requests_seconds_bucket{job=\"flowticket-api\", uri!~\"/actuator.*\", le=\"2.0\"}[5m]))",
              "legendFormat": "2s 초과", "refId": "A"
            }
          ]
        },
        {
          "type": "timeseries", "title": "엔드포인트별 p95 (상위 5)",
          "description": "전체 p95가 튀었을 때 어느 경로인지 좁히는 용도. 좌석 선점·대기열처럼 경합이 있는 경로를 먼저 본다.",
          "datasource": { "type": "prometheus", "uid": "${DS}" },
          "gridPos": { "h": 7, "w": 12, "x": 12, "y": 9 },
          "fieldConfig": { "defaults": { "unit": "s" }, "overrides": [] },
          "targets": [
            {
              "expr": "topk(5, histogram_quantile(0.95, sum by(uri, le) (rate(http_server_requests_seconds_bucket{job=\"flowticket-api\", uri!~\"/actuator.*\"}[5m]))))",
              "legendFormat": "{{uri}}", "refId": "A"
            }
          ]
        },
        {
          "type": "row", "title": "Kafka — TS-020이 보이게 하는 자리",
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 16 }
        },
        {
          "type": "timeseries", "title": "Consumer lag (파티션별)",
          "description": "독성 메시지로 컨슈머가 무한 재시도에 빠지면 파드는 Running·readiness UP인데 이 선만 올라간다. TS-020을 kubectl top으로 우연히 발견했던 자리다.",
          "datasource": { "type": "prometheus", "uid": "${DS}" },
          "gridPos": { "h": 9, "w": 12, "x": 0, "y": 17 },
          "fieldConfig": { "defaults": { "unit": "short" }, "overrides": [] },
          "targets": [
            {
              "expr": "max by(topic, partition) (kafka_consumer_fetch_manager_records_lag{job=\"flowticket-api\"})",
              "legendFormat": "{{topic}} p{{partition}}", "refId": "A"
            }
          ]
        },
        {
          "type": "timeseries", "title": "리스너 처리율 (result별)",
          "description": "failure 선이 서면 재시도 소진 → DLT 경로가 도는 중이다.",
          "datasource": { "type": "prometheus", "uid": "${DS}" },
          "gridPos": { "h": 9, "w": 6, "x": 12, "y": 17 },
          "fieldConfig": { "defaults": { "unit": "ops" }, "overrides": [] },
          "targets": [
            {
              "expr": "sum by(result) (rate(spring_kafka_listener_seconds_count{job=\"flowticket-api\"}[5m]))",
              "legendFormat": "{{result}}", "refId": "A"
            }
          ]
        },
        {
          "type": "timeseries", "title": "마지막 리밸런스 이후 경과",
          "description": "값이 자꾸 0으로 떨어지면 리밸런스가 반복되는 것 — 컨슈머가 안정적으로 붙어 있지 못한 상태다.",
          "datasource": { "type": "prometheus", "uid": "${DS}" },
          "gridPos": { "h": 9, "w": 6, "x": 18, "y": 17 },
          "fieldConfig": { "defaults": { "unit": "s" }, "overrides": [] },
          "targets": [
            {
              "expr": "max(kafka_consumer_coordinator_last_rebalance_seconds_ago{job=\"flowticket-api\"})",
              "legendFormat": "경과", "refId": "A"
            }
          ]
        },
        {
          "type": "row", "title": "런타임 / 용량",
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 26 }
        },
        {
          "type": "timeseries", "title": "힙 사용량 (파드별)",
          "datasource": { "type": "prometheus", "uid": "${DS}" },
          "gridPos": { "h": 8, "w": 8, "x": 0, "y": 27 },
          "fieldConfig": { "defaults": { "unit": "bytes" }, "overrides": [] },
          "targets": [
            {
              "expr": "sum by(pod) (jvm_memory_used_bytes{job=\"flowticket-api\", area=\"heap\"})",
              "legendFormat": "{{pod}}", "refId": "A"
            }
          ]
        },
        {
          "type": "timeseries", "title": "GC 정지 빈도",
          "datasource": { "type": "prometheus", "uid": "${DS}" },
          "gridPos": { "h": 8, "w": 8, "x": 8, "y": 27 },
          "fieldConfig": { "defaults": { "unit": "ops" }, "overrides": [] },
          "targets": [
            {
              "expr": "sum by(pod) (rate(jvm_gc_pause_seconds_count{job=\"flowticket-api\"}[5m]))",
              "legendFormat": "{{pod}}", "refId": "A"
            }
          ]
        },
        {
          "type": "timeseries", "title": "프로세스 CPU",
          "description": "TS-020 때 파드 하나가 711m까지 태웠다. HPA가 이걸 부하로 오해해 스케일업했다.",
          "datasource": { "type": "prometheus", "uid": "${DS}" },
          "gridPos": { "h": 8, "w": 8, "x": 16, "y": 27 },
          "fieldConfig": { "defaults": { "unit": "percentunit" }, "overrides": [] },
          "targets": [
            {
              "expr": "process_cpu_usage{job=\"flowticket-api\"}",
              "legendFormat": "{{pod}}", "refId": "A"
            }
          ]
        },
        {
          "type": "timeseries", "title": "DB 커넥션 (active / pending)",
          "description": "pending이 서면 풀이 말랐다는 뜻 — 커넥션 대기가 곧 응답 지연이 된다.",
          "datasource": { "type": "prometheus", "uid": "${DS}" },
          "gridPos": { "h": 8, "w": 8, "x": 0, "y": 35 },
          "fieldConfig": { "defaults": { "unit": "short" }, "overrides": [] },
          "targets": [
            {
              "expr": "sum(hikaricp_connections_active{job=\"flowticket-api\"})",
              "legendFormat": "active", "refId": "A"
            },
            {
              "expr": "sum(hikaricp_connections_pending{job=\"flowticket-api\"})",
              "legendFormat": "pending", "refId": "B"
            }
          ]
        },
        {
          "type": "timeseries", "title": "JVM 스레드",
          "datasource": { "type": "prometheus", "uid": "${DS}" },
          "gridPos": { "h": 8, "w": 8, "x": 8, "y": 35 },
          "fieldConfig": { "defaults": { "unit": "short" }, "overrides": [] },
          "targets": [
            {
              "expr": "jvm_threads_live_threads{job=\"flowticket-api\"}",
              "legendFormat": "{{pod}}", "refId": "A"
            }
          ]
        },
        {
          "type": "timeseries", "title": "HPA 레플리카 (현재 / 희망)",
          "description": "kube-state-metrics 출처. 앱 메트릭이 아니라 클러스터 상태다.",
          "datasource": { "type": "prometheus", "uid": "${DS}" },
          "gridPos": { "h": 8, "w": 8, "x": 16, "y": 35 },
          "fieldConfig": { "defaults": { "unit": "short" }, "overrides": [] },
          "targets": [
            {
              "expr": "kube_horizontalpodautoscaler_status_current_replicas{namespace=\"flowticket\"}",
              "legendFormat": "현재", "refId": "A"
            },
            {
              "expr": "kube_horizontalpodautoscaler_status_desired_replicas{namespace=\"flowticket\"}",
              "legendFormat": "희망", "refId": "B"
            }
          ]
        }
      ]
    }
