# 클러스터 안에서 k6를 돌리는 Job. Service(http://flowticket-api)로 직접 쏴
# 인터넷 RTT·TLS·집 회선 포화가 측정값에 섞이지 않게 한다.
#
# 사용법:
#   kubectl create configmap k6-scripts -n flowticket \
#     --from-file=lib.js=infra/k6/lib.js --from-file=read-load.js=infra/k6/read-load.js \
#     --dry-run=client -o yaml | kubectl apply -f -
#   kubectl apply -f infra/k6/k6-job.yaml
#   kubectl logs -n flowticket job/k6-load -f
#   kubectl delete job k6-load -n flowticket
#
# VU/시간은 아래 env로 바꾼다. 개선 전후를 비교할 때는 같은 값으로 돌려야 한다.
# 개별 변경의 효과는 포화 전 구간(50 VU)에서 잰다. 300 VU는 이미 포화라 한계 확인용으로만 쓴다.
apiVersion: batch/v1
kind: Job
metadata:
  name: k6-load
  namespace: flowticket
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: k6
          image: grafana/k6:0.54.0
          args: ["run", "/scripts/read-load.js"]
          env:
            # lib.js의 BASE. Service는 80만 열므로 포트를 붙이지 않는다.
            - { name: K6_BASE_URL, value: "http://flowticket-api" }
            - { name: K6_VUS, value: "50" }
            - { name: K6_DURATION, value: "60s" }
          volumeMounts:
            - { name: scripts, mountPath: /scripts }
      volumes:
        - name: scripts
          configMap: { name: k6-scripts }
