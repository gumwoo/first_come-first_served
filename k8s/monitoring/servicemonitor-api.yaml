apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: flowticket-api
  namespace: flowticket
spec:
  # Service의 라벨을 고른다(Pod 라벨이 아니다). ServiceMonitor는 Service를 통해
  # Endpoints를 찾아 Pod IP로 직접 스크레이프한다. Service의 로드밸런싱을 타지
  # 않으므로 3개 Pod가 각각 별도 타깃이 된다(그래야 Pod별 JVM/스레드를 구분한다).
  selector:
    matchLabels: { app: flowticket-api }
  namespaceSelector:
    matchNames: ["flowticket"]
  endpoints:
    # Service 포트 이름으로 지정한다(번호가 아니다): k8s/base/api-deployment.yaml의 `name: management`(8081).
    - port: management
      path: /actuator/prometheus
      interval: 15s
      # 스크레이프는 인증 없이 나간다. SecurityConfig가 이 한 경로만 permitAll이다. 클러스터 내부 전용인 이유는
      # 포트다 — actuator는 관리 포트(8081)에만 있고, 인터넷에서 닿는 경로(ALB → web → Next rewrite)는 8080만 쓴다(TS-041).
