# flowticket-api-secrets 를 AWS에서 동기화한다. 지금까지 유일하게 "매니페스트로 복구되지 않던"
# 리소스였다 — 클러스터를 재생성할 때마다 사람이 값 11개를 손으로 넣었다.
#
# 출처가 둘인데 **Secret은 하나**여야 한다(Deployment의 envFrom이 하나를 참조).
# ESO는 data 항목마다 sourceRef로 다른 스토어를 지정할 수 있어 쪼갤 필요가 없다.
#
#   9개  ← SSM Parameter Store   (우리가 넣는 값. SecureString/Standard = 저장 비용 0)
#   2개  ← Secrets Manager       (DB 자격증명. RDS가 마스터 암호를 관리하므로 사람이 모른다)
#
# ⚠️ 전환은 **새 이름으로 먼저 만들어 키·바이트 수를 비교한 뒤** 바꿨다. 같은 이름으로 바로
# 걸었다가 값이 하나라도 틀리면 전체 api 파드가 기동에 실패한다(2026-08-11 아침에 플레이스홀더가
# 그대로 들어가 겪은 것과 같은 유형). 비교 결과 11개 전부 일치를 확인하고 전환했다.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: flowticket-api-secrets
  namespace: flowticket
spec:
  # AWS에서 값이 바뀌면 이 주기로 따라온다. 짧게 잡을 이유가 없다(API 호출·한도).
  refreshInterval: 1h
  secretStoreRef:
    name: aws-ssm
    kind: ClusterSecretStore
  target:
    name: flowticket-api-secrets
    creationPolicy: Owner
  data:
    - { secretKey: ADMIN_EMAIL, remoteRef: { key: /flowticket/ADMIN_EMAIL } }
    - { secretKey: ADMIN_PASSWORD, remoteRef: { key: /flowticket/ADMIN_PASSWORD } }
    - { secretKey: JWT_SECRET, remoteRef: { key: /flowticket/JWT_SECRET } }
    - { secretKey: KAKAO_CLIENT_ID, remoteRef: { key: /flowticket/KAKAO_CLIENT_ID } }
    - { secretKey: KAKAO_CLIENT_SECRET, remoteRef: { key: /flowticket/KAKAO_CLIENT_SECRET } }
    - { secretKey: NAVER_CLIENT_ID, remoteRef: { key: /flowticket/NAVER_CLIENT_ID } }
    - { secretKey: NAVER_CLIENT_SECRET, remoteRef: { key: /flowticket/NAVER_CLIENT_SECRET } }
    - { secretKey: KOPIS_SERVICE_KEY, remoteRef: { key: /flowticket/KOPIS_SERVICE_KEY } }
    - { secretKey: TOSS_SECRET_KEY, remoteRef: { key: /flowticket/TOSS_SECRET_KEY } }
    # DB 2개만 스토어가 다르다. RDS가 만든 시크릿은 {"username":..,"password":..} JSON이라
    # property로 꺼낸다.
    - secretKey: DB_USERNAME
      sourceRef:
        storeRef: { name: aws-secretsmanager, kind: ClusterSecretStore }
      remoteRef:
        key: rds!db-5efa0f45-d894-4b23-8441-8e5985fb5b13
        property: username
    - secretKey: DB_PASSWORD
      sourceRef:
        storeRef: { name: aws-secretsmanager, kind: ClusterSecretStore }
      remoteRef:
        key: rds!db-5efa0f45-d894-4b23-8441-8e5985fb5b13
        property: password
