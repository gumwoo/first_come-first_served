apiVersion: apps/v1
kind: Deployment
metadata:
  name: flowticket-web
  namespace: flowticket
spec:
  # replicas를 두지 않는다. web-hpa.yaml이 소유한다(하네스 규칙 8)).
  # Git에 값을 두면 ArgoCD가 sync할 때마다 HPA가 정한 파드 수를 덮어쓴다(TS-022).
  selector:
    matchLabels: { app: flowticket-web }
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  template:
    metadata:
      labels: { app: flowticket-web }
    spec:
      # api보다 낮은 우선순위 — 노드 자리가 없을 때 api가 web을 밀어낼 수 있다(web-priorityclass.yaml, ADR-025 보충).
      priorityClassName: flowticket-web-low
      # preStop(25s) + Next.js 종료 시간보다 커야 SIGKILL이 앞지르지 않는다. 30이면 preStop 도중에 강제 종료된다.
      terminationGracePeriodSeconds: 60

      # 노드 단위는 DoNotSchedule로 강제한다. web이 한 노드에 몰리면 그 노드를 잃을 때 web이 전멸한다(IMP-034 §8).
      # 다른 노드에 자리가 없으면 Pending → Cluster Autoscaler 증설로 푼다(ScheduleAnyway는 같은 노드에 놓아 위험이 남는다).
      # zone은 선호(ScheduleAnyway)만 둔다 — AZ 단위 강제는 노드 그룹이 AZ별이라 증설 경로가 좁아져 Pending이 길어질 수 있다(추론).
      # matchLabelKeys(pod-template-hash): 롤링 중 같은 리비전 파드끼리만 센다. 없으면 surge 파드가 "web이 없는 노드"를 요구해
      # 노드 그룹이 상한일 때 롤아웃이 Pending으로 멈출 수 있다.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels: { app: flowticket-web }
          matchLabelKeys: [pod-template-hash]
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app: flowticket-web }
      containers:
        - name: web
          image: flowticket-web:REPLACE_TAG
          ports:
            - containerPort: 3000
          # API_ORIGIN을 여기 두지 않는다. next.config.mjs의 rewrites()가 standalone 번들로 구워져 런타임 env로는 바뀌지 않고,
          # 이미지 빌드의 build-arg로 정한다(.github/workflows/image.yml). 넣으면 효과 없는 죽은 값이 된다(하네스 규칙 4).
          #
          # Next.js standalone 서버에는 전용 헬스 엔드포인트가 없어 루트 응답으로 갈음한다 — "프로세스가 HTTP를 받는가"까지만 본다.
          readinessProbe:
            httpGet: { path: /, port: 3000 }
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /, port: 3000 }
            periodSeconds: 15
            failureThreshold: 3
          lifecycle:
            # 롤링 중 502/504가 10초 연결 타임아웃에 몰리고 애플리케이션 5xx는 0이어서, 등록 해제 전파(EndpointSlice → LB 컨트롤러 → ALB) 전에
            # 파드가 먼저 응답을 멈춘 것으로 보고 5s에서 늘렸다(종료 유예 60s 함께, 실패 13·16건 → 0건). 기전은 추론이고 다른 환경에서는 5s도 0건이었다(TS-035 §9).
            # deregistration_delay와는 다른 값이다. 25s는 넉넉히 잡은 값이고, 실패가 난 환경에서의 최소 필요값은 재지 못했다.
            preStop:
              exec: { command: ["sh", "-c", "sleep 25"] }
          resources:
            # requests는 상한이 아니라 예약이다. 노드 배치는 web-hpa.yaml 주석 — api가 노드당 하나라 web 자리가 노드별로 좁다(ADR-025).
            requests: { cpu: "300m", memory: "256Mi" }
            limits: { memory: "512Mi" }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
---
apiVersion: v1
kind: Service
metadata:
  name: flowticket-web
  namespace: flowticket
spec:
  selector: { app: flowticket-web }
  ports:
    - port: 80
      targetPort: 3000
