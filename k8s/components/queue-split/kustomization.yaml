# 대기열 분리(B, ADR-027 — 운영 기본값). overlay의 components:에 넣으면 켜지고, 빼면 A'(통합)다.
#   - 대기열 전용 Deployment·HPA·PDB를 더한다(같은 이미지)
#   - flowticket-api-queue Service가 api 파드 대신 대기열 전용 파드를 가리키게 하고, 메트릭 수집 라벨을 붙인다
#   - api HPA 상한을 3으로 묶어 파드 예산을 A'와 같은 9로 맞춘다(DB 커넥션 상한 — 하네스 backend 규칙 17)
# Ingress는 건드리지 않는다(하네스 k8s 규칙 2-b). 켠 동안 사전 확장(event-prescale.yaml)은 대기열 HPA(flowticket-api-queue)를
# 대상으로 한다 — api HPA 하한을 올리면 하한 > 상한 3이 된다(하네스 k8s 규칙 11이 막는다).
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

resources:
  - queue-deployment.yaml
  - queue-hpa.yaml
  - queue-pdb.yaml

patches:
  - target: { kind: Service, name: flowticket-api-queue }
    patch: |
      - op: replace
        path: /spec/selector
        value: { app: flowticket-api-queue }
      - op: add
        path: /metadata/labels/flowticket.io~1metrics
        value: "true"
  - target: { kind: HorizontalPodAutoscaler, name: flowticket-api }
    patch: |
      - op: replace
        path: /spec/maxReplicas
        value: 3
