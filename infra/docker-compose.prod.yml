# 운영 이미지 로컬 검증용. 실제 빌드된 이미지로 전체 스택을 띄워 EKS 전에 컨테이너 안 동작을 확인한다
# (외부 주소 env 주입, readiness, web→api 프록시).
#
#   docker compose -f infra/docker-compose.prod.yml up --build
#
# 비밀은 .env 또는 셸 환경에서 주입한다(이 파일에 실제 값을 적지 않는다).

name: flowticket-prod

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: flowticket
      POSTGRES_USER: flowticket
      POSTGRES_PASSWORD: ${DB_PASSWORD:-flowticket}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flowticket -d flowticket"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - pgdata-prod:/var/lib/postgresql/data

  redis:
    image: redis:7.4
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    image: flowticket-api:local
    environment:
      # 외부 주소는 전부 env로(컨테이너에서 localhost는 그 컨테이너 자신).
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: flowticket
      DB_USERNAME: flowticket
      DB_PASSWORD: ${DB_PASSWORD:-flowticket}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # 비밀은 셸/.env에서 주입. JWT_SECRET은 없으면 기동 실패하므로 검증용 기본값을 둔다.
      JWT_SECRET: ${JWT_SECRET:-local-prod-verify-secret-0123456789-0123456789}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      KOPIS_SERVICE_KEY: ${KOPIS_SERVICE_KEY:-}
      PAYMENT_GATEWAY: ${PAYMENT_GATEWAY:-mock}
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        # rewrites는 standalone 번들에 구워지므로 빌드 시점에 넣어야 한다(apps/web/Dockerfile).
        API_ORIGIN: http://api:8080
    image: flowticket-web:local
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata-prod:
