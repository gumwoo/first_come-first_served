# web 수평 확장. 600 rps 실측에서 첫 실패 지점이 web 티어였다(ALB → web target 구간,
# ELB_5XX == TargetConnectionError, Target_5XX 0). api만 늘려도 앞단 web이 막히면 502가 난다.
#
# 노드 예산(ADR-025 이후): api는 requests 1000m로 노드당 하나라 노드 수를 정하고(CA), web은 그 노드들의 남는 자리에 들어간다.
# 평상시(api 3·노드 3): api 3×1000 + web 2×300 + 기타 약 1,760(측정 세션 20261007-e2e, 노드별 410~750m) = 5,360m / 5,790m(계산값).
# web이 4로 늘거나 롤링 surge(api +1000m)가 겹치면 남는 자리가 없어 CA가 노드를 붙인다 — 노드 3대 안에 가두던 이전 예산식은 더 쓰지 않는다.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: flowticket-web
  namespace: flowticket
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: flowticket-web }
  minReplicas: 2
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        # api와 같은 기준을 쓴다. requests 300m 기준 180m을 넘으면 확장.
        # 실측상 600 rps에서 web은 파드당 약 0.59 core를 썼다. 4파드로도 타깃(180m)에
        # 도달하지 못하고 상한에 붙을 가능성이 높다. 그때는 노드 추가 없이는 더 못 늘린다.
        target: { type: Utilization, averageUtilization: 60 }
  behavior:
    scaleUp:
      # api와 같은 이유: 선착순 트래픽은 계단식으로 들어온다.
      stabilizationWindowSeconds: 0
    scaleDown:
      stabilizationWindowSeconds: 300
