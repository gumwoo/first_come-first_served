apiVersion: apps/v1
kind: Deployment
metadata:
  name: flowticket-web
  namespace: flowticket
spec:
  # replicas를 두지 않는다 — web-hpa.yaml이 소유한다(하네스 규칙 8)).
  # Git에 값을 두면 ArgoCD가 sync할 때마다 HPA가 정한 파드 수를 덮어쓴다(TS-022).
  selector:
    matchLabels: { app: flowticket-web }
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  template:
    metadata:
      labels: { app: flowticket-web }
    spec:
      # preStop(25s) + Next.js 종료 시간보다 커야 SIGKILL이 앞지르지 않는다. 30이면
      # preStop 도중에 강제 종료돼 오히려 더 나빠진다.
      terminationGracePeriodSeconds: 60
      containers:
        - name: web
          image: flowticket-web:REPLACE_TAG
          ports:
            - containerPort: 3000
          # API_ORIGIN을 여기 두지 않는다 — 런타임 env로는 바뀌지 않는다.
          # next.config.mjs의 rewrites()가 standalone 번들로 구워지기 때문이다.
          # 이미지 빌드의 build-arg로 정한다(.github/workflows/image.yml).
          #
          # 여기에 넣으면 "설정한 것처럼 보이지만 아무 효과가 없는" 죽은 값이 된다.
          # Next.js standalone 서버에는 전용 헬스 엔드포인트가 없다. 루트 응답으로 갈음한다 —
          # "프로세스가 HTTP를 받는가"까지만 보는 것이고, 그 이상은 확인하지 않는다.
          readinessProbe:
            httpGet: { path: /, port: 3000 }
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /, port: 3000 }
            periodSeconds: 15
            failureThreshold: 3
          lifecycle:
            # preStop이 짧으면 롤링 중 5xx가 난다(TS-035).
            #
            # ALB는 target-type: ip라 파드 IP를 직접 등록한다. 파드가 종료될 때
            #   파드 Terminating → EndpointSlice에서 제거 → LB 컨트롤러 조정
            #   → ALB 타깃이 deregistering으로 전환
            # 이 전파가 끝나기 전에 preStop(5s)이 끝나면 컨테이너가 먼저 죽는다.
            # 그 구간에서 ALB는 그 IP를 아직 정상 타깃으로 보고 새 요청을 보내고,
            # 연결이 맺히지 않아 ALB 연결 타임아웃(10초)에 걸려 504/502가 된다.
            # 그래서 Target_5XX는 0이다 — 앱이 낸 5xx가 아니다.
            #
            # deregistration_delay(10s)와 혼동하지 말 것. 그것은 타깃이 deregistering이
            # 된 뒤 진행 중인 연결을 마무리하는 드레이닝 시간이고, 그 동안 ALB는 새 요청을
            # 보내지 않는다. 줄여도 이 문제는 해결되지 않으며 오히려 나빠진다.
            # 늘려야 하는 것은 컨테이너가 살아 있는 시간이다.
            #
            # 실측(25 rps, web 단독 rollout restart, 6,001건):
            #   preStop 5s  → 13건 실패 (504 6 / 502 7, TargetConnectionError 7)
            #   preStop 25s → 0건
            #
            # 25s는 전파 시간을 넉넉히 덮으려고 잡은 값이다. 전파에 실제로 얼마가 걸리는지,
            # 최소 필요값이 얼마인지는 재지 않았다.
            preStop:
              exec: { command: ["sh", "-c", "sleep 25"] }
          resources:
            # 부하 실측에서 파드당 0.16~0.59 core를 썼다. 300m은 최대보다 낮지만 api max 7과 함께
            # 노드 allocatable(5,790m) 안에 들어가는 값이다. requests는 상한이 아니라 예약이다.
            requests: { cpu: "300m", memory: "256Mi" }
            limits: { memory: "512Mi" }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
---
apiVersion: v1
kind: Service
metadata:
  name: flowticket-web
  namespace: flowticket
spec:
  selector: { app: flowticket-web }
  ports:
    - port: 80
      targetPort: 3000
