apiVersion: apps/v1
kind: Deployment
metadata:
  name: flowticket-web
  namespace: flowticket
spec:
  replicas: 2
  selector:
    matchLabels: { app: flowticket-web }
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  template:
    metadata:
      labels: { app: flowticket-web }
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: web
          image: flowticket-web:REPLACE_TAG
          ports:
            - containerPort: 3000
          env:
            # 브라우저가 부르는 주소라 클러스터 내부 DNS가 아니라 공개 도메인이어야 한다.
            - name: NEXT_PUBLIC_API_BASE_URL
              value: "https://flow-ticket.com/api"
          # Next.js standalone 서버에는 전용 헬스 엔드포인트가 없다. 루트 응답으로 갈음한다 —
          # "프로세스가 HTTP를 받는가"까지만 보는 것이고, 그 이상은 확인하지 않는다(정직).
          readinessProbe:
            httpGet: { path: /, port: 3000 }
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /, port: 3000 }
            periodSeconds: 15
            failureThreshold: 3
          lifecycle:
            preStop:
              exec: { command: ["sh", "-c", "sleep 5"] }
          resources:
            requests: { cpu: "100m", memory: "256Mi" }
            limits: { memory: "512Mi" }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
---
apiVersion: v1
kind: Service
metadata:
  name: flowticket-web
  namespace: flowticket
spec:
  selector: { app: flowticket-web }
  ports:
    - port: 80
      targetPort: 3000
